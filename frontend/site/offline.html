<style>
:root{--ink:#0D1424;--ink-soft:#5A657C;--paper:#F6F7FB;--card:#FFF;--line:#E4E8F2;--brand:#1B4DFF}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Plus Jakarta Sans",system-ui,sans-serif;background:var(--paper);color:var(--ink);
  min-height:100vh;display:grid;place-items:center;padding:24px;line-height:1.6}
.box{max-width:420px;text-align:center}
.dish{font-size:60px;line-height:1;margin-bottom:18px;opacity:.9}
h1{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;
  font-size:30px;letter-spacing:-.035em;line-height:1.15}
p{font-size:15px;color:var(--ink-soft);margin-top:12px}
.can{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:18px;margin-top:24px;text-align:left}
.can b{font-size:13px;font-weight:700;display:block;margin-bottom:11px}
.can a{display:flex;align-items:center;gap:11px;padding:12px;border-radius:13px;
  background:var(--paper);border:1px solid var(--line);text-decoration:none;
  color:var(--ink);font-size:14.5px;font-weight:600;margin-bottom:8px}
.can a:last-child{margin-bottom:0}
.can a span{font-size:20px}
.retry{margin-top:20px;padding:14px 28px;border-radius:14px;background:var(--ink);
  color:#fff;font-weight:700;font-size:14.5px;border:none;cursor:pointer;font-family:inherit}
.small{font-size:12.5px;color:var(--ink-soft);margin-top:18px;line-height:1.6}

/* ---------- phone layout ---------- */
@media (max-width: 560px){
  /* Nothing may be wider than the screen. One stray element makes the whole
     page scroll sideways, which feels broken even when nothing else is. */
  html, body{overflow-x:hidden;max-width:100vw}

  .top, .topbar{padding:10px 12px;gap:6px}
  .top b, .topbar b, .brandbar b{font-size:15px}
  .top .chip, .topbar .chip, .brandbar img{width:28px;height:28px}

  /* The wordmark goes; the logo alone is enough on a small screen. */
  .brandbar b{display:none}

  .gear{width:36px;height:36px}
  .langwrap{padding:4px 7px 4px 8px}
  .langwrap select, .langwrap #langSel{max-width:60px;font-size:12.5px}
  .acctbtn, .who{max-width:96px;font-size:11.5px;padding:5px 10px 5px 5px}
  .acctbtn img, .acctbtn .ini{width:21px;height:21px;font-size:10px}

  /* Cards to the edge, with the padding on the page instead. */
  .wrap{padding-left:14px;padding-right:14px}
  .hello{padding:18px 16px;border-radius:20px}
  .hello .t b{font-size:19px}
  .hellolines .ln{flex-wrap:wrap;gap:4px}
  .hellolines .ln .k{min-width:78px;font-size:12.5px}
  .hellolines .ln .v{font-size:13.5px}
  .hellolines .today2{font-size:14.5px}

  .grid2{grid-template-columns:1fr 1fr;gap:9px}
  .tiles{gap:9px}
  .slide{min-height:200px;padding:20px}
  .slide h3{font-size:22px}
  .about{padding:20px 16px}
  .about .contact{grid-template-columns:1fr;gap:8px}
  .about .contact a{display:flex;align-items:center;gap:12px;text-align:left;padding:12px}
  .about .contact .ic2{margin:0}
  .about .pic{width:66px;height:66px;border-radius:20px}

  .row, .row3b, .two{grid-template-columns:1fr}
  .row3b .swap{width:100%;height:38px}
  .keys{gap:5px}
  .keys button{padding:12px 0;font-size:14px}
}

@media (max-width: 380px){
  .grid2{grid-template-columns:1fr}
  .hello .av{width:48px;height:48px}
  .hello .t b{font-size:17px}
}

/* ---------- bell ---------- */
.bellbtn{position:relative;width:34px;height:34px;border-radius:11px;background:var(--card,#fff);
  border:1px solid var(--line,#E4E8F2);display:grid;place-items:center;color:var(--ink-soft,#5A657C);
  flex:0 0 auto}
.bellbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.bellbtn .dot4{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 3px;
  border-radius:99px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:800;
  display:none;align-items:center;justify-content:center;line-height:1}
.bellbtn.has .dot4{display:flex}

.belldrop{position:fixed;top:58px;right:12px;left:12px;max-width:380px;margin-left:auto;
  z-index:200;background:var(--card,#fff);border:1px solid var(--line,#E4E8F2);
  border-radius:18px;box-shadow:0 16px 40px rgba(13,20,36,.24);display:none;
  max-height:70vh;overflow-y:auto}
.belldrop.on{display:block}
.belldrop .hd5{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line,#E4E8F2)}
.belldrop .hd5 b{font-family:var(--display,inherit);font-weight:800;font-size:14.5px}
.belldrop .hd5 button{margin-left:auto;font-size:11.5px;color:var(--brand,#1B4DFF);font-weight:700}
.nitem3{display:block;padding:12px 16px;border-bottom:1px solid var(--line,#E4E8F2);
  text-decoration:none;color:inherit}
.nitem3:last-child{border-bottom:none}
.nitem3.unread{background:rgba(27,77,255,.04)}
.nitem3 p{font-size:13px;line-height:1.5}
.nitem3 small{display:block;font-size:11px;color:var(--ink-soft,#5A657C);margin-top:4px}
.nempty{padding:30px 16px;text-align:center;font-size:13px;color:var(--ink-soft,#5A657C)}
</style>

<body>
<div class="box">
  <div class="dish">&#128246;</div>
  <h1>You&rsquo;re offline</h1>
  <p>No connection right now. A few things still work without one.</p>

  <div class="can">
    <b>Available offline</b>
    <a href="/games"><span>&#127918;</span> Tic-tac-toe</a>
    <a href="/zodiac"><span>&#9800;</span> Star signs</a>
    <a href="/vibe"><span>&#128302;</span> Vibe check</a>
  </div>

  <button class="retry" onclick="location.reload()">Try again</button>

  <p class="small">Courses, the blood bank, the leaderboards and the weather
  need a connection &mdash; they are answered by the server, not stored here.</p>
</div>

<script>
// Come back on its own the moment the connection returns, rather than making
// somebody sit here tapping.
window.addEventListener("online", function(){ location.href = "/"; });
</script>

<script>
/* Bell: notifications for anyone signed in. One widget, shared by every
   page - reads /api/notify/mine/ and polls it, so a page open in one tab
   picks up something that happened in another. */
(function(){
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }

  // The home gear button exists on nearly every page (added widely across
  // the site earlier), which makes it a far more reliable anchor than any
  // one page's account-button markup.
  var anchor = document.querySelector('[aria-label="Home"]') || document.querySelector(".gear");
  if (!anchor) return;

  fetch("/api/auth/me/", {credentials:"same-origin"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u) return;   // signed out: nothing to show a bell for

      var bell = document.createElement("button");
      bell.className = "bellbtn";
      bell.setAttribute("aria-label", "Notifications");
      bell.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>'
        + '<path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot4"></span>';
      anchor.parentNode.insertBefore(bell, anchor);
      wireBell(bell);
    })
    .catch(function(){});

  function wireBell(bell){

  var drop = document.createElement("div");
  drop.className = "belldrop";
  document.body.appendChild(drop);

  function load(){
    fetch("/api/notify/mine/", {credentials:"same-origin"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d) return;
        bell.classList.toggle("has", d.unread > 0);
        bell.querySelector(".dot4").textContent = d.unread > 9 ? "9+" : d.unread;

        var h = '<div class="hd5"><b>Notifications</b>'
          + (d.unread ? '<button id="markall">Mark all read</button>' : '') + '</div>';
        if (!d.notifications.length){
          h += '<div class="nempty">Nothing yet.</div>';
        } else {
          h += d.notifications.map(function(n){
            return '<a class="nitem3' + (n.read ? "" : " unread") + '" href="'
              + esc(n.link || "#") + '" data-nid="' + n.id + '">'
              + '<p>' + esc(n.text) + '</p><small>' + esc(n.when) + '</small></a>';
          }).join("");
        }
        drop.innerHTML = h;
      })
      .catch(function(){});
  }

  bell.addEventListener("click", function(e){
    e.stopPropagation();
    drop.classList.toggle("on");
    if (drop.classList.contains("on")) load();
  });
  document.addEventListener("click", function(e){
    if (!drop.contains(e.target) && e.target !== bell) drop.classList.remove("on");
  });
  drop.addEventListener("click", function(e){
    var mark = e.target.closest("#markall");
    if (mark){
      e.preventDefault();
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:"{}"}).then(load);
      return;
    }
    var item = e.target.closest("[data-nid]");
    if (item){
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:JSON.stringify({id: item.getAttribute("data-nid")})});
    }
  });

  load();
  setInterval(load, 45000);
  }
})();
</script>
</body>
