<script>
(function(){
  "use strict";
  var selecting = false, sel = {};
  var threads = [], current = null, lastId = 0, seenUpto = 0, poll = null, listPoll = null, typedAt = 0, sending = false;

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }
  function api(p,o){
    o=o||{};
    var h={};
    if (!(o.body instanceof FormData)) h["Content-Type"]="application/json";
    if(o.method&&o.method!=="GET") h["X-CSRFToken"]=cookie("xc_csrf");
    return fetch("/api/notify"+p,{method:o.method||"GET",headers:h,credentials:"same-origin",
      body:o.body?(o.body instanceof FormData?o.body:JSON.stringify(o.body)):undefined})
      .then(function(r){return r.json().catch(function(){return{};})
        .then(function(d){return{ok:r.ok,status:r.status,data:d};});})
      .catch(function(){return{ok:false,data:{}};});
  }
  function $(id){ return document.getElementById(id); }

  function renderList(){
    var box = $("list5");
    if (!threads.length){
      box.innerHTML = '<div class="empty8">No conversations yet. A chat opens once a connection, '
        + 'donation or blood request is accepted.</div>';
      return;
    }
    box.innerHTML = threads.map(function(t){
      var sub = t.last || (t.about ? "About: " + t.about : "No messages yet");
      return '<div class="trow2' + (selecting && sel[t.id] ? ' picked' : '') + '" data-open3="' + t.id + '">'
        + (selecting ? '<span class="ck3' + (sel[t.id] ? ' on' : '') + '"></span>' : '')
        + (t.avatar ? '<img class="av6" src="' + esc(t.avatar) + '" alt="">' : '<span class="av6">' + esc(t.with.charAt(0).toUpperCase()) + '</span>')
        + '<span class="t3"><b>' + esc(t.with) + (t.disappear ? ' <span title="Disappearing messages">\u23F1</span>' : '') + '</b>'

    if (ex && current){
      [].forEach.call(document.querySelectorAll("[data-export]"), function(b){ b.disabled = true; });
      api("/threads/" + current.id + "/export/", {method: "POST", body: {media: ex.getAttribute("data-export") === "1"}}).then(function(r){
        $("exmsg3").innerHTML = r.ok ? '<p class="ok3">Sent to ' + esc(r.data.to) + ': ' + r.data.messages + ' messages' + (r.data.attached ? ', ' + r.data.attached + ' files attached' : '') + '. Check your inbox (and spam) in a few minutes.</p>'
                                     : '<p style="color:#B91C1C">' + esc(r.data.detail || "Could not send.") + '</p>';
      });
      return;
    }
    var cp = e.target.closest("[data-copy]");
    if (cp){ if (navigator.clipboard) navigator.clipboard.writeText(cp.getAttribute("data-copy")).then(function(){ cp.textContent = "Copied"; }); return; }
    if (e.target.closest("#newgroup3")){ newGroupPanel(); return; }
    if (e.target.closest("[data-invites3]")){ invitesPanel(); return; }
    if (e.target.closest("#gprivacy3")){ e.preventDefault(); privacyPanel(); return; }
    if (e.target.closest("[data-ngcreate]")){
      var nm = ($("ngname").value || "").trim();
      if (nm.length < 2){ $("ngmsg").innerHTML = '<p style="color:#B91C1C">Give the group a name.</p>'; return; }
      var ids = [].map.call(document.querySelectorAll("#ngcand input:checked"), function(i){ return +i.value; });
      api("/groups/", {method: "POST", body: {name: nm, members: ids}}).then(function(r){
        if (r.ok) location.href = "/group/" + r.data.id;
        else $("ngmsg").innerHTML = '<p style="color:#B91C1C">' + esc(r.data.detail || "Could not create the group.") + '</p>';
      });
      return;
    }
    var gi = e.target.closest("[data-ginv]");
    if (gi){
      api("/groups/invites/" + gi.getAttribute("data-id") + "/" + gi.getAttribute("data-ginv") + "/", {method: "POST", body: {}}).then(function(r){
        if (r.ok && r.data.status === "accepted") location.href = "/group/" + r.data.group_id; else { invitesPanel(); loadGroups(); }
      });
      return;
    }
    if (e.target.id === "csend") send();
  });

  $("cinput").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $("cinput").addEventListener("input", function(){
    if (!current || Date.now() - typedAt < 3000) return;
    typedAt = Date.now();
    api("/threads/" + current.id + "/typing/", {method:"POST", body:{}});
  });
  $("cphoto").addEventListener("change", function(){
    var f = this.files[0]; this.value = "";
    if (!f || !current) return;
    var isImg = /^image\//.test(f.type);
    if (f.size > (isImg ? 2 : 5) * 1024 * 1024){ alert(isImg ? "That photo is over 2 MB. Pick a smaller one." : "That file is over 5 MB."); return; }
    var fd = new FormData(); fd.append(isImg ? "photo" : "file", f);
    var cap = $("cinput").value.trim(); if (cap){ fd.append("message", cap); $("cinput").value = ""; }
    $("typing3").textContent = "Sending photo\u2026";
    sending = true;
    api("/threads/" + current.id + "/", {method:"POST", body: fd}).then(function(r){
      sending = false; $("typing3").textContent = "";
      if (r.ok && r.data.message) addMessages([r.data.message]);
      else alert((r.data && r.data.detail) || (r.status === 413 ? "That file is too big for the server (8 MB at most)." : "Could not send it (error " + (r.status || "no connection") + ")."));
      $("msgs3").scrollTop = $("msgs3").scrollHeight;
    });
  });

  // ---- groups in the chat list ----
  function loadGroups(){
    var box = $("grp3"); if (!box) return;
    api("/groups/").then(function(r){
      if (!r.ok){ box.innerHTML = ""; return; }
      var gs = r.data.groups || [], inv = r.data.invites || 0;
      box.innerHTML = (inv ? '<div class="ginv3" data-invites3>\uD83D\uDCE8 You have ' + inv + ' group invitation' + (inv > 1 ? 's' : '') + ' \u2192</div>' : '')
        + gs.map(function(g){
          return '<a class="trow2" href="/group/' + g.id + '" style="text-decoration:none;color:inherit">'
            + (g.photo ? '<img class="av6" src="' + esc(g.photo) + '" alt="">' : '<span class="av6">\uD83D\uDC65</span>')
            + '<span class="t3"><b>' + esc(g.name) + (g.muted ? ' \uD83D\uDD15' : '') + '</b><small>' + esc(g.last || "") + '</small></span>'
            + (g.unread ? '<span class="badge2">' + g.unread + '</span>' : '') + '</a>';
        }).join("");
    });
  }
  function newGroupPanel(){
    var p = panel("New group", '<label style="font-weight:700;font-size:13px">Group name</label><input id="ngname" maxlength="80" style="width:100%;box-sizing:border-box;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;font:inherit;margin:4px 0 10px">'
      + '<p class="mut3">Add people from your connections. Anyone who only lets their connections add them, or nobody, will get an invitation instead.</p><div id="ngcand"><p class="mut3">Loading\u2026</p></div>'
      + '<button class="pbt3" data-ngcreate style="margin-top:12px;max-width:none">Create group</button><div id="ngmsg"></div>');
    fetch("/api/network/me/people/connections/", {credentials: "same-origin"}).then(function(r){ return r.json(); }).then(function(d){
      var list = d.people || [];
      $("ngcand").innerHTML = list.length ? list.map(function(x){ return '<label class="trow2" style="margin:0;cursor:pointer"><input type="checkbox" value="' + x.user_id + '" style="width:20px;height:20px"> '
        + (x.avatar_url ? '<img class="av6" src="' + esc(x.avatar_url) + '" alt="">' : '<span class="av6">' + esc(x.name.charAt(0)) + '</span>') + '<span class="t3"><b>' + esc(x.name) + '</b></span></label>'; }).join("")
        : '<p class="mut3">You have no connections yet. You can still create the group and share its invite link.</p>';
    });
  }
  function invitesPanel(){
    panel("Group invitations", '<div id="ginvl"><p class="mut3">Loading\u2026</p></div>');
    api("/groups/invites/").then(function(r){
      var l = (r.data && r.data.invites) || [];
      $("ginvl").innerHTML = l.length ? l.map(function(i){ return '<div class="row3"><span><b>' + esc(i.group) + '</b> \u00b7 ' + i.members + ' members</span><small>Invited by ' + esc(i.by) + '</small>'
        + '<span style="grid-column:2;grid-row:1/3;display:flex;gap:6px"><button data-ginv="accept" data-id="' + i.id + '">Join</button><button data-ginv="decline" data-id="' + i.id + '">Decline</button></span></div>'; }).join("") : '<p class="mut3">No invitations.</p>';
    });
  }
  function privacyPanel(){
    panel("Groups privacy", '<p>Who can add me to groups:</p><div id="gpriv"><p class="mut3">Loading\u2026</p></div><p class="mut3">Anyone else can only send you an invitation, which you can accept or decline.</p>');
    api("/groups/privacy/").then(function(r){
      var w = (r.data && r.data.who) || "connections";
      $("gpriv").innerHTML = [["everyone", "Everyone"], ["connections", "My connections"], ["nobody", "Nobody"]].map(function(o){
        return '<label class="wall3" style="margin:6px 0"><input type="radio" name="gpv" value="' + o[0] + '"' + (w === o[0] ? " checked" : "") + '> ' + o[1] + '</label>'; }).join("");
    });
  }
  document.addEventListener("change", function(e){
    if (e.target.name === "gpv") api("/groups/privacy/", {method: "POST", body: {who: e.target.value}});
  });
  function loadList(){
    loadGroups();
    return api("/threads/").then(function(r){
      if (r.ok) threads = r.data.threads || [];
      if (!current) renderList();
    });
  }

  fetch("/api/auth/me/", {credentials:"same-origin"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u){
        $("list5").innerHTML = '<div class="empty8">Sign in to see your chats.</div>';
        return;
      }
      var openId = new URLSearchParams(location.search).get("t")
                  || location.pathname.split("/chat/")[1];
      loadList().then(function(){ if (openId) openThread(openId); });
      listPoll = setInterval(function(){ if (!current && !document.hidden) loadList(); }, 15000);
    });
})();
</script>

<script>
/* Bell: notifications for anyone signed in. One widget, shared by every
   page - reads /api/notify/mine/ and polls it, so a page open in one tab
   picks up something that happened in another. */
(function(){
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }

  // The home gear button exists on nearly every page (added widely across
  // the site earlier), which makes it a far more reliable anchor than any
  // one page's account-button markup.
  var anchor = document.querySelector('[aria-label="Home"]') || document.querySelector(".gear");
  if (!anchor) return;

  fetch("/api/auth/me/", {credentials:"same-origin"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u) return;   // signed out: nothing to show a bell for

      var bell = document.createElement("button");
      bell.className = "bellbtn";
      bell.setAttribute("aria-label", "Notifications");
      bell.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>'
        + '<path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot4"></span>';
      anchor.parentNode.insertBefore(bell, anchor);
      wireBell(bell);
    })
    .catch(function(){});

  function wireBell(bell){

  var drop = document.createElement("div");
  drop.className = "belldrop";
  document.body.appendChild(drop);

  function load(){
    fetch("/api/notify/mine/", {credentials:"same-origin"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d) return;
        bell.classList.toggle("has", d.unread > 0);
        bell.querySelector(".dot4").textContent = d.unread > 9 ? "9+" : d.unread;

        var h = '<div class="hd5"><b>Notifications</b>'
          + (d.unread ? '<button id="markall">Mark all read</button>' : '') + '</div>';
        if (!d.notifications.length){
          h += '<div class="nempty">Nothing yet.</div>';
        } else {
          h += d.notifications.map(function(n){
            return '<a class="nitem3' + (n.read ? "" : " unread") + '" href="'
              + esc(n.link || "#") + '" data-nid="' + n.id + '">'
              + '<p>' + esc(n.text) + '</p><small>' + esc(n.when) + '</small></a>';
          }).join("");
        }
        drop.innerHTML = h;
      })
      .catch(function(){});
  }

  bell.addEventListener("click", function(e){
    e.stopPropagation();
    drop.classList.toggle("on");
    if (drop.classList.contains("on")) load();
  });
  document.addEventListener("click", function(e){
    if (!drop.contains(e.target) && e.target !== bell) drop.classList.remove("on");
  });
  drop.addEventListener("click", function(e){
    var mark = e.target.closest("#markall");
    if (mark){
      e.preventDefault();
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:"{}"}).then(load);
      return;
    }
    var item = e.target.closest("[data-nid]");
    if (item){
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:JSON.stringify({id: item.getAttribute("data-nid")})});
    }
  });

  load();
  setInterval(load, 45000);
  }
})();
</script>
