<style>
:root{--ink:#0D1424;--ink-soft:#5A657C;--paper:#F6F7FB;--card:#FFF;--brand:#1B4DFF;
  --line:#E4E8F2;--display:"Bricolage Grotesque",system-ui,sans-serif;--body:"Plus Jakarta Sans",system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{overflow-x:hidden}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;
  min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:var(--brand);text-decoration:none}

.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:9px;padding:12px 16px;
  background:rgba(246,247,251,.92);border-bottom:1px solid var(--line);backdrop-filter:blur(14px)}
.top img{width:30px;height:30px;border-radius:10px}
.top b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.03em}
.top .sp{flex:1}
.gear{width:34px;height:34px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--ink-soft)}
.gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

.wrap{width:100%;max-width:640px;margin:0 auto;padding:16px 16px 20px;flex:1;
  display:flex;flex-direction:column;min-height:0}
h1{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em}

.trow2{display:flex;align-items:center;gap:11px;padding:13px;background:var(--card);
  border:1px solid var(--line);border-radius:15px;margin-bottom:9px;cursor:pointer}
.trow2 .av6{width:40px;height:40px;border-radius:13px;background:var(--brand);color:#fff;
  display:grid;place-items:center;font-weight:800;flex:0 0 auto}
.trow2 .t3{flex:1;min-width:0}
.trow2 .t3 b{display:block;font-size:14px;font-weight:700}
.trow2 .t3 small{display:block;font-size:12px;color:var(--ink-soft);overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.trow2 .t3 .about2{display:block;font-size:11.5px;font-weight:600;font-style:normal;
  color:var(--brand);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.trow2 .badge2{min-width:20px;height:20px;padding:0 5px;border-radius:99px;background:var(--brand);
  color:#fff;font-size:11px;font-weight:800;display:grid;place-items:center}

.thread2{display:none;flex:1;flex-direction:column;min-height:0}
.thread2.on{display:flex}
.back3{padding:9px 15px;border-radius:11px;background:var(--card);border:1px solid var(--line);
  font-size:13px;font-weight:600;margin-bottom:11px;align-self:flex-start}
.msgs2{flex:1;overflow-y:auto;padding:4px 2px}
.msg8{max-width:80%;padding:11px 14px;border-radius:16px;margin-bottom:9px;font-size:14px;line-height:1.5}
.msg8.mine{margin-left:auto;background:var(--brand);color:#fff;border-radius:16px 16px 3px 16px}
.msg8.theirs{background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 3px}
.msg8 small{display:block;font-size:10px;opacity:.65;margin-top:4px}
.reply4{display:flex;gap:8px;padding-top:11px}
.reply4 textarea{flex:1;padding:12px 13px;border:1.5px solid var(--line);border-radius:14px;
  background:var(--card);font-size:14.5px;font-family:inherit;min-height:46px;max-height:120px;resize:none}
.reply4 button{padding:0 20px;border-radius:14px;background:var(--ink);color:#fff;font-weight:700}
.thd3{display:flex;align-items:center;gap:8px;margin-bottom:6px}
.thd3 .back3{margin-bottom:0}
.more3{width:36px;height:36px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:18px;font-weight:800}
.menu3{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.menu3:empty{display:none}
.menu3 button{padding:9px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:700}
.menu3 select,.menu3 input{padding:9px 11px;border:1px solid var(--line);border-radius:11px;font:inherit;font-size:13px;background:var(--card)}
.menu3 .ok3{font-size:13px;color:#166534}
.cb{white-space:pre-wrap;word-wrap:break-word}
.cimg{display:block;max-width:100%;max-height:320px;border-radius:12px;margin-bottom:6px}
.tick3{margin-left:4px;letter-spacing:-2px;opacity:.8}
.tick3.seen{color:#7DD3FC;opacity:1}
.typing3{min-height:18px;font-size:12px;color:var(--ink-soft);padding:2px 4px}
.blockedbar{font-size:13px;color:#991B1B;padding:4px}
.blockedbar:empty{display:none}
.att3{display:grid;place-items:center;width:46px;border-radius:14px;background:var(--card);border:1.5px solid var(--line);font-size:18px;cursor:pointer}
body.inchat{height:100vh;height:100dvh;overflow:hidden}
body.inchat footer,body.inchat .xcfoot,body.inchat #pushbar{display:none}
body.inchat .wrap{flex:1;min-height:0;display:flex;flex-direction:column;overflow:hidden;padding-bottom:max(10px,env(safe-area-inset-bottom))}
body.inchat .wrap > h1{font-size:18px;margin:4px 0 6px}
body.inchat .thread2.on{flex:1;min-height:0}
.msgs2{overscroll-behavior:contain}
.reply4{flex:0 0 auto}
.emo3{display:none;max-height:240px;overflow:auto;border:1px solid var(--line);border-radius:14px;background:var(--card);padding:8px;margin-top:8px}
.emo3.on{display:block}
.etabs{display:flex;gap:4px;position:sticky;top:-8px;background:var(--card);padding:2px 0 6px;overflow-x:auto}
.etabs button{padding:5px 10px;border-radius:9px;font-size:13px;font-weight:700;white-space:nowrap}
.etabs button.on{background:var(--paper)}
.eg{display:grid;grid-template-columns:repeat(auto-fill,minmax(40px,1fr))}
.eg button{font-size:24px;padding:4px;border-radius:8px}
.eg button:hover{background:var(--paper)}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.stkgrid img{width:100%;display:block}
.stk3{width:150px;max-width:100%;height:auto;display:block}
.msg8.stkmsg{background:transparent !important;border:0 !important;padding:0 2px}
.msg8.stkmsg small{color:var(--ink-soft)}
.newc3{margin-top:12px}.newc3 button{padding:10px 16px;border-radius:12px;background:var(--brand);color:#fff;font-weight:800;border:0;cursor:pointer}#newlist3{margin-top:10px}body.inchat .newc3,body.inchat #newlist3{display:none}
.att3{display:grid;place-items:center;width:44px;height:44px;flex:0 0 44px;align-self:flex-end;border-radius:50%;background:transparent;border:0;color:var(--ink-soft);cursor:pointer}
.att3:hover{background:var(--paper);color:var(--ink)}
#csend{display:grid;place-items:center;width:46px;height:46px;flex:0 0 46px;align-self:flex-end;border-radius:50%;padding:0}
.reply4{align-items:flex-end;gap:4px}
.ghost3{background:transparent !important;color:var(--ink) !important;border:1.5px solid var(--line) !important;margin-left:8px}
.selbar3{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;padding:10px 14px;border-radius:14px;background:var(--paper);font-size:14px;font-weight:600}
.selbar3 button{padding:8px 14px;border-radius:10px;background:#B91C1C;color:#fff;border:0;font-weight:800}
.ck3{width:22px;height:22px;flex:0 0 22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.ck3.on{background:var(--brand);border-color:var(--brand)}
.ck3.on:after{content:"\2713";color:#fff;font-size:13px;font-weight:900}
.trow2.picked{background:var(--paper)}
.sys3{align-self:center;max-width:90%;margin:6px auto;padding:6px 12px;border-radius:10px;background:var(--paper);color:var(--ink-soft);font-size:12.5px;text-align:center}
.empty8{text-align:center;padding:40px 20px;color:var(--ink-soft);font-size:13.5px}

/* ---------- bell ---------- */
.bellbtn{position:relative;width:34px;height:34px;border-radius:11px;background:var(--card,#fff);
  border:1px solid var(--line,#E4E8F2);display:grid;place-items:center;color:var(--ink-soft,#5A657C);
  flex:0 0 auto}
.bellbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.bellbtn .dot4{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 3px;
  border-radius:99px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:800;
  display:none;align-items:center;justify-content:center;line-height:1}
.bellbtn.has .dot4{display:flex}

.belldrop{position:fixed;top:58px;right:12px;left:12px;max-width:380px;margin-left:auto;
  z-index:200;background:var(--card,#fff);border:1px solid var(--line,#E4E8F2);
  border-radius:18px;box-shadow:0 16px 40px rgba(13,20,36,.24);display:none;
  max-height:70vh;overflow-y:auto}
.belldrop.on{display:block}
.belldrop .hd5{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line,#E4E8F2)}
.belldrop .hd5 b{font-family:var(--display,inherit);font-weight:800;font-size:14.5px}
.belldrop .hd5 button{margin-left:auto;font-size:11.5px;color:var(--brand,#1B4DFF);font-weight:700}
.nitem3{display:block;padding:12px 16px;border-bottom:1px solid var(--line,#E4E8F2);
  text-decoration:none;color:inherit}
.nitem3:last-child{border-bottom:none}
.nitem3.unread{background:rgba(27,77,255,.04)}
.nitem3 p{font-size:13px;line-height:1.5}
.nitem3 small{display:block;font-size:11px;color:var(--ink-soft,#5A657C);margin-top:4px}
.nempty{padding:30px 16px;text-align:center;font-size:13px;color:var(--ink-soft,#5A657C)}
</style>
</head>

</header>
<script src="/js/topnav-1.js?v=3" defer></script>

<div class="wrap">
  <h1>Chat</h1>
    <div class="newc3"><button id="newchat3" type="button">+ New chat</button><button id="sel3" type="button" class="ghost3">Select</button></div>
  <div id="selbar3"></div>
  <div id="newlist3"></div>
  <div id="list5" style="margin-top:14px"></div>
  <div class="thread2" id="threadbox">
    <div class="thd3"><button class="back3" data-back3>&larr; All chats</button><span style="flex:1"></span>
      <button class="more3" data-more3 aria-label="Block or report">&#8942;</button></div>
    <div class="menu3" id="menu3"></div>
    <div class="msgs2" id="msgs3"></div>
    <div class="typing3" id="typing3"></div>
    <div class="blockedbar" id="blockedbar"></div>
    <div class="emo3" id="emo3"></div>
    <div class="reply4" id="reply4">
      <button class="att3" type="button" data-emo3 title="Emoji and stickers" aria-label="Emoji and stickers"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M8.5 14.5c1 1.2 2.1 1.8 3.5 1.8s2.5-.6 3.5-1.8"/><circle cx="9" cy="10" r=".6" fill="currentColor"/><circle cx="15" cy="10" r=".6" fill="currentColor"/></svg></button>
      <label class="att3" title="Send a photo" aria-label="Send a photo"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 11.5l-8.2 8.2a5 5 0 0 1-7.1-7.1l8.5-8.5a3.4 3.4 0 0 1 4.8 4.8l-8.4 8.4a1.7 1.7 0 0 1-2.4-2.4l7.7-7.7"/></svg><input type="file" id="cphoto" accept="image/*" style="display:none"></label>
      <textarea id="cinput" placeholder="Type a message"></textarea>
      <button id="csend" aria-label="Send"><svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor"><path d="M3.4 20.4l17.4-7.5a1 1 0 0 0 0-1.8L3.4 3.6a.9.9 0 0 0-1.3 1l1.8 6.4 9.1 1-9.1 1-1.8 6.4a.9.9 0 0 0 1.3 1z"/></svg></button>
    </div>
  </div>
</div>

<script>
(function(){
  "use strict";
  var selecting = false, sel = {};
  var threads = [], current = null, lastId = 0, seenUpto = 0, poll = null, listPoll = null, typedAt = 0, sending = false;

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }
  function api(p,o){
    o=o||{};
    var h={};
    if (!(o.body instanceof FormData)) h["Content-Type"]="application/json";
    if(o.method&&o.method!=="GET") h["X-CSRFToken"]=cookie("xc_csrf");
    return fetch("/api/notify"+p,{method:o.method||"GET",headers:h,credentials:"same-origin",
      body:o.body?(o.body instanceof FormData?o.body:JSON.stringify(o.body)):undefined})
      .then(function(r){return r.json().catch(function(){return{};})
        .then(function(d){return{ok:r.ok,status:r.status,data:d};});})
      .catch(function(){return{ok:false,data:{}};});
  }
  function $(id){ return document.getElementById(id); }

  function renderList(){
    var box = $("list5");
    if (!threads.length){
      box.innerHTML = '<div class="empty8">No conversations yet. A chat opens once a connection, '
        + 'donation or blood request is accepted.</div>';
      return;
    }
    box.innerHTML = threads.map(function(t){
      var sub = t.last || (t.about ? "About: " + t.about : "No messages yet");
      return '<div class="trow2' + (selecting && sel[t.id] ? ' picked' : '') + '" data-open3="' + t.id + '">'
        + (selecting ? '<span class="ck3' + (sel[t.id] ? ' on' : '') + '"></span>' : '')
        + '<span class="av6">' + esc(t.with.charAt(0).toUpperCase()) + '</span>'
        + '<span class="t3"><b>' + esc(t.with) + (t.disappear ? ' <span title="Disappearing messages">\u23F1</span>' : '') + '</b>'
        + (t.about ? '<em class="about2">' + esc(t.about) + '</em>' : '')
        + '<small>' + esc(sub) + '</small></span>'
        + (t.unread ? '<span class="badge2">' + t.unread + '</span>' : '')
        + '</div>';
    }).join("");
  }

  function drawSel(){
    var n = Object.keys(sel).filter(function(k){ return sel[k]; }).length;
    $("selbar3").innerHTML = selecting ? '<div class="selbar3"><span>' + (n ? n + " selected" : "Tap chats to select them") + '</span>'
      + (n ? '<button data-seldel3>Delete</button>' : '') + '</div>' : "";
  }
  function bubble(m){
    if (m.system) return '<div class="sys3">\u23F1 ' + esc(m.body) + '</div>';
    var tick = m.mine ? ' <span class="tick3' + (m.id <= seenUpto ? ' seen' : '') + '" data-tick="' + m.id + '">'
      + (m.id <= seenUpto ? "\u2713\u2713" : "\u2713") + '</span>' : "";
    return '<div class="msg8 ' + (m.mine ? "mine" : "theirs") + (stk(m.body) ? " stkmsg" : "") + '">'
      + (m.image ? '<a href="' + esc(m.image) + '" target="_blank" rel="noopener"><img class="cimg" src="' + esc(m.image) + '" alt="Photo" loading="lazy"></a>' : '')
      + (stk(m.body) ? '<img class="stk3" src="/stickers/' + stk(m.body) + '.svg" alt="Sticker">'
                     : (m.body ? '<div class="cb">' + esc(m.body) + '</div>' : ''))
      + '<small>' + esc(m.when) + tick + '</small></div>';
  }
  // ---- stickers and emoji ----
  var STICKERS = "salam jazakallah shukriya mubarak inshaallah mashaallah alhamdulillah ameen eid ramadan ok thanks congrats welcome goodnight haha".split(" ");
  function stk(body){ var m = /^\[sticker:([a-z0-9-]+)\]$/.exec(body || ""); return m && STICKERS.indexOf(m[1]) >= 0 ? m[1] : ""; }
  var EMOJI = {
    "\uD83D\uDE00": "😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 😉 😍 🥰 😘 😋 😎 🤩 🥳 😏 😔 😢 😭 😤 😠 🤔 🤗 🤭 🙄 😴 🤒 😷",
    "\uD83D\uDC4D": "👍 👎 👌 ✌️ 🤞 👏 🙌 🤲 🙏 💪 👋 🤝 ✍️ ☝️ 👉 👈",
    "\u2764\uFE0F": "❤️ 🧡 💛 💚 💙 💜 🖤 🤍 💔 💕 💖 💯 ✨ 🔥 ⭐ 🌟",
    "\uD83C\uDF19": "🕌 🌙 ☪️ 🕋 📿 🎉 🎂 🎁 🎈 🌹 🌸 🌻 ☀️ 🌧️ ❄️ 🌈",
    "\u2615": "☕ 🍵 🍰 🍕 🍔 🍟 🍎 🥭 🍉 🍌 🍇 🍗 🍛 🥘 🍦 🍫",
    "\uD83D\uDCDA": "📚 ✏️ 💻 📱 📷 🎵 ⚽ 🏏 🚗 ✈️ 🏠 💼 🕐 📌 ✅ ❌ ❓ ❗ 🐱 🐶"
  };
  var emoTab = "stk";
  function drawEmo(){
    var p = $("emo3");
    var tabs = '<div class="etabs"><button data-etab="stk" class="' + (emoTab === "stk" ? "on" : "") + '">Stickers</button>'
      + Object.keys(EMOJI).map(function(k){ return '<button data-etab="' + k + '" class="' + (emoTab === k ? "on" : "") + '">' + k + '</button>'; }).join("") + '</div>';
    var body = emoTab === "stk"
      ? '<div class="stkgrid">' + STICKERS.map(function(s){ return '<button data-stk="' + s + '"><img src="/stickers/' + s + '.svg" alt="' + s + '" loading="lazy"></button>'; }).join("") + '</div>'
      : '<div class="eg">' + EMOJI[emoTab].split(" ").map(function(e){ return '<button data-emoji="' + e + '">' + e + '</button>'; }).join("") + '</div>';
    p.innerHTML = tabs + body;
  }
  function insertEmoji(e){
    var t = $("cinput"), a = t.selectionStart || t.value.length, b = t.selectionEnd || t.value.length;
    t.value = t.value.slice(0, a) + e + t.value.slice(b);
    t.selectionStart = t.selectionEnd = a + e.length;
  }
  function sendSticker(key){
    if (!current || sending) return;
    sending = true;
    api("/threads/" + current.id + "/", {method:"POST", body:{message: "[sticker:" + key + "]"}}).then(function(r){
      sending = false;
      if (r.ok && r.data.message) addMessages([r.data.message]);
      else alert((r.data && r.data.detail) || "Could not send. Try again.");
      $("emo3").classList.remove("on");
      $("msgs3").scrollTop = $("msgs3").scrollHeight;
    });
  }
  function nearBottom(box){ return box.scrollHeight - box.scrollTop - box.clientHeight < 120; }
  function addMessages(list){
    if (!list || !list.length) return;
    var box = $("msgs3"), stick = nearBottom(box);
    box.insertAdjacentHTML("beforeend", list.map(bubble).join(""));
    lastId = Math.max(lastId, list[list.length - 1].id);
    if (stick) box.scrollTop = box.scrollHeight;
  }
  function refreshTicks(){
    [].forEach.call(document.querySelectorAll("[data-tick]"), function(t){
      if (+t.getAttribute("data-tick") <= seenUpto && !t.classList.contains("seen")){ t.classList.add("seen"); t.textContent = "\u2713\u2713"; }
    });
  }
  function setState(d){
    $("typing3").textContent = d.typing ? esc(current ? current.with : "") + " is typing\u2026" : "";
    if (d.seen_upto != null){ seenUpto = d.seen_upto; refreshTicks(); }
    var blocked = !!d.blocked;
    current.i_blocked = !!d.i_blocked;
    $("blockedbar").innerHTML = blocked ? (d.i_blocked ? "You blocked this person. Unblock them from the \u22EE menu to chat again."
                                                        : "You cannot send messages in this chat.") : "";
    $("reply4").style.display = blocked ? "none" : "";
  }

  function stopPoll(){ if (poll){ clearInterval(poll); poll = null; } }
  function openThread(id){
    stopPoll();
    return api("/threads/" + id + "/").then(function(r){
      if (!r.ok) return;
      current = r.data; lastId = 0; seenUpto = r.data.seen_upto || 0;
      $("threadbox").classList.add("on");
      document.body.classList.add("inchat");
      $("list5").style.display = "none";
      $("menu3").innerHTML = "";
      document.querySelector(".wrap > h1").textContent = current.with + (current.disappear ? " \u23F1" : "");
      $("msgs3").innerHTML = "";
      addMessages(current.messages);
      $("msgs3").scrollTop = $("msgs3").scrollHeight;
      setState(current);
      poll = setInterval(function(){
        if (document.hidden || !current || sending) return;
        api("/threads/" + current.id + "/?after=" + lastId).then(function(r){
          if (!r.ok || !current || r.data.id !== current.id) return;
          addMessages(r.data.messages); setState(r.data);
        });
      }, 3000);
    });
  }

  function send(){
    var box = $("cinput"), body = box.value.trim();
    if (!body || !current || sending) return;
    sending = true; box.value = "";
    api("/threads/" + current.id + "/", {method:"POST", body:{message: body}}).then(function(r){
      sending = false;
      if (r.ok && r.data.message) addMessages([r.data.message]);
      else { box.value = body; alert((r.data && r.data.detail) || "Could not send. Try again."); }
      $("msgs3").scrollTop = $("msgs3").scrollHeight;
    });
  }

  document.addEventListener("click", function(e){
    if (e.target.closest("#sel3")){ selecting = !selecting; sel = {}; e.target.closest("#sel3").textContent = selecting ? "Cancel" : "Select"; drawSel(); renderList(); return; }
    if (e.target.closest("[data-seldel3]")){
      var ids = Object.keys(sel).filter(function(k){ return sel[k]; });
      if (!ids.length || !confirm("Delete " + ids.length + " chat" + (ids.length > 1 ? "s" : "") + " from your list? The other person keeps theirs.")) return;
      api("/threads/delete/", {method:"POST", body:{ids: ids.map(Number)}}).then(function(){
        selecting = false; sel = {}; $("sel3").textContent = "Select"; drawSel(); loadList();
      });
      return;
    }
    if (selecting){
      var so = e.target.closest("[data-open3]");
      if (so){ var sid = so.getAttribute("data-open3"); sel[sid] = !sel[sid]; drawSel(); renderList(); return; }
    }
    if (e.target.closest("[data-clear3]") && current){
      if (!confirm("Clear all messages in this chat? Only for you: " + current.with + " keeps theirs.")) return;
      api("/threads/" + current.id + "/clear/", {method:"POST", body:{}}).then(function(){ $("msgs3").innerHTML = ""; $("menu3").innerHTML = ""; });
      return;
    }
    if (e.target.closest("[data-del3]") && current){
      if (!confirm("Delete this chat from your list? It comes back if " + current.with + " writes again.")) return;
      api("/threads/" + current.id + "/clear/", {method:"POST", body:{delete: true}}).then(function(){
        var back = document.querySelector("[data-back3]"); if (back) back.click();
      });
      return;
    }
    if (e.target.closest("[data-dis3]") && current){
      $("menu3").innerHTML = '<span style="font-size:13px;font-weight:700;align-self:center">Messages disappear after:</span>'
        + [[0, "Off"], [24, "24 hours"], [168, "7 days"], [2160, "90 days"]].map(function(o){
            return '<button data-dish="' + o[0] + '"' + ((current.disappear || 0) === o[0] ? ' style="background:var(--ink);color:#fff"' : '') + '>' + o[1] + '</button>'; }).join("");
      return;
    }
    var dh = e.target.closest("[data-dish]");
    if (dh && current){
      api("/threads/" + current.id + "/disappear/", {method:"POST", body:{hours: +dh.getAttribute("data-dish")}}).then(function(r){
        if (!r.ok) return;
        current.disappear = r.data.disappear;
        document.querySelector(".wrap > h1").textContent = current.with + (current.disappear ? " \u23F1" : "");
        $("menu3").innerHTML = "";
      });
      return;
    }
    var o = e.target.closest("[data-open3]");
    if (o) return openThread(o.getAttribute("data-open3"));

    if (e.target.closest("[data-back3]")){
      stopPoll();
      $("threadbox").classList.remove("on");
      document.body.classList.remove("inchat");
      $("emo3").classList.remove("on");
      $("list5").style.display = "";
      document.querySelector(".wrap > h1").textContent = "Chat";
      current = null;
      loadList();
      return;
    }
    if (e.target.closest("[data-more3]") && current){
      var m = $("menu3");
      m.innerHTML = m.innerHTML ? "" : '<button data-block3>' + (current.i_blocked ? "Unblock" : "Block") + " " + esc(current.with) + '</button>'
        + '<button data-report3>Report this chat</button><button data-dis3>Disappearing messages</button>'
        + '<button data-clear3>Clear chat</button><button data-del3 style="color:#B91C1C">Delete chat</button>';
      return;
    }
    if (e.target.closest("[data-block3]") && current){
      if (!current.i_blocked && !confirm("Block " + current.with + "? Neither of you will be able to send messages here.")) return;
      api("/threads/" + current.id + "/block/", {method:"POST", body:{}}).then(function(r){
        $("menu3").innerHTML = "";
        if (r.ok) setState({blocked: r.data.blocked, i_blocked: r.data.i_blocked});
      });
      return;
    }
    if (e.target.closest("[data-report3]") && current){
      $("menu3").innerHTML = '<select id="rr3"><option value="spam">Spam</option><option value="abuse">Abusive or threatening</option>'
        + '<option value="scam">Scam or fraud</option><option value="other">Something else</option></select>'
        + '<input id="rn3" maxlength="500" placeholder="What happened? (optional)"><button data-sendreport3>Send report</button>';
      return;
    }
    if (e.target.closest("[data-sendreport3]") && current){
      api("/threads/" + current.id + "/report/", {method:"POST", body:{reason: $("rr3").value, note: $("rn3").value}}).then(function(r){
        $("menu3").innerHTML = '<p class="ok3">' + (r.ok ? "Thank you. A moderator will look at it." : "Could not send the report.") + '</p>';
      });
      return;
    }
    if (e.target.closest("[data-emo3]")){ var ep = $("emo3"); ep.classList.toggle("on"); if (ep.classList.contains("on")) drawEmo(); return; }
    var et = e.target.closest("[data-etab]"); if (et){ emoTab = et.getAttribute("data-etab"); drawEmo(); return; }
    var em = e.target.closest("[data-emoji]"); if (em){ insertEmoji(em.getAttribute("data-emoji")); return; }
    var sk = e.target.closest("[data-stk]"); if (sk){ sendSticker(sk.getAttribute("data-stk")); return; }
    if (e.target.closest("#newchat3")){
      var nl = $("newlist3");
      if (nl.innerHTML){ nl.innerHTML = ""; return; }
      nl.innerHTML = '<div class="empty8">Loading your connections\u2026</div>';
      fetch("/api/network/me/people/connections/", {credentials: "same-origin"}).then(function(r){ return r.json(); }).then(function(d){
        var list = (d && d.people) || [];
        if (!list.length){
          nl.innerHTML = '<div class="empty8">You can chat with people you are connected to. Find people in '
            + '<a href="/people">Connect</a> and send a request; once they accept, they appear here.</div>';
          return;
        }
        nl.innerHTML = '<input id="ncq3" placeholder="Search your connections" style="width:100%;padding:11px 13px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;font:inherit">'
          + '<div id="ncl3">' + list.map(function(p){
              return '<div class="trow2" data-newc="' + esc(p.slug || "") + '" data-name="' + esc(p.name.toLowerCase()) + '">'
                + '<span class="av6">' + esc(p.name.charAt(0).toUpperCase()) + '</span>'
                + '<span class="t3"><b>' + esc(p.name) + '</b><small>' + esc(p.headline || "") + '</small></span></div>';
            }).join("") + '</div>';
      }).catch(function(){ nl.innerHTML = '<div class="empty8">Could not load your connections.</div>'; });
      return;
    }
    var nc = e.target.closest("[data-newc]");
    if (nc){
      var slug = nc.getAttribute("data-newc");
      if (!slug) return;
      nc.style.opacity = ".5";
      fetch("/api/network/in/" + encodeURIComponent(slug) + "/message/", {method: "POST", credentials: "same-origin",
            headers: {"Content-Type": "application/json", "X-CSRFToken": cookie("xc_csrf")}, body: "{}"})
        .then(function(r){ return r.json().then(function(d){ return {ok: r.ok, d: d}; }); })
        .then(function(x){
          nc.style.opacity = "";
          if (!x.ok){ alert(x.d.detail || "Could not open the chat."); return; }
          $("newlist3").innerHTML = "";
          loadList().then(function(){ openThread(x.d.id); });
        });
      return;
    }
    if (e.target.id === "csend") send();
  });

  $("cinput").addEventListener("keydown", function(e){
    if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); send(); }
  });
  $("cinput").addEventListener("input", function(){
    if (!current || Date.now() - typedAt < 3000) return;
    typedAt = Date.now();
    api("/threads/" + current.id + "/typing/", {method:"POST", body:{}});
  });
  $("cphoto").addEventListener("change", function(){
    var f = this.files[0]; this.value = "";
    if (!f || !current) return;
    if (f.size > 2 * 1024 * 1024){ alert("That photo is over 2 MB. Pick a smaller one."); return; }
    var fd = new FormData(); fd.append("photo", f);
    var cap = $("cinput").value.trim(); if (cap){ fd.append("message", cap); $("cinput").value = ""; }
    $("typing3").textContent = "Sending photo\u2026";
    sending = true;
    api("/threads/" + current.id + "/", {method:"POST", body: fd}).then(function(r){
      sending = false; $("typing3").textContent = "";
      if (r.ok && r.data.message) addMessages([r.data.message]);
      else alert((r.data && r.data.detail) || "Could not send the photo.");
      $("msgs3").scrollTop = $("msgs3").scrollHeight;
    });
  });

  function loadList(){
    return api("/threads/").then(function(r){
      if (r.ok) threads = r.data.threads || [];
      if (!current) renderList();
    });
  }

  fetch("/api/auth/me/", {credentials:"same-origin"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u){
        $("list5").innerHTML = '<div class="empty8">Sign in to see your chats.</div>';
        return;
      }
      var openId = new URLSearchParams(location.search).get("t")
                  || location.pathname.split("/chat/")[1];
      loadList().then(function(){ if (openId) openThread(openId); });
      listPoll = setInterval(function(){ if (!current && !document.hidden) loadList(); }, 15000);
    });
})();
</script>

<script>
/* Bell: notifications for anyone signed in. One widget, shared by every
   page - reads /api/notify/mine/ and polls it, so a page open in one tab
   picks up something that happened in another. */
(function(){
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }

  // The home gear button exists on nearly every page (added widely across
  // the site earlier), which makes it a far more reliable anchor than any
  // one page's account-button markup.
  var anchor = document.querySelector('[aria-label="Home"]') || document.querySelector(".gear");
  if (!anchor) return;

  fetch("/api/auth/me/", {credentials:"same-origin"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u) return;   // signed out: nothing to show a bell for

      var bell = document.createElement("button");
      bell.className = "bellbtn";
      bell.setAttribute("aria-label", "Notifications");
      bell.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>'
        + '<path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot4"></span>';
      anchor.parentNode.insertBefore(bell, anchor);
      wireBell(bell);
    })
    .catch(function(){});

  function wireBell(bell){

  var drop = document.createElement("div");
  drop.className = "belldrop";
  document.body.appendChild(drop);

  function load(){
    fetch("/api/notify/mine/", {credentials:"same-origin"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d) return;
        bell.classList.toggle("has", d.unread > 0);
        bell.querySelector(".dot4").textContent = d.unread > 9 ? "9+" : d.unread;

        var h = '<div class="hd5"><b>Notifications</b>'
          + (d.unread ? '<button id="markall">Mark all read</button>' : '') + '</div>';
        if (!d.notifications.length){
          h += '<div class="nempty">Nothing yet.</div>';
        } else {
          h += d.notifications.map(function(n){
            return '<a class="nitem3' + (n.read ? "" : " unread") + '" href="'
              + esc(n.link || "#") + '" data-nid="' + n.id + '">'
              + '<p>' + esc(n.text) + '</p><small>' + esc(n.when) + '</small></a>';
          }).join("");
        }
        drop.innerHTML = h;
      })
      .catch(function(){});
  }

  bell.addEventListener("click", function(e){
    e.stopPropagation();
    drop.classList.toggle("on");
    if (drop.classList.contains("on")) load();
  });
  document.addEventListener("click", function(e){
    if (!drop.contains(e.target) && e.target !== bell) drop.classList.remove("on");
  });
  drop.addEventListener("click", function(e){
    var mark = e.target.closest("#markall");
    if (mark){
      e.preventDefault();
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:"{}"}).then(load);
      return;
    }
    var item = e.target.closest("[data-nid]");
    if (item){
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:JSON.stringify({id: item.getAttribute("data-nid")})});
    }
  });

  load();
  setInterval(load, 45000);
  }
})();
</script>
