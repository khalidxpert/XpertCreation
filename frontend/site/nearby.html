<style>
:root{--brand:#1B4DFF;--ink:#0D1424;--soft:#5A657C;--line:#E4E8F2;--paper:#F4F6FB;--card:#fff;--ok:#16A34A;--bad:#DC2626}
*{box-sizing:border-box}html,body{margin:0;height:100%}
body{font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--paper);color:var(--ink);-webkit-text-size-adjust:100%}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:10px 14px;background:#0D1424;color:#fff}
.top img{width:30px;height:30px;border-radius:8px}.top b{font-size:16px}.top small{display:block;font-size:11.5px;opacity:.75;font-weight:600}
.top .sp{flex:1}.top a{color:#fff;text-decoration:none;font-size:13px;font-weight:700;background:rgba(255,255,255,.12);padding:7px 11px;border-radius:10px}
.net{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:#94A3B8}.net.on{background:#4ADE80}
main{max-width:640px;margin:0 auto;padding:14px 14px 90px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-bottom:12px}
h1{font-size:23px;margin:4px 0 6px;letter-spacing:-.02em}h2{font-size:17px;margin:0 0 8px}
p.s{color:var(--soft);font-size:14.5px;line-height:1.55;margin:0 0 10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 18px;border-radius:14px;border:0;background:var(--brand);color:#fff;font:inherit;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none}
.btn.g{background:var(--paper);color:var(--ink);border:1px solid var(--line)}.btn.ok{background:var(--ok)}.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;flex-wrap:wrap}.row .btn{flex:1;min-width:140px}
input.t{width:100%;padding:12px 13px;border-radius:12px;border:1.5px solid var(--line);font:inherit;font-size:15px;background:#fff;color:inherit}
ol.steps{padding-left:20px;margin:6px 0 0;line-height:1.7;font-size:14.5px}
.qr{display:flex;justify-content:center;padding:10px;background:#fff;border-radius:14px}.qr img,.qr canvas{width:min(78vw,330px);height:auto;image-rendering:pixelated}
.cam{position:relative;border-radius:16px;overflow:hidden;background:#000;aspect-ratio:1}.cam video{width:100%;height:100%;object-fit:cover}
.cam:after{content:"";position:absolute;inset:16%;border:3px solid rgba(255,255,255,.85);border-radius:18px;box-shadow:0 0 0 999px rgba(0,0,0,.25)}
.stepno{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--brand);color:#fff;font-weight:900;font-size:13px;margin-right:6px}
.msg{font-size:13.5px;font-weight:700;margin-top:8px}.msg.bad{color:var(--bad)}.msg.ok{color:var(--ok)}
.list a{display:flex;gap:10px;align-items:center;padding:11px 4px;border-top:1px solid var(--line);text-decoration:none;color:inherit}.list a:first-child{border-top:0}
.av{flex:0 0 40px;height:40px;border-radius:50%;display:grid;place-items:center;font-weight:900;color:#fff;background:linear-gradient(135deg,#1B4DFF,#7C3AED)}
.list b{display:block;font-size:15px}.list small{color:var(--soft);font-size:12.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:62vw}
.chat{display:flex;flex-direction:column;height:calc(100dvh - 52px)}
.chead{display:flex;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line)}
.chead b{display:block}.chead small{color:var(--soft);font-size:12px}.chead .sp{flex:1}
.msgs{flex:1;overflow-y:auto;padding:12px 12px 6px;display:flex;flex-direction:column;gap:6px;background:var(--paper)}
.bub{max-width:80%;padding:8px 11px;border-radius:16px;font-size:15px;line-height:1.4;white-space:pre-wrap;word-wrap:break-word;background:#fff;border:1px solid var(--line);align-self:flex-start}
.bub.me{align-self:flex-end;background:#DCE6FF;border-color:#C7D6FF}.bub small{display:block;font-size:10.5px;color:var(--soft);margin-top:3px;text-align:right}
.bub img{display:block;max-width:100%;max-height:260px;border-radius:10px;margin-bottom:4px}.bub .f{display:flex;gap:8px;align-items:center;font-weight:700}
.bar{height:5px;background:#E2E8F0;border-radius:9px;overflow:hidden;margin-top:5px}.bar i{display:block;height:100%;background:var(--brand);width:0}
.sys{align-self:center;font-size:12px;color:var(--soft);background:#fff;border:1px solid var(--line);padding:4px 10px;border-radius:99px}
.cin{display:flex;gap:6px;padding:8px;background:#fff;border-top:1px solid var(--line);padding-bottom:max(8px,env(safe-area-inset-bottom))}
.cin textarea{flex:1;resize:none;border:1.5px solid var(--line);border-radius:14px;padding:10px 12px;font:inherit;font-size:15px;max-height:120px}
.cin button{flex:0 0 46px;height:46px;border-radius:50%;border:0;font-size:19px;cursor:pointer;background:var(--paper)}.cin button.s{background:var(--brand);color:#fff}
.banner{background:#FEF3C7;color:#92400E;font-size:13px;font-weight:700;padding:8px 12px;text-align:center}
.hide{display:none!important}
.tip{background:#EEF2FF;border-radius:12px;padding:10px 12px;font-size:13.5px;color:#1E3A8A;line-height:1.5;margin-top:10px}

}
function startJoin(){
  if (openLinks().length >= 1 && !PRO) return proSheet("Your phone is already in a chat. Joining a second one, so your phone links both, needs Nearby Pro.");
  view = "join";
  app.innerHTML = '<main><div class="card" id="step1"><h2>Scan their code</h2><p class="s">Point your camera at the code on the other phone. Both phones must be on the same hotspot or Wi-Fi.</p><div id="cam"></div><div class="row" style="margin-top:10px"><button class="btn" id="scanb">📷 Start camera</button><button class="btn g" id="pasteb">Paste a code</button></div><div class="msg" id="jm"></div></div>'
    + '<div class="card hide" id="step2"><h2 id="s2h">Connecting…</h2><p class="s" id="s2p"></p><div class="qr" id="qr"></div></div>'
    + '<button class="btn g" id="back" style="width:100%">Cancel</button></main>';
  var l = null;
  $("back").onclick = function(){ stopScan(); if (l && !l.peer) drop(l); if (openLinks().length) chat(conv(), true); else home(); };
  function useOffer(t){
    $("jm").className = "msg"; $("jm").textContent = "Reading…";
    var host = "them", room = "";
    l = newLink(); l.pc.ondatachannel = function(e){ wire(l, e.channel); };
    unpack(t).then(function(o){ if (o.t !== "o") throw new Error("That is a reply code. Scan the code from the phone that showed its code first."); host = (o.me && o.me.n) || "them"; room = o.r || ""; return l.pc.setRemoteDescription({type: "offer", sdp: o.sdp}); })
      .then(function(){ return l.pc.createAnswer(); }).then(function(a){ return l.pc.setLocalDescription(a); }).then(function(){ return waitIce(l.pc); })
      .then(function(){ return pack({v: 2, t: "a", sdp: slim(l.pc.localDescription.sdp), me: ME}); })
      .then(function(code){
        window._xcnCode = code;
        $("step1").classList.add("hide"); $("step2").classList.remove("hide");
        $("s2p").textContent = "Connecting to " + host + "…";
        var sent = room && navigator.onLine ? fetch(sigUrl(room), {method: "POST", credentials: "same-origin", headers: {"Content-Type": "application/json"}, body: JSON.stringify({code: code})}).then(function(r){ return r.ok; }).catch(function(){ return false; }) : Promise.resolve(false);
        sent.then(function(ok){
          setTimeout(function(){              // still not connected (no internet): show the reply for their front camera
            if (view !== "join" || l.peer) return;
            $("s2h").textContent = "Almost done";
            $("s2p").innerHTML = "No internet, so turn your screen to face <b>" + esc(host) + "</b>’s phone for a moment. Their front camera reads this code and you are connected.";
            qrInto($("qr"), code);
          }, ok ? 4000 : 300);
        });
      })
      .catch(function(e){ $("jm").className = "msg bad"; $("jm").textContent = e.message; });
  }
  $("scanb").onclick = function(){ scan($("cam"), useOffer, function(m){ $("jm").className = "msg bad"; $("jm").textContent = m; }); };
  $("pasteb").onclick = function(){ var t = prompt("Paste the code from the other phone:"); if (t) useOffer(t); };
  window._xcnOffer = useOffer;
}

/* ---------- chat screen ---------- */
var view = "home", chatPeer = null;
function headInfo(){
  var st = $("cst"), lk = $("lks"); if (!st) return;
  var o = openLinks(), live = o.length && conv() === chatPeer;
  st.textContent = live ? (GID ? "🟢 Group chat, no internet needed" + (relayOn() ? " · " + (o.length + 1) + " phones through you" : "") : "🟢 Connected, no internet needed") : "Not connected";
  if (lk) lk.innerHTML = live && GID && relayOn() ? o.map(function(x){ return "<span>" + esc(x.peer.n) + "</span>"; }).join("") : "";
}
function chat(id, live){
  if (!id) return home();
  stopScan(); view = "chat"; chatPeer = id;
  allPeers().then(function(a){
    var p = a.filter(function(x){ return x.i === id; })[0] || {i: id, n: "Chat"};
    var connected = openLinks().length && conv() === id;
    var one = !p.g && openLinks()[0] && openLinks()[0].peer;
    app.innerHTML = '<div class="chat"><div class="chead"><button class="btn g" id="cb" style="padding:8px 12px">←</button><div class="av">' + (p.g ? "👥" : esc(initials(p.n))) + '</div><div style="min-width:0"><b style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;max-width:44vw">' + esc(p.n) + '</b><small id="cst"></small></div><span class="sp"></span>'
      + (connected ? '<button class="btn g" id="addp" style="padding:8px 10px;font-size:12.5px;white-space:nowrap">➕ Add people' + (PRO ? "" : ' <span class="pro">PRO</span>') + '</button>' : "")
      + (one && one.u ? '<a class="btn g" style="padding:8px 10px;font-size:12.5px" href="/u/' + encodeURIComponent(one.u) + '">Profile</a>' : '') + '</div><div class="links" id="lks"></div>'
      + '<div class="banner' + (connected ? " hide" : "") + '" id="cban">Not connected. <a href="#" id="recon">Connect again</a> (scan codes again)</div>'
      + '<div class="msgs" id="msgs"></div><div class="cin"><button id="att" title="Send a photo or file">📎</button><input type="file" id="file" class="hide" multiple><textarea id="ctext" rows="1" placeholder="Message" ' + (connected ? "" : "disabled") + '></textarea><button class="s" id="send">➤</button></div></div>';
    headInfo();
    $("cb").onclick = home; $("recon").onclick = function(e){ e.preventDefault(); home(); };
    if ($("addp")) $("addp").onclick = function(){ startHost(true); };
    $("send").onclick = sendText;
    $("ctext").onkeydown = function(e){ if (e.key === "Enter" && !e.shiftKey){ e.preventDefault(); sendText(); } };
    $("att").onclick = function(){ if (openLinks().length) $("file").click(); };
    $("file").onchange = function(){ [].forEach.call(this.files, sendFile); this.value = ""; };
    msgsOf(id).then(function(ms){ ms.sort(function(x, y){ return x.ts - y.ts; }).forEach(bubble); });
  });
}
function sys(t){ var b = $("msgs"); if (!b) return; var d = document.createElement("div"); d.className = "sys"; d.textContent = t; b.appendChild(d); b.scrollTop = b.scrollHeight; }
function bubble(m){
  var b = $("msgs"); if (!b || view !== "chat") return;
  var d = document.createElement("div"); d.className = "bub" + (m.dir === "out" ? " me" : ""); if (m.id) d.setAttribute("data-id", m.id);
  var tick = m.dir === "out" ? (m.ack ? " ✓✓" : " ✓") : "", who = m.who && m.dir === "in" ? '<span class="who">' + esc(m.who) + "</span>" : "";
  if (m.kind === "text") d.innerHTML = who + esc(m.text) + "<small>" + hm(m.ts) + tick + "</small>";
  else d.innerHTML = who + '<div class="f">📎 <span>' + esc(m.name) + '</span></div><div style="font-size:12px;color:var(--soft)">' + size(m.size) + '</div>' + (m.loading ? '<div class="bar"><i></i></div>' : "") + "<small>" + hm(m.ts) + tick + "</small>";
  b.appendChild(d); b.scrollTop = b.scrollHeight;
  if (m.kind === "file" && m.blob) fillFile(m.id, m.blob, m);
  else if (m.kind === "file" && !m.loading && !m.blob && m.dir === "in") d.querySelector(".f").insertAdjacentHTML("afterend", '<div style="font-size:12px;color:var(--soft)">Large file, saved only while it was open.</div>');
}
function prog(id, f){ var el = document.querySelector('[data-id="' + id + '"] .bar i'); if (el) el.style.width = Math.round(Math.min(1, f) * 100) + "%"; }
function fillFile(id, blob, info){
  var el = document.querySelector('[data-id="' + id + '"]'); if (!el) return;
  var bar = el.querySelector(".bar"); if (bar) bar.remove();
  var url = URL.createObjectURL(blob), isImg = /^image\//.test(info.mime || blob.type);
  if (isImg && !el.querySelector("img")) el.querySelector(".f").insertAdjacentHTML("beforebegin", '<a href="' + url + '" target="_blank"><img src="' + url + '" alt=""></a>');
  if (!el.querySelector("a[download]")) el.querySelector(".f").insertAdjacentHTML("beforeend", ' <a download="' + esc(info.name) + '" href="' + url + '" style="margin-left:auto;font-size:13px">Save</a>');
}
function broadcast(obj){ openLinks().forEach(function(x){ sendTo(x, obj); }); }
function sendText(){
  var t = $("ctext"), v = t.value.trim(), room = conv(); if (!v || !room || room !== chatPeer) return;
  var id = rid(), m = {peer: room, dir: "out", kind: "text", text: v.slice(0, 5000), ts: Date.now(), id: id};
  seen[id] = 1; if (!GID) pending[id] = m;
  broadcast({t: "msg", id: id, text: m.text, gid: GID, from: {i: ME.i, n: ME.n}, ttl: 4}); t.value = "";
  addMsg(m).then(function(k){ m.k = k; if (m.ack) putMsg(m); }); bubble(m); touch(room, v);
}
function sendFile(f){
  var room = conv(); if (!room) return;
  if (f.size > 200 * 1048576){ sys("Files up to 200 MB."); return; }
  var id = rid(), gid = GID, m = {peer: room, dir: "out", kind: "file", name: f.name, mime: f.type, size: f.size, ts: Date.now(), id: id, loading: 1};
  seen[id] = 1; bubble(m);
  outQ = outQ.then(function(){
    broadcast({t: "file", id: id, name: f.name, mime: f.type, size: f.size, gid: gid, from: {i: ME.i, n: ME.n}, ttl: 4});
    var off = 0, CH = 16000;
    return new Promise(function(res, rej){
      function full(){ return openLinks().some(function(x){ return x.dc.bufferedAmount > 4 * 1048576; }); }
      function pump(){
        if (!openLinks().length) return rej(new Error("closed"));
        if (full()) return setTimeout(pump, 60);
        if (off >= f.size){ if (!gid) pending[id] = {id: id, ts: m.ts, dir: "out"}; broadcast({t: "fileend", id: rid(), fid: id, gid: gid, ttl: 4}); return res(); }
        f.slice(off, off + CH).arrayBuffer().then(function(b){ var fr = frame(id, b); openLinks().forEach(function(x){ sendTo(x, fr); }); off += b.byteLength; prog(id, off / f.size); pump(); }).catch(rej);
      }
      pump();
    });
  }).then(function(){
    var saved = {peer: room, dir: "out", kind: "file", name: f.name, mime: f.type, size: f.size, ts: m.ts, id: id, blob: f.size <= 8 * 1048576 ? f : null};
    var pr = pending[id]; if (pr && pr.ack) saved.ack = 1; else if (!gid) pending[id] = saved;
    addMsg(saved).then(function(k){ saved.k = k; if (saved.ack) putMsg(saved); }); fillFile(id, f, saved); touch(room, "📎 " + f.name);
  }).catch(function(){ sys("Sending stopped: the connection closed."); });
}

/* ---------- home ---------- */
function home(){
  stopScan(); view = "home";
  allPeers().then(function(ps){
    var live = conv();
    app.innerHTML = '<main><h1>Chat without internet</h1><p class="s">Talk and share photos and files with people near you — phone to phone, with no internet and no mobile data. Private: messages go straight between the phones and stay on them.</p>'
      + (live ? '<div class="card" style="border-color:#86EFAC;background:#F0FDF4"><h2>🟢 You are connected</h2><button class="btn ok" id="back2" style="width:100%">Open the chat</button></div>' : "")
      + '<div class="card"><h2>Your name</h2><input class="t" id="nm" maxlength="40" placeholder="Your name" value="' + esc(ME.n) + '"></div>'
      + '<div class="card"><h2>How it works</h2><ol class="steps"><li>One person turns on their phone’s <b>hotspot</b> (mobile data can be off). The other joins it in Wi-Fi. Or both use the same Wi-Fi.</li><li>One taps <b>Show my code</b>, the other taps <b>Scan a code</b> and scans it. Connected!</li><li>No internet on either phone? After scanning, hold the two screens facing each other for a second.</li></ol>'
      + '<div class="tip">📶 Range: about 10–30 m indoors and up to 50 m outside on a phone hotspot; a whole building on a Wi-Fi router.</div>'
      + '<div class="row" style="margin-top:12px"><button class="btn" id="hb">\uD83D\uDCF2 Show my code</button><button class="btn ok" id="jb">\uD83D\uDCF7 Scan a code</button></div></div>'
      + '<div class="card"><h2>Nearby <span class="pro">PRO</span></h2>' + (PRO ? '<p class="s" style="margin:0">✅ Active until <b>' + new Date(PRO.until).toLocaleDateString([], {day: "numeric", month: "short", year: "numeric"}) + '</b>. In a chat, tap <b>➕ Add people</b> to bring more people in or relay to someone further away.</p>'
        : '<p class="s">Group chat with up to 10 phones, and relay through your phone to reach people further away. Only the person who adds others needs it — they join free.</p><button class="btn g" id="pro">See Nearby Pro — from Rs 299</button>') + '</div>'
      + (ps.length ? '<div class="card"><h2>Your chats</h2><div class="list">' + ps.map(function(p){ return '<a href="#" data-p="' + esc(p.i) + '"><div class="av">' + (p.g ? "👥" : esc(initials(p.n))) + '</div><div><b>' + esc(p.n) + (live === p.i ? ' <span style="color:var(--ok);font-size:12px">● connected</span>' : "") + '</b><small>' + esc(p.prev || "") + '</small></div></a>'; }).join("") + '</div><p class="s" style="margin:8px 0 0;font-size:12.5px">Saved on this phone only. To talk again, scan codes again.</p></div>' : "")
      + '</main>';
    $("nm").onchange = function(){ ME.n = this.value.trim().slice(0, 40); ls("xcn_name", ME.n); };
    function needName(){ ME.n = $("nm").value.trim().slice(0, 40); ls("xcn_name", ME.n); if (!ME.n){ $("nm").focus(); $("nm").style.borderColor = "#DC2626"; return false; } return true; }
    $("hb").onclick = function(){ if (needName()) startHost(!!live); };
    $("jb").onclick = function(){ if (needName()) startJoin(); };
    if ($("back2")) $("back2").onclick = function(){ chat(live, true); };
    if ($("pro")) $("pro").onclick = function(){ proSheet("Bring more people into one chat, or reach people further away through your phone."); };
    [].forEach.call(app.querySelectorAll("[data-p]"), function(a){ a.onclick = function(e){ e.preventDefault(); chat(a.getAttribute("data-p"), false); }; });
  });
}
if (!window.RTCPeerConnection){ app.innerHTML = '<main><div class="card"><h2>This browser cannot do Nearby chat</h2><p class="s">Open xpertcreation.com/nearby in Chrome or the Xpert app.</p></div></main>'; }
else home();
window.XCN = {pack: pack, unpack: unpack, setPro: function(p){ PRO = p; }};
})();
