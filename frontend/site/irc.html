<style>

</head><body><div id="xr" class="xr"><div class="xrload">* connecting to irc.xpertcreation.com…</div></div>
<script>
(function(){
  "use strict";
  var AUTO = ["#xpertcreation", "#xpertconnect", "#xpertacademy", "#help"], ROOMS = ["#xpertcreation", "#xpertconnect", "#xpertacademy", "#help", "#jobs", "#pakistan", "#tech", "#games"];
  var root = document.getElementById("xr"), ws = null, me = "", sso = null, caps = {}, capAcc = [], bufs = {}, order = [], cur = "*status", batches = {}, tries = 0, wantClose = false;
  function esc(s){ return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function link(s){ return esc(s).replace(/(https?:\/\/[^\s<]+[^\s<.,;:!?)\]'"])/g, '<a href="$1" target="_blank" rel="noopener nofollow">$1</a>'); }
  function strip(s){ return String(s).replace(/[\x02\x0F\x16\x1D\x1F]|\x03\d{0,2}(,\d{1,2})?/g, ""); }
  function color(n){ var h = 0; for (var i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) % 360; return "hsl(" + h + ",75%,66%)"; }
  function isChan(t){ return /^[#&]/.test(t); }
  function buf(name){ var k = name.toLowerCase(); if (!bufs[k]){ bufs[k] = {name: name, msgs: [], users: {}, topic: "", unread: 0, mention: false, joined: false}; order.push(k); } return bufs[k]; }
  function send(l){ if (ws && ws.readyState === 1) ws.send(l); }
  function parse(line){
    var m = {tags: {}, prefix: "", cmd: "", params: []}, i = 0;
    if (line[0] === "@"){ i = line.indexOf(" "); line.slice(1, i).split(";").forEach(function(t){ var k = t.indexOf("="); if (k < 0) m.tags[t] = true; else m.tags[t.slice(0, k)] = t.slice(k + 1).replace(/\\s/g, " ").replace(/\\:/g, ";").replace(/\\\\/g, "\\"); }); line = line.slice(i + 1); }
    if (line[0] === ":"){ i = line.indexOf(" "); m.prefix = line.slice(1, i); line = line.slice(i + 1); }
    var t = line.indexOf(" :"), trail = null; if (t >= 0){ trail = line.slice(t + 2); line = line.slice(0, t); }
    var p = line.split(" ").filter(Boolean); m.cmd = (p.shift() || "").toUpperCase(); m.params = p; if (trail !== null) m.params.push(trail);
    m.nick = m.prefix.split("!")[0]; return m;
  }
  function add(bname, msg, history){
    var b = buf(bname); msg.time = msg.time || new Date(); b.msgs.push(msg); if (b.msgs.length > 400) b.msgs.shift();
    if (!history && bname.toLowerCase() !== cur.toLowerCase() && !msg.sys){ b.unread++; if (msg.hl || !isChan(bname)) b.mention = true; }
    if (bname.toLowerCase() === cur.toLowerCase()) drawMsgs(); drawSide();
  }
  function line(m){
    var hl = m.text && me && m.nick !== me && new RegExp("\\b" + me.replace(/[^\w]/g, "\\$&") + "\\b", "i").test(m.text);
    var t = '<span class="t" title="' + esc(m.time.toLocaleString([], {weekday: "short", day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit"})) + '">[' + m.time.toLocaleTimeString([], {hour: "2-digit", minute: "2-digit", hour12: false}) + ']</span> ';
    var n = function(x){ return '<span class="n" data-u="' + esc(x) + '" style="color:' + color(x) + '">' + esc(x) + '</span>'; };
    if (m.kind === "join") return '<div class="xrmsg j">' + t + '<span class="ar">--&gt;</span> ' + n(m.who) + ' has joined ' + esc(m.chan) + '</div>';
    if (m.kind === "part") return '<div class="xrmsg p">' + t + '<span class="ar">&lt;--</span> ' + n(m.who) + ' ' + esc(m.text) + '</div>';
    if (m.motd) return '<div class="xrmsg motd"><span class="ar">-</span> ' + link(m.text) + '</div>';
    if (m.sys) return '<div class="xrmsg sys' + (m.art ? " art" : "") + '">' + t + '<span class="ar">-!-</span> ' + link(m.text) + '</div>';
    if (m.act) return '<div class="xrmsg act' + (hl ? " hl" : "") + '">' + t + '<span class="ar">*</span> ' + n(m.nick) + ' ' + link(m.text) + '</div>';
    return '<div class="xrmsg' + (m.nick === me ? " me" : "") + (hl ? " hl" : "") + '">' + t + '<span class="br">&lt;</span>' + n(m.nick) + '<span class="br">&gt;</span> ' + link(m.text) + '</div>';
  }
  function drawMsgs(){
    var b = buf(cur), L = document.getElementById("xrl"); if (!L) return; var atEnd = L.scrollHeight - L.scrollTop - L.clientHeight < 80, day = "", h = "";
    b.msgs.forEach(function(m){ var d = m.time.toDateString(); if (d !== day){ day = d; h += '<div class="xrday">' + m.time.toLocaleDateString([], {weekday: "short", day: "numeric", month: "short"}) + '</div>'; } h += line(m); });
    L.innerHTML = h || '<div class="xrmsg sys"><span class="ar">-!-</span> no messages yet</div>'; if (atEnd || b._jump){ L.scrollTop = L.scrollHeight; b._jump = false; }
    document.getElementById("xrt").textContent = b.name; document.getElementById("xrtopic").textContent = b.name === "*status" ? "irc.xpertcreation.com \u00b7 XpertCreation IRC network" : (b.topic || (isChan(b.name) ? "(no topic)" : "Private query"));
    var U = Object.keys(b.users).sort(function(a, c){ var w = function(x){ return b.users[x] === 'op' ? 2 : b.users[x] === 'v' ? 1 : 0; }; return w(c) - w(a) || a.toLowerCase().localeCompare(c.toLowerCase()); });
    document.getElementById("xru").innerHTML = isChan(b.name) ? '<h4>' + U.length + ' in this room</h4>' + U.map(function(u){ return '<button data-u="' + esc(u) + '"><span style="color:' + color(u) + ';font-weight:700">' + (b.users[u] === 'op' ? '@' : b.users[u] === 'v' ? '+' : '') + esc(u) + '</span></button>'; }).join("") : '<h4>Private chat</h4>';
    document.getElementById("xrinput").placeholder = b.name === "*status" ? "type /join #channel or /help" : "message " + b.name; var pr = document.getElementById("xrprompt"); if (pr) pr.textContent = "[" + (me || "\u2026") + "]";
  }
  function drawSide(){
    var ch = order.filter(function(k){ return isChan(bufs[k].name) && bufs[k].joined; }), pm = order.filter(function(k){ return !isChan(bufs[k].name) && bufs[k].name !== "*" && k !== "*status"; });
    var item = function(k){ var b = bufs[k]; return '<button class="xrb' + (k === cur.toLowerCase() ? " on" : "") + '" data-b="' + esc(b.name) + '">' + esc(b.name) + (b.unread ? '<span class="u' + (b.mention ? "" : " m") + '">' + b.unread + '</span>' : '') + '</button>'; };
    buf("*status"); document.getElementById("xrside").innerHTML = '<h4>Server</h4>' + item("*status") + '<h4>Channels</h4>' + ch.map(item).join("") + (pm.length ? '<h4>Queries</h4>' + pm.map(item).join("") : '')
      + '<h4>Join</h4>' + ROOMS.filter(function(r){ return ch.indexOf(r.toLowerCase()) < 0; }).map(function(r){ return '<button class="xrb" data-join="' + r + '">+ ' + r + '</button>'; }).join("")
      + '<div class="xrj"><input id="xrjoin" placeholder="#room or name" maxlength="40"><button data-jo>Go</button></div>';
  }
  function show(name){ cur = name; var b = buf(name); b.unread = 0; b.mention = false; b._jump = true; drawSide(); drawMsgs(); document.querySelectorAll(".xrs,.xru").forEach(function(e){ e.classList.remove("open"); }); var i = document.getElementById("xrinput"); if (i && window.innerWidth > 900) i.focus(); }
  function status(t){ var s = document.getElementById("xrst"); if (!s) return; s.textContent = t || ""; s.classList.toggle("on", !!t); }
  function layout(){
    root.innerHTML = '<header class="xrtop"><button class="xrmenu" data-open="xrside" aria-label="Channels">\u2630</button><img src="/brand/xpertconnect/xc-icon-64.png" alt=""><b>XpertCreation</b><span class="irc">IRC</span><span id="xrnet">\u25CF connecting\u2026</span><a href="/" class="back">\u2190 xpertcreation.com</a><button class="xrppl" data-open="xru" aria-label="Nicks">\uD83D\uDC65</button></header>'
      + '<div class="xrbody"><aside class="xrs" id="xrside"></aside><section class="xrm"><div class="xrh"><b id="xrt"></b><small id="xrtopic"></small></div><div class="xrst" id="xrst"></div><div class="xrl" id="xrl"></div>'
      + '<form class="xri" id="xrform" autocomplete="off"><span id="xrprompt">[\u2026]</span><input id="xrinput" maxlength="450" spellcheck="false"><button type="submit">\u21B5</button></form></section><aside class="xru" id="xru"></aside></div>'
      + '<footer class="xrfoot">XpertCreation IRC \u00b7 irc.xpertcreation.com \u00b7 \u00a9 XpertCreation \u00b7 Founder: Syed Khalid Hussain Shah</footer>';
    document.getElementById("xrform").addEventListener("submit", function(e){ e.preventDefault(); var i = document.getElementById("xrinput"); input(i.value); i.value = ""; });
    drawSide(); drawMsgs();
  }
  function input(t){
    t = t.trim(); if (!t) return; var b = buf(cur);
    if (cur === "*status" && t[0] !== "/"){ add("*status", {sys: true, text: "You are in the status window. Join a channel first: /join #xpertcreation"}); return; }
    if (t[0] === "/" && t[1] !== "/"){
      var sp = t.indexOf(" "), c = (sp < 0 ? t.slice(1) : t.slice(1, sp)).toLowerCase(), rest = sp < 0 ? "" : t.slice(sp + 1).trim();
      var a = rest ? rest.split(/\s+/) : [], ch = isChan(cur) ? cur : "", need = function(){ if (!ch){ add(cur, {sys: true, text: "Use this inside a channel."}); return false; } return true; };
      if (c === "join" && rest){ var r = a[0]; if (!isChan(r)) r = "#" + r; send("JOIN " + r); return; }
      if (c === "part" || c === "leave"){ if (ch) send("PART " + ch + " :" + (rest || "Bye")); return; }
      if ((c === "msg" || c === "query") && rest){ var to = a[0], tx = rest.slice(to.length).trim(); if (/^(nickserv|chanserv|hostserv|histserv)$/i.test(to)){ send("PRIVMSG " + to + " :" + tx); return; } buf(to); if (tx) say(to, tx); show(to); return; }
      if (c === "ns" || c === "nickserv"){ send("PRIVMSG NickServ :" + (rest || "help")); return; }
      if (c === "cs" || c === "chanserv"){ send("PRIVMSG ChanServ :" + (rest || "help")); return; }
      if (c === "hs" || c === "hostserv"){ send("PRIVMSG HostServ :" + (rest || "help")); return; }
      if (c === "me" && rest){ send("PRIVMSG " + cur + " :\x01ACTION " + rest + "\x01"); if (!caps["echo-message"]) add(cur, {nick: me, text: rest, act: true}); return; }
      if (c === "topic"){ if (need()) send(rest ? "TOPIC " + ch + " :" + rest : "TOPIC " + ch); return; }
      if (c === "whois" && a[0]){ whoisTo = cur; send("WHOIS " + a[0]); return; }
      if (/^(op|deop|voice|devoice)$/.test(c) && a[0]){ if (need()) send("MODE " + ch + " " + {op: "+o", deop: "-o", voice: "+v", devoice: "-v"}[c] + " " + a[0]); return; }
      if (c === "kick" && a[0]){ if (need()) send("KICK " + ch + " " + a[0] + " :" + (a.slice(1).join(" ") || "Please follow the rules")); return; }
      if ((c === "ban" || c === "unban") && a[0]){ if (need()) send("MODE " + ch + " " + (c === "ban" ? "+b " : "-b ") + (a[0].indexOf("!") < 0 && a[0].indexOf("@") < 0 ? a[0] + "!*@*" : a[0])); return; }
      if (c === "mode"){ send("MODE " + (a[0] && /^[+-]/.test(a[0]) && ch ? ch + " " + rest : (rest || ch))); return; }
      if (c === "invite" && a[0]){ if (need()) send("INVITE " + a[0] + " " + ch); return; }
      if (c === "away"){ send(rest ? "AWAY :" + rest : "AWAY"); add(cur, {sys: true, text: rest ? "You are marked as away: " + rest : "You are back."}); return; }
      if (c === "back"){ send("AWAY"); return; }
      if (c === "list"){ show("*status"); send("LIST"); return; }
      if (c === "names"){ if (need()) send("NAMES " + ch); return; }
      if (c === "oper" && a.length >= 2){ send("OPER " + a[0] + " " + a.slice(1).join(" ")); return; }
      if (c === "kill" && a[0]){ send("KILL " + a[0] + " :" + (a.slice(1).join(" ") || "Breaking the rules")); return; }
      if ((c === "quote" || c === "raw") && rest){ send(rest); return; }
      if (c === "clear"){ buf(cur).msgs = []; drawMsgs(); return; }
      if (c === "help"){ HELP.forEach(function(h){ add(cur, {sys: true, text: h}); }); return; }
      add(cur, {sys: true, text: "Unknown command. Type /help"}); return;
    }
    if (t.slice(0, 2) === "//") t = t.slice(1);
    say(cur, t);
  }
  var whoisTo = null;
  var HELP = ["XpertCreation IRC commands — one username everywhere: your nick is your XpertCreation username. New? Register free at https://xpertcreation.com/register",
    "Chat:      /join #room  · /part [reason]  · /msg nick text  · /me action  · /topic [text]  · /names  · /list  · /clear",
    "People:    /whois nick  · /away [reason]  · /back  · /invite nick",
    "Operators: /op nick  · /deop nick  · /voice nick  · /devoice nick  · /kick nick [reason]  · /ban nick  · /unban nick  · /mode +i  (inside a channel)",
    "NickServ:  /ns info  · /ns info nick   (nick registration is automatic with your XpertCreation account)",
    "ChanServ:  /cs register #room  · /cs info #room  · /cs op #room nick  · /cs deop #room nick  · /cs amode #room +o nick  · /cs help",
    "IRCops:    /oper name password  · /kill nick [reason]  · /quote RAW COMMAND",
    "Tips: tap a nick to chat privately · hover a time to see the full date · type // to send a message starting with /"];
  function say(to, t){ if (to === "*") return; send("PRIVMSG " + to + " :" + t); if (!caps["echo-message"]) add(to, {nick: me, text: t}); }
  function onLine(raw){
    var m = parse(raw), p = m.params, time = m.tags.time ? new Date(m.tags.time) : null, hist = !!(m.tags.batch && batches[m.tags.batch]);
    switch (m.cmd){
      case "PING": send("PONG :" + (p[0] || "")); break;
      case "CAP":
        if (p[1] === "LS"){ capAcc = capAcc.concat(p[p.length - 1].split(" ").filter(Boolean)); if (p[2] === "*") break;
          var want = ["sasl", "server-time", "message-tags", "echo-message", "batch", "chathistory", "draft/chathistory", "away-notify", "multi-prefix", "account-notify", "extended-join"];
          var have = capAcc.map(function(c){ return c.split("=")[0]; }).filter(function(c){ return want.indexOf(c) >= 0; }); capAcc = [];
          if (have.length) send("CAP REQ :" + have.join(" ")); else send("CAP END"); }
        else if (p[1] === "ACK"){ p[p.length - 1].split(" ").forEach(function(c){ if (c) caps[c.replace(/^-/, "")] = c[0] !== "-"; }); if (caps.sasl) send("AUTHENTICATE PLAIN"); else send("CAP END"); }
        else if (p[1] === "NAK") send("CAP END");
        break;
      case "AUTHENTICATE": if (p[0] === "+" && sso) send("AUTHENTICATE " + btoa(unescape(encodeURIComponent(sso.nick + "\0" + sso.nick + "\0" + sso.token)))); break;
      case "903": send("CAP END"); break;
      case "904": case "905": case "906": status("Sign-in failed. Retrying\u2026"); break;
      case "001": me = p[0]; tries = 0; status(""); add("*status", {sys: true, text: strip(p[p.length - 1] || "Welcome")}, true); netState(true); send("JOIN " + AUTO.join(","));
        if (caps.chathistory || caps["draft/chathistory"]) send("CHATHISTORY TARGETS timestamp=2000-01-01T00:00:00.000Z timestamp=" + new Date(Date.now() + 60000).toISOString() + " 30");
        break;
      case "CHATHISTORY": if (p[0] === "TARGETS" && p[1] && !isChan(p[1])){ var db = buf(p[1]); db.msgs = []; send("CHATHISTORY LATEST " + p[1] + " * 40"); drawSide(); } break;
      case "433": status("That name is in use."); break;
      case "311": case "312": case "313": case "317": case "319": case "330": case "338": case "378": case "379": case "671": case "320": case "276": case "301":
        add(whoisTo || cur, {sys: true, text: p.slice(1).join(" ").replace(/ :?/, " ")}, true); break;
      case "318": add(whoisTo || cur, {sys: true, text: "End of WHOIS"}, true); whoisTo = null; break;
      case "322": add("*status", {sys: true, text: p[1] + " (" + p[2] + " users) " + strip(p[3] || "")}, true); break;
      case "323": add("*status", {sys: true, text: "End of channel list"}, true); break;
      case "381": add(cur, {sys: true, text: "★ You are now an IRC operator."}, true); break;
      case "324": add(p[1], {sys: true, text: "Channel modes: " + p.slice(2).join(" ")}, true); break;
      case "367": add(p[1], {sys: true, text: "Ban: " + p[2]}, true); break;
      case "MODE": if (isChan(p[0])){ add(p[0], {sys: true, text: m.nick + " sets mode " + p.slice(1).join(" "), time: time}, hist); if (/[ov]/.test(p[1] || "")) send("NAMES " + p[0]); } break;
      case "353": var nb = buf(p[2]); if (nb._namesDone){ nb.users = {}; nb._namesDone = false; } (p[3] || "").split(" ").filter(Boolean).forEach(function(n){ var pre = (n.match(/^[~&@%+]+/) || [""])[0]; nb.users[n.slice(pre.length)] = /[~&@%]/.test(pre) ? "op" : (/\+/.test(pre) ? "v" : ""); }); break;
      case "375": case "372": add("*status", {motd: true, text: strip(p[p.length - 1] || "").replace(/^- ?/, "")}, true); break;
      case "376": add("*status", {motd: true, text: ""}, true); add("*status", {sys: true, text: "End of message of the day. Type /help for commands."}, true); break;
      case "002": case "003": case "251": case "255": case "265": case "266": add("*status", {sys: true, text: strip(p[p.length - 1] || "")}, true); break;
      case "BATCH": if (p[0][0] === "+"){ if (/chathistory/.test(p[1] || "")) batches[p[0].slice(1)] = p[2]; } else delete batches[p[0].slice(1)]; break;
      case "JOIN": var jc = p[0], jb = buf(jc);
        if (m.nick === me){ jb.joined = true; jb.users = {}; jb.msgs = []; if (caps.chathistory || caps["draft/chathistory"]) send("CHATHISTORY LATEST " + jc + " * 60"); if (jc.toLowerCase() === cur.toLowerCase() || cur === "*status" || !buf(cur).joined) show(jc); }
        else { jb.users[m.nick] = ""; if (!hist) add(jc, {kind: "join", who: m.nick, chan: jc, time: time}, true); }
        drawSide(); if (jc.toLowerCase() === cur.toLowerCase()) drawMsgs(); break;
      case "PART": var pb = buf(p[0]); if (m.nick === me){ pb.joined = false; var k = p[0].toLowerCase(); order = order.filter(function(x){ return x !== k; }); delete bufs[k]; if (k === cur.toLowerCase()) show(AUTO[0]); else drawSide(); }
        else { delete pb.users[m.nick]; add(p[0], {kind: "part", who: m.nick, text: "has left " + p[0] + (p[1] ? " (" + p[1] + ")" : ""), time: time}, true); } break;
      case "KICK": var kb = buf(p[0]); delete kb.users[p[1]]; add(p[0], {sys: true, text: p[1] + " was removed" + (p[2] ? " (" + p[2] + ")" : "")}, true); if (p[1] === me){ kb.joined = false; drawSide(); } break;
      case "QUIT": order.forEach(function(k){ var b = bufs[k]; if (b.users && m.nick in b.users){ delete b.users[m.nick]; add(b.name, {kind: "part", who: m.nick, text: "has quit" + (p[0] ? " (" + strip(p[0]) + ")" : ""), time: time}, true); } }); break;
      case "NICK": order.forEach(function(k){ var b = bufs[k]; if (m.nick in b.users){ b.users[p[0]] = b.users[m.nick]; delete b.users[m.nick]; if (k === cur.toLowerCase()) drawMsgs(); } }); if (m.nick === me) me = p[0]; break;
      case "332": buf(p[1]).topic = strip(p[2] || ""); drawMsgs(); break;
      case "TOPIC": buf(p[0]).topic = strip(p[1] || ""); add(p[0], {sys: true, text: m.nick + " changed the topic: " + strip(p[1] || ""), time: time}, hist); break;
      case "366": buf(p[1])._namesDone = true; if (p[1].toLowerCase() === cur.toLowerCase()) drawMsgs(); break;
      case "PRIVMSG": case "NOTICE":
        var target = p[0], text = strip(p[1] || ""), act = /^\x01ACTION /.test(p[1] || "");
        if (/^\x01/.test(p[1] || "") && !act) break;
        if (act) text = text.replace(/^\x01ACTION /, "").replace(/\x01$/, "");
        if (!m.nick || m.nick.indexOf(".") >= 0 && m.cmd === "NOTICE"){ if (m.cmd === "NOTICE") add("*status", {sys: true, text: text}, true); break; }
        var where = isChan(target) ? target : (m.nick === me ? target : m.nick);
        if (hist && !isChan(where) && batches[m.tags.batch] && !isChan(batches[m.tags.batch])) where = batches[m.tags.batch];
        if (/^(NickServ|ChanServ|HistServ|HostServ)$/i.test(m.nick) && m.cmd === "NOTICE"){ add(cur, {sys: true, text: "-" + m.nick + "- " + text}, true); break; }
        add(where, {nick: m.nick, text: text, act: act, time: time, hl: me && text.toLowerCase().indexOf(me.toLowerCase()) >= 0}, hist); break;
      case "ERROR": status("Disconnected: " + (p[0] || "")); break;
      default:
        if (/^4\d\d$/.test(m.cmd) && m.cmd !== "433") add(cur, {sys: true, text: p.slice(1).join(" ")}, true);
    }
  }
  function netState(on){ var d = document.getElementById("xrnet"); if (d){ d.className = on ? "on" : ""; d.textContent = on ? "\u25CF connected to irc.xpertcreation.com" : "\u25CF connecting\u2026"; } }
  function connect(){
    status(tries ? "Reconnecting\u2026" : "");
    fetch("/api/irc/token/", {credentials: "same-origin"}).then(function(r){ if (r.status === 401 || r.status === 403) throw "signin"; if (!r.ok) throw "down"; return r.json(); }).then(function(d){
      sso = d; caps = {}; capAcc = []; batches = {};
      ws = new WebSocket("wss://xpertcreation.com/webirc", ["text.ircv3.net"]);
      ws.onopen = function(){ send("CAP LS 302"); send("NICK " + d.nick); send("USER xc 0 * :XpertCreation member"); };
      ws.onmessage = function(e){ String(e.data).split(/\r?\n/).forEach(function(l){ if (l) onLine(l); }); };
      ws.onclose = function(){ netState(false); if (wantClose) return; tries++; status("Connection lost. Reconnecting\u2026"); order.forEach(function(k){ bufs[k].users = {}; }); setTimeout(connect, Math.min(30000, 1500 * tries)); };
    }).catch(function(e){
      if (e === "signin"){ root.innerHTML = '<div class="xrwall"><div><img src="/brand/xpertconnect/xc-icon-64.png" alt="" style="width:56px"><h2>XpertCreation IRC</h2><p>* Members only. Sign in with your XpertCreation account to join<br>#xpertcreation #xpertconnect #xpertacademy #help and more.</p>'
        + '<a href="/login?next=/irc" class="go">/login</a><a href="/register">/register (free)</a><p><a href="/">\u2190 back to xpertcreation.com</a></p></div></div>'; return; }
      tries++; status("Chat rooms are not reachable right now. Retrying\u2026"); setTimeout(connect, Math.min(30000, 2000 * tries));
    });
  }
  document.addEventListener("click", function(e){
    var t = e.target, x;
    if ((x = t.closest("[data-b]"))) return show(x.getAttribute("data-b"));
    if ((x = t.closest("[data-join]"))) return send("JOIN " + x.getAttribute("data-join"));
    if (t.closest("[data-jo]")){ var v = (document.getElementById("xrjoin").value || "").trim(); if (!v) return; if (isChan(v) || !/^[A-Za-z_\[\]\\`^{}|][\w\-\[\]\\`^{}|]*$/.test(v)){ send("JOIN " + (isChan(v) ? v : "#" + v.replace(/[^\w-]/g, ""))); } else { buf(v); show(v); } return; }
    if ((x = t.closest("[data-u]"))){ var u = x.getAttribute("data-u"); if (u && u !== me){ buf(u); show(u); } return; }
    if ((x = t.closest("[data-emo]"))){ var i = document.getElementById("xrinput"); i.value += x.getAttribute("data-emo"); i.focus(); return; }
    if ((x = t.closest("[data-open]"))){ document.getElementById(x.getAttribute("data-open")).classList.toggle("open"); return; }
    if (!t.closest(".xrs,.xru")) document.querySelectorAll(".xrs.open,.xru.open").forEach(function(el){ el.classList.remove("open"); });
  });
  window.addEventListener("beforeunload", function(){ wantClose = true; if (ws) try { ws.close(); } catch (e) {} });
  layout(); connect();
})();
</script>
