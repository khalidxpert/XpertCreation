<style>
:root{
  --ink:#0D1424; --ink-soft:#5A657C; --paper:#F6F7FB; --card:#FFF;
  --brand:#1B4DFF; --go:#00B37E; --hot:#B45309; --danger:#B91C1C; --line:#E4E8F2;
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.55;
  min-height:100vh;display:flex;flex-direction:column}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:var(--brand);text-decoration:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}

.top{display:flex;align-items:center;gap:9px;padding:14px 18px;border-bottom:1px solid var(--line);
  background:var(--card)}
.top .chip{width:40px;height:40px;border-radius:9px;background:#14151A;display:block}
.top .chip.gone{display:none}
.top b{font-family:var(--display);font-weight:800;font-size:17px;letter-spacing:-.03em}

main{flex:1;display:grid;place-items:center;padding:28px 18px 40px}
.card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);
  border-radius:22px;padding:26px 22px;box-shadow:0 2px 4px rgba(13,20,36,.04),0 14px 34px rgba(13,20,36,.07)}
h1{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.035em;line-height:1.1}
.sub{font-size:13.5px;color:var(--ink-soft);margin-top:7px;line-height:1.55}

.fld{margin-top:15px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);
  letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
.fld input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:var(--paper);font-size:15px;outline:none;transition:border-color .18s;font-family:inherit}
.fld input:focus{border-color:var(--brand);background:var(--card)}
.fld .pw{position:relative}
.fld .pw input{padding-right:48px}
.fld .pw .eye{position:absolute;top:50%;right:6px;transform:translateY(-50%);
  width:38px;height:38px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-soft);transition:color .15s,background .15s}
.fld .pw .eye:hover{background:var(--paper);color:var(--ink)}
.fld .pw .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.fld .note{font-size:11.5px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
.fld.code input{font-family:var(--mono);font-size:25px;letter-spacing:.34em;text-align:center}

.btn{width:100%;margin-top:20px;padding:15px;border-radius:14px;background:var(--brand);
  color:#fff;font-weight:700;font-size:15px;transition:opacity .2s}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.danger{background:var(--danger)}
.btn.ghost{background:var(--paper);color:var(--ink);border:1px solid var(--line);margin-top:10px}

.rows{display:flex;justify-content:space-between;gap:10px;margin-top:17px;font-size:13px;flex-wrap:wrap}
.rows span{color:var(--ink-soft)}
.rows button{color:var(--brand);font-weight:700}

.msg{margin-top:16px;padding:12px 14px;border-radius:12px;font-size:13.5px;line-height:1.55;display:none}
.msg.on{display:block}
.msg.err{background:rgba(180,83,9,.09);border:1px solid rgba(180,83,9,.3);color:#92400E}
.msg.ok{background:rgba(0,179,126,.09);border:1px solid rgba(0,179,126,.32);color:#00734F}

.who{display:flex;align-items:center;gap:12px;padding:14px;border-radius:15px;
  background:var(--paper);border:1px solid var(--line);margin-top:16px}
.who .av{width:42px;height:42px;border-radius:13px;background:var(--ink);color:#fff;
  display:grid;place-items:center;font-weight:700;font-size:17px;flex:0 0 auto}
.who .t{min-width:0}
.who .t b{display:block;font-size:14.5px}
.who .t small{display:block;font-size:12px;color:var(--ink-soft);font-family:var(--mono);
  overflow:hidden;text-overflow:ellipsis}

.links{display:grid;gap:8px;margin-top:18px}
.links a{display:flex;align-items:center;justify-content:space-between;padding:13px 15px;
  border-radius:13px;background:var(--paper);border:1px solid var(--line);
  color:var(--ink);font-size:14px;font-weight:600}
.links a small{color:var(--ink-soft);font-weight:400}

.warnbox{margin-top:18px;padding:15px;border-radius:14px;background:rgba(185,28,28,.06);
  border:1px solid rgba(185,28,28,.28)}
.warnbox b{display:block;font-size:14px;color:var(--danger);margin-bottom:7px}
.warnbox ul{margin:0;padding-left:19px}
.warnbox li{font-size:13px;line-height:1.6;color:var(--ink)}

footer{padding:20px 18px 28px;text-align:center;font-size:12.5px;color:var(--ink-soft)}
footer a{color:var(--ink-soft);margin:0 8px}

/* floating support button */
.wafab{position:fixed;z-index:80;right:16px;bottom:calc(18px + env(safe-area-inset-bottom));
  width:52px;height:52px;border-radius:17px;background:#25D366;display:grid;place-items:center;
  box-shadow:0 8px 24px rgba(37,211,102,.4);transition:transform .16s}
.wafab:active{transform:scale(.93)}
.wafab svg{width:27px;height:27px;fill:#fff}
body.rtl .wafab{right:auto;left:16px}
@media(min-width:1100px){
  .wafab{right:calc(50% - 520px);}
  body.rtl .wafab{left:calc(50% - 520px);right:auto}
}

.avwrap{display:flex;align-items:center;gap:14px;margin-top:16px}
/* Upload ke buttons. .avwrap .pick ka CSS in par nahi lagta tha, is liye
   ye bilkul saade aur ek doosre se chipke hue dikh rahe the. */
.avpick{margin-top:16px}
.avpick .row{display:flex;gap:10px;flex-wrap:wrap}
.avpick button{padding:12px 18px;border-radius:13px;font-size:14px;
  font-weight:700;border:1.5px solid transparent;cursor:pointer;
  display:inline-flex;align-items:center;gap:8px;transition:all .16s}
.avpick .go{background:var(--brand,#1B4DFF);color:#fff;
  box-shadow:0 4px 14px rgba(27,77,255,.26)}
.avpick .go:hover{transform:translateY(-1px);
  box-shadow:0 7px 18px rgba(27,77,255,.32)}
.avpick .alt{background:var(--paper,#F6F7FB);color:var(--ink,#0D1424);
  border-color:var(--line,#E4E8F2)}
.avpick .alt:hover{border-color:var(--brand,#1B4DFF);color:var(--brand,#1B4DFF)}
.avpick .kill{background:transparent;color:#B91C1C;border-color:#F3C6C6;
  margin-top:10px;padding:9px 15px;font-size:13px}
.avpick .kill:hover{background:#FEF2F2;border-color:#DC2626}
.avpick .msg{margin-top:10px;font-size:13px;color:var(--ink-soft,#5A657C)}
.avpick .msg.bad{color:#B91C1C}
@media(max-width:420px){
  .avpick .row{flex-direction:column}
  .avpick .row button{width:100%;justify-content:center}
}
.avbig{width:72px;height:72px;border-radius:22px;object-fit:cover;flex:0 0 auto;
  border:2px solid var(--line);background:var(--paper)}
.avbig.ph{display:grid;place-items:center;font-family:var(--display);font-weight:800;
  font-size:28px;color:#fff;background:var(--ink);border-color:var(--ink)}
.avwrap .t{flex:1;min-width:0}
.avwrap .t b{display:block;font-size:16px;font-weight:700}
.avwrap .t small{display:block;font-size:12.5px;color:var(--ink-soft);
  font-family:var(--mono);overflow:hidden;text-overflow:ellipsis}
.avwrap .pick{padding:9px 14px;border-radius:11px;background:var(--paper);
  border:1px solid var(--line);font-size:12.5px;font-weight:700;white-space:nowrap}

.avgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:9px;
  margin-top:14px;max-height:44vh;overflow-y:auto;padding:2px}
.avgrid img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;
  border:2px solid var(--line);cursor:pointer;background:var(--paper);
  transition:transform .14s,border-color .14s}
.avgrid img:hover{transform:scale(1.04)}
.avgrid img.on{border-color:var(--brand);box-shadow:0 0 0 3px rgba(27,77,255,.18)}

.setrow{display:flex;align-items:center;gap:12px;padding:14px;border-radius:14px;
  background:var(--paper);border:1px solid var(--line);margin-top:10px}
.setrow .t{flex:1;min-width:0}
.setrow .t b{display:block;font-size:14px;font-weight:700}
.setrow .t small{display:block;font-size:12px;color:var(--ink-soft);margin-top:3px;line-height:1.5}
.sw{width:46px;height:27px;border-radius:99px;background:var(--line);position:relative;
  flex:0 0 auto;transition:background .2s;cursor:pointer}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:21px;height:21px;
  border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.sw.on{background:var(--go)}
.sw.on::after{transform:translateX(19px)}

.wish{position:relative;overflow:hidden;border-radius:20px;padding:24px 20px;margin-bottom:18px;
  background:linear-gradient(135deg,#DB2777,#7C3AED 55%,#1B4DFF);color:#fff;text-align:center;
  box-shadow:0 12px 34px rgba(219,39,119,.3)}
.wish h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.03em;
  line-height:1.2;position:relative;z-index:2}
.wish p{font-size:14px;line-height:1.6;margin-top:8px;opacity:.94;position:relative;z-index:2}
.wish a{display:inline-block;margin-top:15px;padding:11px 22px;border-radius:12px;
  background:#fff;color:#0D1424;font-weight:700;font-size:13.5px;position:relative;z-index:2}
.wish .cf{position:absolute;top:-14px;font-size:17px;opacity:.85;pointer-events:none;
  animation:wfall linear infinite}
@keyframes wfall{
  0%{transform:translateY(-16px) rotate(0);opacity:0}
  12%{opacity:.9}
  100%{transform:translateY(260px) rotate(400deg);opacity:0}
}
@media(prefers-reduced-motion:reduce){ .wish .cf{display:none} }

.gear{width:34px;height:34px;border-radius:11px;background:var(--card,#fff);
  border:1px solid var(--line,#E4E8F2);display:grid;place-items:center;
  color:var(--ink-soft,#5A657C);flex:0 0 auto;text-decoration:none}
.gear svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}

/* ---------- phone layout ---------- */
@media (max-width: 560px){
  /* Nothing may be wider than the screen. One stray element makes the whole
     page scroll sideways, which feels broken even when nothing else is. */
  html, body{overflow-x:hidden;max-width:100vw}

  .top, .topbar{padding:10px 12px;gap:6px}
  .top b, .topbar b, .brandbar b{font-size:15px}
  .top .chip, .topbar .chip, .brandbar img{width:28px;height:28px}

  /* The wordmark goes; the logo alone is enough on a small screen. */
  .brandbar b{display:none}

  .gear{width:36px;height:36px}
  .langwrap{padding:4px 7px 4px 8px}
  .langwrap select, .langwrap #langSel{max-width:60px;font-size:12.5px}
  .acctbtn, .who{max-width:96px;font-size:11.5px;padding:5px 10px 5px 5px}
  .acctbtn img, .acctbtn .ini{width:21px;height:21px;font-size:10px}

  /* Cards to the edge, with the padding on the page instead. */
  .wrap{padding-left:14px;padding-right:14px}
  .hello{padding:18px 16px;border-radius:20px}
  .hello .t b{font-size:19px}
  .hellolines .ln{flex-wrap:wrap;gap:4px}
  .hellolines .ln .k{min-width:78px;font-size:12.5px}
  .hellolines .ln .v{font-size:13.5px}
  .hellolines .today2{font-size:14.5px}

  .grid2{grid-template-columns:1fr 1fr;gap:9px}
  .tiles{gap:9px}
  .slide{min-height:200px;padding:20px}
  .slide h3{font-size:22px}
  .about{padding:20px 16px}
  .about .contact{grid-template-columns:1fr;gap:8px}
  .about .contact a{display:flex;align-items:center;gap:12px;text-align:left;padding:12px}
  .about .contact .ic2{margin:0}
  .about .pic{width:66px;height:66px;border-radius:20px}

  .row, .row3b, .two{grid-template-columns:1fr}
  .row3b .swap{width:100%;height:38px}
  .keys{gap:5px}
  .keys button{padding:12px 0;font-size:14px}
}

@media (max-width: 380px){
  .grid2{grid-template-columns:1fr}
  .hello .av{width:48px;height:48px}
  .hello .t b{font-size:17px}
}

/* ---------- bell ---------- */
.bellbtn{position:relative;width:34px;height:34px;border-radius:11px;background:var(--card,#fff);
  border:1px solid var(--line,#E4E8F2);display:grid;place-items:center;color:var(--ink-soft,#5A657C);
  flex:0 0 auto}
.bellbtn svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.8;
  stroke-linecap:round;stroke-linejoin:round}
.bellbtn .dot4{position:absolute;top:5px;right:5px;min-width:15px;height:15px;padding:0 3px;
  border-radius:99px;background:#DC2626;color:#fff;font-size:9.5px;font-weight:800;
  display:none;align-items:center;justify-content:center;line-height:1}
.bellbtn.has .dot4{display:flex}

.belldrop{position:fixed;top:58px;right:12px;left:12px;max-width:380px;margin-left:auto;
  z-index:200;background:var(--card,#fff);border:1px solid var(--line,#E4E8F2);
  border-radius:18px;box-shadow:0 16px 40px rgba(13,20,36,.24);display:none;

.belldrop.on{display:block}
.belldrop .hd5{display:flex;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line,#E4E8F2)}
.belldrop .hd5 b{font-family:var(--display,inherit);font-weight:800;font-size:14.5px}
.belldrop .hd5 button{margin-left:auto;font-size:11.5px;color:var(--brand,#1B4DFF);font-weight:700}
.nitem3{display:block;padding:12px 16px;border-bottom:1px solid var(--line,#E4E8F2);
  text-decoration:none;color:inherit}
.nitem3:last-child{border-bottom:none}
.nitem3.unread{background:rgba(27,77,255,.04)}
.nitem3 p{font-size:13px;line-height:1.5}
.nitem3 small{display:block;font-size:11px;color:var(--ink-soft,#5A657C);margin-top:4px}
.nempty{padding:30px 16px;text-align:center;font-size:13px;color:var(--ink-soft,#5A657C)}

.botlinkbox{background:var(--card);border:1px solid var(--line);border-radius:16px;
  padding:16px;margin-top:14px}
.botlinkbox h4{font-family:var(--display);font-weight:800;font-size:14.5px;margin-bottom:11px}
.botrow{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line)}
.botrow:first-of-type{border-top:none;padding-top:0}
.botrow .bicon{width:38px;height:38px;border-radius:11px;display:grid;place-items:center;
  color:#fff;font-size:17px;flex:0 0 auto}
.botrow .bicon.discord{background:#5865F2}
.botrow .bicon.telegram{background:#26A5E4}
.botrow .bt{flex:1;min-width:0}
.botrow .bt b{display:block;font-size:13.5px;font-weight:700}
.botrow .bt small{display:block;font-size:11.5px;color:var(--ink-soft)}
.botrow button{padding:9px 15px;border-radius:11px;font-size:12.5px;font-weight:700}
.botrow .connectbtn{background:var(--ink);color:#fff}
.botrow .disconnectbtn{background:var(--paper);border:1px solid var(--line);color:var(--bad,#DC2626)}
.codebox2{margin-top:10px;padding:14px;border-radius:13px;background:var(--paper);
  border:1px dashed var(--line);text-align:center}
.codebox2 .code3{font-family:var(--mono);font-weight:800;font-size:24px;letter-spacing:.12em;
  color:var(--ink)}
.codebox2 p{font-size:12px;color:var(--ink-soft);margin-top:8px;line-height:1.6}
</style>

<script>
(function(){
  "use strict";

  var API = "/api";
  var me = null, busy = false, email = "", msg = "", msgType = "err";
  var avatars = [], picking = false, birthdayToday = false;
  // Homepage ki tasveer par click ?pick=1 ke sath yahan bhejta hai, taake
  // upload ka khana pehle se khula mile aur ek qadam kam ho jaye.
  try {
    if (new URLSearchParams(location.search).get("pick") === "1") picking = true;
  } catch (e) {}
  var editingName = false, editingBday = false;
  var MONTHS_LIST = ["January","February","March","April","May","June","July","August","September","October","November","December"];

  function avatarFor(key){
    if (!key) return null;
    // Uploaded tasveer .jpg par khatam hoti hai; baqi purani keys hain.
    if (/\.jpg$/.test(key)){
      return "/media/avatars/" + key
        + (me && me.avatar_bust ? "?v=" + me.avatar_bust : "");
    }
    var a = avatars.filter(function(x){ return x.key === key; })[0];
    return a ? "/brand/avatars/" + a.file : null;
  }

  // The screen comes from the URL, so /login and /register are real,
  // shareable, bookmarkable addresses rather than states inside one page.
  function screenFromPath(){
    var p = location.pathname.replace(/\/+$/, "") || "/";
    if (p === "/register") return "register";
    if (p === "/account/delete") return "delete";
    if (p === "/account") return "account";
    return "login";
  }
  var screen = screenFromPath();

  function esc(s){
    return String(s == null ? "" : s)
      .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
      .replace(/"/g,"&quot;");
  }

  function cookie(name){
    var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return m ? m.pop() : "";
  }

  function api(path, opts){
    opts = opts || {};
    var h = {"Content-Type":"application/json"};
    if (opts.method && opts.method !== "GET") h["X-CSRFToken"] = cookie("xc_csrf");
    return fetch(API + path, {
      method: opts.method || "GET", headers: h, credentials: "same-origin",
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        return { ok: r.ok, status: r.status, data: d };
      });
    }).catch(function(){
      return { ok:false, status:0, data:{ detail:"Network error. Check your connection." } };
    });
  }

  document.getElementById("card").addEventListener("click", function(e){
    var eye = e.target.closest("[data-eye]");
    if (eye){
      var inp = document.getElementById(eye.getAttribute("data-eye"));
      if (!inp) return;
      var showing = inp.type === "text";
      inp.type = showing ? "password" : "text";
      eye.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
      eye.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      eye.setAttribute("title", showing ? "Show password" : "Hide password");
      inp.focus();
      return;

    var act = e.target.closest("[data-a]");
    if (act && act.getAttribute("data-a") === "choosepic"){
      var inp = document.getElementById("avatarUpload");
      if (inp) inp.click();
      return;
    }
    if (act && act.getAttribute("data-a") === "takepic"){
      var cam = document.getElementById("avatarCam");
      if (cam) cam.click();
      return;
    }
    if (act && act.getAttribute("data-a") === "buildav"){
      location.href = "/avatar-builder";

    if (act && act.getAttribute("data-a") === "removepic"){
      me.avatar = ""; picking = false; draw();
      return api("/auth/avatar/", {method:"POST", body:{avatar: ""}});

    var b = e.target.closest("[data-a]");

          if (r.data.needs_verification){ screen = "verify"; msg = r.data.detail; }

          if (r.ok && r.data.user){ me = r.data.user; birthdayToday = !!r.data.birthday_today; try{ if(birthdayToday) sessionStorage.setItem("xc_wish","1"); }catch(e){} return next(); }

          fail(r);

        busy = false;
        if (!r.ok) return fail(r);
        me = r.data; editingName = false;
        msg = "Saved."; msgType = "ok"; draw();
      });
    }

    if (a === "signout"){
      busy = true; draw();
      return api("/auth/logout/", {method:"POST"}).then(function(){ location.href = "/"; });
    }

    if (a === "delete"){
      busy = true; draw();
      return api("/auth/delete-account/", {method:"POST",
        body:{password:val("pass"), confirm:val("confirm")}})
        .then(function(r){
          if (r.ok){ location.href = "/?deleted=1"; return; }
          fail(r);
        });

    var msg = document.getElementById("avatarMsg");
    if (f.size > 2 * 1024 * 1024){
      if (msg){ msg.textContent = "That picture is larger than 2 MB.";
                msg.className = "msg bad"; }
      return;
    }
    if (msg){ msg.textContent = "Uploading\u2026"; msg.className = "msg"; }
    var fd = new FormData();
    fd.append("file", f);
    fetch("/api/auth/avatar/upload/", {
      method: "POST",
      credentials: "same-origin",
      headers: {"X-CSRFToken": cookie("xc_csrf")},
      body: fd
    }).then(function(r){
      return r.json().catch(function(){ return {}; })
        .then(function(d){ return {ok: r.ok, data: d}; });
    }).then(function(r){
      if (!r.ok){
        if (msg){ msg.textContent = r.data.detail || "That did not work.";
                  msg.className = "msg bad"; }
        return;
      }
      me.avatar = r.data.avatar;
      // Browser purani tasveer cache se de sakta hai. Waqt jorne se wo
      // majboor ho jata hai ke nayi mange.
      me.avatar_bust = Date.now();
      picking = false;
      if (msg){ msg.textContent = "Saved."; msg.className = "msg"; }
      draw();
    }).catch(function(){
      if (msg){ msg.textContent = "Network error."; msg.className = "msg bad"; }
    });
  });

  api("/auth/avatars/").then(function(r){
    if (r.ok) avatars = r.data.avatars || [];
    if (me && screen === "account") draw();
  });
  api("/auth/me/").then(function(r){
    me = r.ok ? r.data : null;
    // Already signed in and landing on /login or /register: no point showing
    // a form they do not need.
    if (me && (screen === "login" || screen === "register")) screen = "account";
    if (!me && screen === "account") screen = "login";
    draw();
  });
})();
</script>

<script>
/* Bell: notifications for anyone signed in. One widget, shared by every
   page - reads /api/notify/mine/ and polls it, so a page open in one tab
   picks up something that happened in another. */
(function(){
  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }

  // The home gear button exists on nearly every page (added widely across
  // the site earlier), which makes it a far more reliable anchor than any
  // one page's account-button markup.
  var anchor = document.querySelector('[aria-label="Home"]') || document.querySelector(".gear");
  if (!anchor) return;

  fetch("/api/auth/me/", {credentials:"same-origin"})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(u){
      if (!u) return;   // signed out: nothing to show a bell for

      var bell = document.createElement("button");
      bell.className = "bellbtn";
      bell.setAttribute("aria-label", "Notifications");
      bell.innerHTML = '<svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>'
        + '<path d="M13.73 21a2 2 0 01-3.46 0"/></svg><span class="dot4"></span>';
      anchor.parentNode.insertBefore(bell, anchor);
      wireBell(bell);
    })
    .catch(function(){});

  function wireBell(bell){

  var drop = document.createElement("div");
  drop.className = "belldrop";
  document.body.appendChild(drop);

  function load(){
    fetch("/api/notify/mine/", {credentials:"same-origin"})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(d){
        if (!d) return;
        bell.classList.toggle("has", d.unread > 0);
        bell.querySelector(".dot4").textContent = d.unread > 9 ? "9+" : d.unread;

        var h = '<div class="hd5"><b>Notifications</b>'
          + (d.unread ? '<button id="markall">Mark all read</button>' : '') + '</div>';
        if (!d.notifications.length){
          h += '<div class="nempty">Nothing yet.</div>';
        } else {
          h += d.notifications.map(function(n){
            return '<a class="nitem3' + (n.read ? "" : " unread") + '" href="'
              + esc(n.link || "#") + '" data-nid="' + n.id + '">'
              + '<p>' + esc(n.text) + '</p><small>' + esc(n.when) + '</small></a>';
          }).join("");
        }
        drop.innerHTML = h;
      })
      .catch(function(){});
  }

  bell.addEventListener("click", function(e){
    e.stopPropagation();
    drop.classList.toggle("on");
    if (drop.classList.contains("on")) load();
  });
  document.addEventListener("click", function(e){
    if (!drop.contains(e.target) && e.target !== bell) drop.classList.remove("on");
  });
  drop.addEventListener("click", function(e){
    var mark = e.target.closest("#markall");
    if (mark){
      e.preventDefault();
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:"{}"}).then(load);
      return;
    }
    var item = e.target.closest("[data-nid]");
    if (item){
      fetch("/api/notify/read/", {method:"POST", credentials:"same-origin",
        headers:{"Content-Type":"application/json","X-CSRFToken":cookie("xc_csrf")},
        body:JSON.stringify({id: item.getAttribute("data-nid")})});
    }
  });

  load();
  setInterval(load, 45000);
  }
})();
</script>

<script>
/* Discord and Telegram linking, on the account page. A code is generated
   here and typed into the bot - never the other way around, so nobody can
   link an account by guessing a Discord or Telegram id. */
(function(){
  var box = document.getElementById("botlinkbox");
  if (!box) return;

  function esc(s){ return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;")
    .replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
  function cookie(n){ var m=document.cookie.match("(^|;)\\s*"+n+"\\s*=\\s*([^;]+)"); return m?m.pop():""; }
  function api(p,o){
    o=o||{};
    var h={"Content-Type":"application/json"};
    if(o.method&&o.method!=="GET") h["X-CSRFToken"]=cookie("xc_csrf");
    return fetch("/api/botlink"+p,{method:o.method||"GET",headers:h,credentials:"same-origin",
      body:o.body?JSON.stringify(o.body):undefined})
      .then(function(r){return r.json().catch(function(){return{};})
        .then(function(d){return{ok:r.ok,data:d};});})
      .catch(function(){return{ok:false,data:{detail:"Network error."}};});
  }

  var links = [], activeCode = null;

  function draw(){
    var byPlatform = {};
    links.forEach(function(l){ byPlatform[l.platform] = l; });

    var h = '<h4>Connect an account</h4>';
    [["discord","Discord","\ud83c\udfae"],["telegram","Telegram","\u2708\ufe0f"]].forEach(function(p){
      var key = p[0], name = p[1], emoji = p[2];
      var linked = byPlatform[key];
      h += '<div class="botrow">'
        + '<span class="bicon ' + key + '">' + emoji + '</span>'
        + '<span class="bt"><b>' + name + '</b>'
        + '<small>' + (linked ? "Connected as " + esc(linked.name || "your account")
                              : "Not connected") + '</small></span>'
        + (linked
            ? '<button class="disconnectbtn" data-unlink="' + key + '">Disconnect</button>'
            : '<button class="connectbtn" data-connect="' + key + '">Connect</button>')
        + '</div>';
    });

    if (activeCode){
      var botName = activeCode.platform === "discord" ? "our Discord bot" : "our Telegram bot";
      var cmd = activeCode.platform === "discord"
        ? "/xc-verify " + activeCode.code
        : "/verify " + activeCode.code;
      h += '<div class="codebox2"><div class="code3">' + esc(activeCode.code) + '</div>'
        + '<p>Send <b>' + esc(cmd) + '</b> to ' + botName + ' within 10 minutes.</p></div>';
    }

    box.innerHTML = h;
  }

  function load(){
    api("/mine/").then(function(r){
      if (r.ok) links = r.data.links || [];
      draw();
    });
  }

  box.addEventListener("click", function(e){
    var c = e.target.closest("[data-connect]");
    if (c){
      var platform = c.getAttribute("data-connect");
      api("/code/", {method:"POST", body:{platform: platform}}).then(function(r){
        if (!r.ok) return alert(r.data.detail || "Could not generate a code.");
        activeCode = {platform: platform, code: r.data.code};
        draw();
      });
      return;
    }
    var u = e.target.closest("[data-unlink]");
    if (u){
      var platform2 = u.getAttribute("data-unlink");
      if (!confirm("Disconnect " + platform2 + "?")) return;
      api("/unlink/", {method:"POST", body:{platform: platform2}}).then(function(){
        activeCode = null;
        load();
      });
    }
  });

  load();
})();
</script>
