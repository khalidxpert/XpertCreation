  function authBusy(on){ authState.busy = on; drawAuth(); }

  function authFail(r){
    authState.msg = r.data.detail
      || (r.data.email && r.data.email[0])
      || (r.data.password && r.data.password[0])
      || (r.data.code && r.data.code[0])
      || (r.data.new_password && r.data.new_password[0])
      || "Something went wrong.";
    authState.msgType = "err";
    authBusy(false);
  }

  document.getElementById("sheetBody").addEventListener("click", function(e){
    var eye = e.target.closest("[data-eye]");
    if (eye){
      var inp = document.getElementById(eye.getAttribute("data-eye"));
      if (!inp) return;
      var showing = inp.type === "text";
      inp.type = showing ? "password" : "text";
      eye.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
      eye.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      inp.focus();
      return;
    }

    var b = e.target.closest("[data-auth]");
    if (!b || authState.busy) return;
    var a = b.getAttribute("data-auth");

    if (a.indexOf("go-") === 0){
      authState.mode = a.slice(3);
      authState.msg = "";
      return drawAuth();
    }

    if (a === "signin"){
      // Read everything first. authBusy() re-renders the sheet, and anything
      // read after that comes back empty - which is what produced the
      // "field may not be blank" error on a visibly filled form.
      var f = { email: val("aEmail"), pass: val("aPass") };
      authState.email = f.email;
      authBusy(true);
      return api("/auth/login/", { method:"POST",
        body:{ email: f.email, password: f.pass } }).then(function(r){
        if (r.ok){ me = r.data.user; paintAcct(); closeAuth(); loadCerts(); return loadProgress(); }
        if (r.data.needs_verification){ authState.mode = "verify"; authState.msg = r.data.detail; }
        return authFail(r);
      });
    }

    if (a === "register"){
      var f = { email: val("aEmail"), pass: val("aPass"), name: val("aName") };
      authState.email = f.email;
      authBusy(true);
      return api("/auth/register/", { method:"POST",
        body:{ email: f.email, password: f.pass, full_name: f.name,
               preferred_lang: lang } }).then(function(r){
        if (r.ok){ authState.mode = "verify"; authState.msg = ""; return authBusy(false); }
        return authFail(r);
      });
    }

    if (a === "verify"){
      var code = val("aCode");
      authBusy(true);
      return api("/auth/verify-email/", { method:"POST",
        body:{ email: authState.email, code: code } }).then(function(r){
        if (r.ok && r.data.user){ me = r.data.user; paintAcct(); closeAuth(); loadCerts(); return loadProgress(); }
        if (r.ok){ authState.mode = "signin"; authState.msg = r.data.detail; authState.msgType = "ok"; return authBusy(false); }
        return authFail(r);
      });
    }

    if (a === "resend"){
      authBusy(true);
      return api("/auth/resend-verify/", { method:"POST", body:{ email: authState.email } })
        .then(function(r){
          authState.msg = r.data.detail || "";
          authState.msgType = r.ok ? "ok" : "err";
          authBusy(false);
        });
    }

    if (a === "forgot"){
      authState.email = val("aEmail");
      authBusy(true);
      // email captured above, nothing else to read
      return api("/auth/forgot-password/", { method:"POST", body:{ email: authState.email } })
        .then(function(r){
          if (r.ok){ authState.mode = "reset"; authState.msg = ""; return authBusy(false); }
          return authFail(r);
        });
    }

    if (a === "reset"){
      var r2 = { code: val("aCode"), pass: val("aPass") };
      authBusy(true);
      return api("/auth/reset-password/", { method:"POST",
        body:{ email: authState.email, code: r2.code, new_password: r2.pass } })
        .then(function(r){
          if (r.ok){ authState.mode = "signin"; authState.msg = r.data.detail; authState.msgType = "ok"; return authBusy(false); }
          return authFail(r);
        });
    }
  });

  function startQuiz(slug){
    if (!me) return openAuth("signin");
    api("/academy/quiz/" + slug + "/start/", { method:"POST" }).then(function(r){
      if (!r.ok){ alert(r.data.detail || "Could not start the quiz."); return; }
      quiz = { attempt_id: r.data.attempt_id, questions: r.data.questions,
               pass_percent: r.data.pass_percent, answers: {}, result: null };

  function submitQuiz(){
    var unanswered = quiz.questions.filter(function(q){ return !quiz.answers[q.id]; }).length;
    if (unanswered){ alert(t("qUnanswered").replace("%d", unanswered)); return; }
    api("/academy/quiz/" + view.c + "/submit/", { method:"POST",
      body: { attempt_id: quiz.attempt_id, answers: quiz.answers } }).then(function(r){
      if (!r.ok){ alert(r.data.detail || "Could not submit."); return; }
      quiz.result = r.data;
      render();
      if (r.data.passed) loadCerts();
    });
  }

  function renderQuiz(c){
    if (quiz.result) return renderResult(c);

    var answered = Object.keys(quiz.answers).length;
    var total = quiz.questions.length;
    var h = '<div class="crumb"><button data-act="quizback">&larr; ' + esc(cname(c)) + '</button></div>'
      + '<div class="lesson" style="--accent:' + c.accent + '">'
      + '<h2>' + c.icon + ' ' + esc(cname(c)) + '</h2>'
      + '<div class="qbar"><div class="track"><i style="width:' + Math.round(answered/total*100) + '%"></i></div>'
      + '<span class="n">' + answered + " / " + total + '</span></div>';

    quiz.questions.forEach(function(q, i){
      h += '<div class="qcard"><p class="qt">' + (i+1) + '. ' + esc(q.text) + '</p>';
      q.choices.forEach(function(ch){
        var sel = quiz.answers[q.id] === ch.id;
        h += '<button class="opt' + (sel ? " sel" : "") + '" data-q="' + q.id + '" data-ch="' + ch.id + '">'
          + '<span class="dot"></span><span>' + esc(ch.text) + '</span></button>';
      });
      h += '</div>';
    });

    return h + '<button class="primary" data-act="quizsubmit">' + esc(t("qSubmit")) + '</button></div>';
  }

  function renderResult(c){
    var r = quiz.result;
    var h = '<div class="crumb"><button data-act="quizback">&larr; ' + esc(cname(c)) + '</button></div>'
      + '<div class="lesson" style="--accent:' + c.accent + '">'
      + '<div class="result">'
      + '<div class="big">' + r.percent + '%</div>'
      + '<div class="verdict ' + (r.passed ? "pass" : "fail") + '">'
      + (r.passed ? esc(t("passed")) : esc(t("failed"))) + '</div>'
      + '<p class="sub2">' + r.score + " / " + r.total + " &middot; " + esc(t("passed")) + " " + r.pass_percent + '%</p>';

    if (r.passed && r.review_needed){
      h += reviewForm(r.review_course);
    } else if (r.passed && r.certificate_serial){
      h += certDone(r.certificate_serial);
    } else if (!r.passed && r.retry_in_minutes){
      h += '<p class="sub2">' + esc(t("retryIn").replace("%d", r.retry_in_minutes)) + '</p>';
    }
    h += '</div>';

    // The explanations are the point: this is where the learner finds out WHY,
    // not just what they scored.
    r.review.forEach(function(it, i){
      var q = quiz.questions.filter(function(x){ return x.id === it.question_id; })[0] || { choices: [] };
      function label(id){
        var ch = q.choices.filter(function(x){ return x.id === id; })[0];
        return ch ? ch.text : "-";
      }
      h += '<div class="rev"><p class="rq">' + (i+1) + '. ' + esc(it.text) + '</p>'
        + '<p class="ra ' + (it.was_correct ? "ok" : "no") + '"><b>' + esc(t("yourAns")) + ':</b> '
        + esc(label(it.your_choice_id)) + (it.was_correct ? " &check;" : "") + '</p>';
      if (!it.was_correct){
        h += '<p class="ra ok"><b>' + esc(t("corrAns")) + ':</b> ' + esc(label(it.correct_choice_id)) + '</p>';
      }
      if (it.explanation) h += '<p class="ex">' + esc(it.explanation) + '</p>';
      h += '</div>';
    });

    return h + '</div>';
  }

  document.getElementById("app").addEventListener("click", function(e){
    var o = e.target.closest("[data-q]");
    if (o && quiz && !quiz.result){
      quiz.answers[parseInt(o.getAttribute("data-q"),10)] = parseInt(o.getAttribute("data-ch"),10);
      render();
    }
    var cp = e.target.closest("[data-copy]");
    if (cp){
      var pre = document.getElementById(cp.getAttribute("data-copy"));
      if (pre && navigator.clipboard){
        navigator.clipboard.writeText(pre.textContent).then(function(){
          cp.textContent = t("copied"); cp.classList.add("ok");
          setTimeout(function(){ cp.textContent = t("copy"); cp.classList.remove("ok"); }, 1600);
        }).catch(function(){});
      }
    }
  });


  /* ================= remote course content ================= */

  var loadingCourse = null;
  var loadError = null;

  function ensureContent(c){
    // Already loaded, or ships with the page.
    if (!c.remote || c.lessons.length) return true;
    if (loadingCourse === c.id) return false;

    loadingCourse = c.id;
    loadError = null;

    fetch(c.remote, { credentials: "same-origin" })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        // The JSON is an object keyed by lesson slug. Order comes from the
        // day number in the key, not from object key order, which is not
        // guaranteed for numeric-looking keys in every engine.
        var keys = Object.keys(data).sort(function(a, b){
          return (parseInt(a.replace(/\D/g, ""), 10) || 0)
               - (parseInt(b.replace(/\D/g, ""), 10) || 0);
        });
        c.lessons = keys.map(function(k){
          // Was hardcoded to 30, so every remote course said 30 even
          // when its own entry said 25. Take the course's number.
          return { key: k, t: data[k].t,
                   m: c.knownMinutes || 25, b: data[k].b };
        });
        loadingCourse = null;
        render();
      })
      .catch(function(){
        loadingCourse = null;
        loadError = c.id;
        render();
      });
    return false;
  }

  function loadingView(c){
    if (loadError === c.id){
      return '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
        + '<div class="loadbox">' + esc(t("loadFail"))
        + '<br><button data-act="retry">' + esc(t("retry")) + '</button></div>';
    }
    return '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
      + '<div class="loadbox">' + esc(t("loadingC")) + '</div>';
  }


  var board = null;

  function loadBoard(){
    api("/academy/learners/").then(function(r){
      board = r.ok ? r.data : { top: [], me: null };
      if (view.page === "board") render();
    });
  }

  function renderBoard(){
    var h = '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
      + '<div class="head"><h3>' + esc(t("topL")) + '</h3></div>'
      + '<p class="lead" style="margin:-6px 2px 16px;font-size:13.5px;color:var(--ink-soft)">'
      + esc(t("byCerts")) + '</p>';

    if (!board) return h + '<div class="empty2">' + esc(t("loadingC")) + '</div>';
    if (!board.top.length) return h + '<div class="empty2">' + esc(t("noBoard")) + '</div>';

    h += '<div class="lb">';
    board.top.forEach(function(row){
      var mine = board.me && board.me.rank === row.rank;
      h += '<div class="lbrow' + (row.rank <= 3 ? " gold" : "") + (mine ? " me" : "") + '">'
        + '<span class="r">' + (row.rank === 1 ? "\u2605" : row.rank) + '</span>'
        + '<span class="n' + (row.anonymous ? " anon" : "") + '">' + esc(row.name) + '</span>'
        + '<span class="v"><b>' + row.certificates + '</b>'
        + '<small>' + esc(t("certsW")) + ' &middot; ' + row.lessons + '</small></span></div>';
    });
    h += '</div>';

    // Outside the top 50 you still want to know where you stand.
    if (board.me && !board.top.some(function(x){ return x.rank === board.me.rank; })){
      h += '<div class="head"><h3>' + esc(t("youAre")) + '</h3></div><div class="lb">'
        + '<div class="lbrow me"><span class="r">' + board.me.rank + '</span>'
        + '<span class="n">' + esc(board.me.name) + '</span>'
        + '<span class="v"><b>' + board.me.certificates + '</b>'
        + '<small>' + esc(t("certsW")) + ' &middot; ' + board.me.lessons + '</small></span></div></div>';
    }

    h += '<p class="tinynote">' + esc(t("privacyL")) + '</p>'
      + '<a class="ctacard" href="https://xpertcreation.com/typing">'
      + '<span class="e">&#9000;</span><span class="t"><b>' + esc(t("typingCta")) + '</b>'
      + '<small>' + esc(t("typingDesc")) + '</small></span>'
      + '<span class="go">' + esc(t("open")) + ' &rarr;</span></a>';
    return h;
  }

  function render(push){
    syncUrl(push);
    var app = document.getElementById("app");
    if (view.page === "home") app.innerHTML = renderHome();
    else if (view.page === "certs") app.innerHTML = renderCerts();
    else if (view.page === "badges") app.innerHTML = renderBadges();
    else if (view.page === "board") app.innerHTML = renderBoard();
    else if (view.page === "vqueue") app.innerHTML = renderVideoQueue();
    else if (!ensureContent(courseById(view.c))) app.innerHTML = loadingView(courseById(view.c));
    else if (view.page === "course") app.innerHTML = renderCourse(courseById(view.c));
    else if (view.page === "quiz") app.innerHTML = renderQuiz(courseById(view.c));
    else app.innerHTML = renderLesson(courseById(view.c), view.l);
    // Tapping an answer re-renders; jumping to the top each time would make
    // the quiz unusable on a phone.
    if (!(view.page === "quiz" && quiz && !quiz.result)) window.scrollTo(0,0);
  }

  /* ---------- events (delegated, so re-render never breaks them) ---------- */

  document.getElementById("app").addEventListener("click", function(e){
    var cp = e.target.closest("[data-copy]");
    if (cp){
      var pre = document.getElementById(cp.getAttribute("data-copy"));
      if (pre && navigator.clipboard){
        navigator.clipboard.writeText(pre.textContent).then(function(){
          cp.textContent = t("copied");
          cp.classList.add("ok");
          setTimeout(function(){ cp.textContent = t("copy"); cp.classList.remove("ok"); }, 1600);
        }).catch(function(){});
      }
      return;
    }
    var card = e.target.closest("[data-course]");
    if (card && view.page === "home"){
      view = { page:"course", c:card.getAttribute("data-course"), l:0 };
      return render(true);
    }
    var nav = e.target.closest("[data-nav]");
    if (nav){
      view.page = nav.getAttribute("data-nav");
      if (view.page === "board" && !board) loadBoard();
      return render();
    }
    var sect = e.target.closest("[data-sect]");
    if (sect){
      var co0 = courseById(view.c);
      var k = co0.id + ":" + sect.getAttribute("data-sect");
      var el = sect.closest(".sect");
      openSections[k] = !el.classList.contains("open");
      return render();
    }

    // Works from the course page AND from the sidebar while reading, so you
    // can jump anywhere without going back a level.
    var li = e.target.closest("[data-lesson]");
    if (li && (view.page === "course" || view.page === "lesson")){
      view.page = "lesson";
      view.l = parseInt(li.getAttribute("data-lesson"), 10);
      return render(true);
    }
    var act = e.target.closest("[data-act]");
    if (act){
      var a = act.getAttribute("data-act");
      // Ye dono sirf lesson wale safe par kaam ke hain. Pehle ye upar
      // chalti thin, aur homepage par co undefined hone se lkey() error
      // de deta tha — us se sign in ka button bhi mar jata tha.
      if (a === "signin"){ return openAuth("signin"); }
      if (a === "register"){ return openAuth("register"); }
      if (a === "signout"){ return doSignOut(); }
      if (a === "retry"){ loadError = null; return render(); }
      if (a === "quiz"){ return startQuiz(view.c); }
      if (a === "quizsubmit"){ return submitQuiz(); }
      if (a === "quizback"){ quiz = null; view.page = "course"; return render(); }
      var co = courseById(view.c);
      var key = lkey(co, view.l);
      if (a === "toggle"){
        var now = !done[key];
        if (now) done[key] = true; else delete done[key];
        saveProgress(co.id, co.lessons[view.l].key, now);
        return render();
      }
      if (a === "next"){
        if (!done[key]) { done[key] = true; saveProgress(co.id, co.lessons[view.l].key, true); }
        view.l += 1;
        return render();
      }
      if (a === "prev"){ if (view.l > 0) view.l -= 1; return render(); }
    }
  });

  /* ---------- language ---------- */

  var RTL = ["ur","ar"];
  var FONTS = { ur:"Noto+Nastaliq+Urdu:wght@400;600;700", ar:"Noto+Naskh+Arabic:wght@400;600;700",
                hi:"Noto+Sans+Devanagari:wght@400;600;800", bn:"Noto+Sans+Bengali:wght@400;600;800" };
  var LONG = ["es","fr","pt","ru","tr","id"];
  var loaded = {};

  function loadFont(code){
    if (!FONTS[code] || loaded[code]) return;
    loaded[code] = true;
    var el = document.createElement("link");
    el.rel = "stylesheet";
    el.href = "https://fonts.googleapis.com/css2?family=" + FONTS[code] + "&display=swap";
    document.head.appendChild(el);
  }

  function applyLang(){
    loadFont(lang);
    var b = document.body;
    b.className = b.className.replace(/\bf-\w+\b/g,"").replace(/\brtl\b/g,"").trim();
    b.classList.add("f-"+lang);
    if (RTL.indexOf(lang)  !== -1) b.classList.add("rtl");
    if (LONG.indexOf(lang) !== -1) b.classList.add("f-long");
    document.documentElement.lang = lang;
    document.documentElement.dir  = RTL.indexOf(lang) !== -1 ? "rtl" : "ltr";
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      el.textContent = t(el.getAttribute("data-i18n"));
    });
    render();
  }

  document.getElementById("langSel").addEventListener("change", function(e){
    lang = e.target.value;
    applyLang();
  });

  applyLang();
  paintAcct();
  loadSession();
})();
</script>
