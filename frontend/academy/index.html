  function openReviewSheet(slug){
    var d = document.createElement("div");
    d.className = "rvover";
    d.innerHTML = reviewForm(slug);
    d.addEventListener("click", function(e){ if (e.target === d) d.remove(); });
    document.body.appendChild(d);
  }

  function sendReview(box){
    var slug = box.getAttribute("data-rvcourse");
    var stars = parseInt(box.getAttribute("data-stars") || "0", 10);
    var msg = box.querySelector(".rvmsg");
    if (!stars){ msg.textContent = "Pick a number of stars first."; return; }

    function pick(group){
      var b = box.querySelector('[data-rvgroup="' + group + '"] .on');
      return b ? parseInt(b.getAttribute("data-rvval"), 10) : null;
    }

    var btn = box.querySelector(".rvsend");
    btn.disabled = true;
    msg.textContent = "";

    api("/academy/review/", {method: "POST", body: {
      course: slug, stars: stars, clarity: pick("clarity"), pace: pick("pace"),
      comment: (box.querySelector(".rvtext").value || "").trim()
    }}).then(function(r){
      btn.disabled = false;
      if (!r.ok){
        msg.textContent = (r.data && r.data.detail) || "That did not go through. Try again.";
        return;
      }
      var serial = r.data.serial;
      certs.forEach(function(c){
        if (c.course === slug){ c.serial = serial; c.review_needed = false; }
      });
      if (quiz && quiz.result){
        quiz.result.certificate_serial = serial;
        quiz.result.review_needed = false;
      }
      var done = document.createElement("div");
      done.className = "rvbox";
      done.innerHTML = '<b class="rvh">Thank you</b>'
        + (r.data.comment_pending
            ? '<p class="rvp">Your stars are up. What you wrote appears once a '
              + 'moderator has read it.</p>'
            : '')
        + certDone(serial);
      var over = box.closest(".rvover");
      box.replaceWith(done);
      if (over && view.page === "certs"){
        var app = document.getElementById("app");
        if (app) app.innerHTML = renderCerts();
      }
    });
  }

  document.addEventListener("click", function(e){
    if (!e.target.closest) return;
    var s = e.target.closest("[data-rvstar]");
    if (s){
      var box = s.closest(".rvbox");
      var n = parseInt(s.getAttribute("data-rvstar"), 10);
      box.setAttribute("data-stars", n);
      box.querySelectorAll("[data-rvstar]").forEach(function(b){
        b.classList.toggle("on", parseInt(b.getAttribute("data-rvstar"), 10) <= n);
      });
      return;
    }
    var v = e.target.closest("[data-rvval]");
    if (v){
      v.parentNode.querySelectorAll("[data-rvval]").forEach(function(b){
        b.classList.toggle("on", b === v);
      });
      return;
    }
    var go = e.target.closest(".rvsend");
    if (go){ sendReview(go.closest(".rvbox")); return; }
    var o = e.target.closest("[data-rvopen]");
    if (o){ openReviewSheet(o.getAttribute("data-rvopen")); return; }
  });

  /* ================= roles and medals =================

     Seven medals, each growing bronze, silver, gold, diamond, and one
     role on top. Every number is something the person did. */

  var badgeData = null, badgeLoading = false;

  var TIER_FILL = {
    bronze:  ["#F4BE8E", "#A35D2D", "Bronze"],
    silver:  ["#F5F7FB", "#97A2B2", "Silver"],
    gold:    ["#FFE590", "#C98A0A", "Gold"],
    diamond: ["#CCF7FF", "#5A78FF", "Diamond"]
  };

  function medal(f, i){
    var c = f.tier ? TIER_FILL[f.tier] : ["#F1F3F7", "#CDD3DD", ""];
    var id = "mg" + i;
    return '<svg class="medal' + (f.tier ? "" : " off") + '" viewBox="0 0 100 112" aria-hidden="true">'
      + '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0" stop-color="' + c[0] + '"/>'
      + '<stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs>'
      + '<path d="M31 70 L22 110 L38 101 L50 110 L50 76 Z" fill="' + c[1] + '" opacity=".9"/>'
      + '<path d="M69 70 L78 110 L62 101 L50 110 L50 76 Z" fill="' + c[1] + '" opacity=".7"/>'
      + '<circle cx="50" cy="46" r="38" fill="url(#' + id + ')"/>'
      + '<circle cx="50" cy="46" r="30.5" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="2"/>'
      + '<circle cx="50" cy="46" r="38" fill="none" stroke="' + c[1] + '" stroke-opacity=".5" stroke-width="1.5"/>'
      + (f.tier === "diamond"
          ? '<path d="M80 12 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z" fill="#fff"/>'
          : '')
      + '<text x="50" y="57" text-anchor="middle" font-size="30">' + f.icon + '</text>'
      + '</svg>';
  }

  /* The four steps of one medal, so nothing is a secret. */
  function tierList(f){
    var names = ["Bronze", "Silver", "Gold", "Diamond"];
    var steps = f.steps || [];
    return '<div class="tiers">' + steps.map(function(goal, i){
      var got = f.value >= goal;
      return '<span class="tr' + (got ? " got" : "") + '">'
        + (got ? "\u2713 " : "") + names[i] + ' <b>' + goal + '</b></span>';
    }).join("") + '</div>';
  }

  function howItWorks(){
    return '<div class="hiw"><b>How it works</b>'
      + '<p>Everything here is counted from what you actually did. Time '
      + 'spent with the page open counts for nothing \u2014 a tab left '
      + 'open overnight would otherwise beat a week of real study.</p>'
      + '<div class="hrow"><span>\ud83c\udf93</span><div><b>Learner</b>'
      + '<small>Where everyone starts.</small></div></div>'
      + '<div class="hrow"><span>\ud83d\udcda</span><div><b>Scholar</b>'
      + '<small>Pass three courses.</small></div></div>'
      + '<div class="hrow"><span>\ud83c\udfac</span><div><b>Content Creator</b>'
      + '<small>Have one video published on a course.</small></div></div>'
      + '<div class="hrow"><span>\ud83c\udf1f</span><div><b>Mentor</b>'
      + '<small>A creator whose videos have 25 helpful votes.</small></div></div>'
      + '<p class="hnote">Tap any medal to see its four steps. Your role is '
      + 'always the highest one you have reached.</p></div>';
  }

  var boardData = null, boardLoading = false;

  function medalBoard(){
    if (!boardData){
      if (!boardLoading){
        boardLoading = true;
        api("/academy/board/medals/").then(function(r){
          boardLoading = false;
          boardData = r.ok ? (r.data.board || []) : [];
          if (view.page === "badges") render();
        });
      }
      return '<div class="empty2">Loading\u2026</div>';
    }
    if (!boardData.length) return '<div class="empty2">Nobody on the board yet.</div>';

    return '<div class="mboard">' + boardData.map(function(p, i){
      var pos = i + 1;
      var crown = pos === 1 ? "\ud83e\udd47" : pos === 2 ? "\ud83e\udd48"
                : pos === 3 ? "\ud83e\udd49" : "";
      return '<div class="brow' + (pos <= 3 ? " top" : "") + '">'
        + '<span class="bpos">' + (crown || pos) + '</span>'
        + '<span class="bnm"><b>' + esc(p.name) + '</b>'
        + '<small>' + p.icon + ' ' + esc(p.role) + '</small></span>'
        + '<span class="bmed">' + p.medals + '<small>medals</small></span>'
        + '</div>';
    }).join("") + '</div>';
  }

  function renderBadges(){
    var h = '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back"))
      + '</button></div>';
    if (!me) return h + '<div class="empty2">Sign in to see your badges.</div>';

    if (!badgeData){
      if (!badgeLoading){
        badgeLoading = true;
        api("/academy/badges/").then(function(r){
          badgeLoading = false;
          badgeData = r.ok ? r.data
            : {error: (r.data && r.data.detail) || "Could not load your badges."};
          if (view.page === "badges") render();
        });
      }
      return h + '<div class="empty2">Loading\u2026</div>';
    }
    if (badgeData.error) return h + '<div class="empty2">' + esc(badgeData.error) + '</div>';

    var r = badgeData.role;
    h += '<div class="rolecard"><span class="ri">' + r.icon + '</span>'
      + '<div class="rt"><small>Your role</small><b>' + esc(r.title) + '</b>'
      + (r.next
          ? '<span class="rn">Next: ' + r.next.icon + ' ' + esc(r.next.title)
            + ' \u2014 ' + esc(r.next.hint) + '</span>'
          : '<span class="rn">The highest role there is. Thank you for teaching others.</span>')
      + '</div></div>';

    h += '<div class="head"><h3>Medals</h3><span class="gn2">'
      + badgeData.earned + ' / ' + badgeData.families.length + '</span></div>';

    h += '<div class="medals">' + badgeData.families.map(function(f, i){
      var pct = 100, line = "All four tiers done";
      if (f.next){
        pct = Math.min(100, Math.round(f.value / f.next.goal * 100));
        line = f.value + " / " + f.next.goal + " for " + TIER_FILL[f.next.tier][2];
      }
      return '<div class="mcard" data-mcard="' + i + '">' + medal(f, i)
        + '<b>' + esc(f.title) + '</b>'
        + '<small class="mt t-' + (f.tier || "none") + '">'
        + (f.tier ? TIER_FILL[f.tier][2] : "Not yet") + '</small>'
        + '<small>' + esc(f.desc) + '</small>'
        + '<span class="mbar"><i style="width:' + pct + '%"></i></span>'
        + '<small class="mp">' + esc(line) + '</small>'
        + tierList(f) + '</div>';
    }).join("") + '</div>';

    h += howItWorks();
    h += '<div class="head"><h3>Most medals</h3></div>' + medalBoard();
    return h;
  }

  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-badges]") : null;
    if (!b) return;
    badgeData = null;      // fresh numbers each time it is opened
    boardData = null;
    view = {page: "badges", c: null, l: 0};
    render(true);
  });

  function lessonFor(c, i){
    var en = c.lessons[i];
    var tr = LESSON_I18N[lang] && LESSON_I18N[lang][c.id] && LESSON_I18N[lang][c.id][en.key];
    if (!tr) return { l: en, translated: false };
    return { l: { t: tr.t, m: en.m, key: en.key, b: tr.b }, translated: true };
  }

  function lessonTitle(c, i){
    return lessonFor(c, i).l.t;
  }

  function renderLesson(c, i){
    var res = lessonFor(c, i), l = res.l, ok = done[lkey(c,i)];
    var pct = Math.round(countDone(c) / c.lessons.length * 100);

    var body = '<article class="lesson" style="--accent:' + c.accent + '">'
      + '<h2>' + esc(l.t) + '</h2>'
      + '<p class="meta">' + (i+1) + " / " + c.lessons.length + " &middot; " + l.m + " " + esc(t("min")) + '</p>';

    if (!res.translated && lang !== "en"){
      body += '<div class="box warn"><b>' + esc(t("warn")) + '</b>' + esc(t("noteEn")) + '</div>';
    }

    l.b.forEach(function(bl){
      if (bl.k === "p"){
        body += '<p>' + esc(bl.v) + '</p>';
      } else if (bl.k === "h"){
        body += '<p class="h2">' + esc(bl.v) + '</p>';
      } else if (bl.k === "bullets"){
        body += '<ul class="bl">';
        bl.v.forEach(function(it){
          /* Lesson bullets read "<the word> = <what it means>". Splitting on
             that first " = " lets the word being taught carry the weight and
             the meaning sit back. Both halves are escaped exactly as before -
             the split happens after escaping, so a lesson file still cannot
             put markup on the page.

             The separator has to be spaced. Without that, an Excel bullet
             holding =SUM(A1:A5) would be torn in half at the wrong place. */
          var safe = esc(it);
          var at = safe.indexOf(" = ");
          if (at > 0){
            body += '<li><b class="tgt">' + speakable(safe.slice(0, at), c.id)
                  + '</b><span class="mean">' + safe.slice(at + 3)
                  + '</span></li>';
          } else {
            body += '<li>' + speakable(safe, c.id) + '</li>';
          }
        });
        body += '</ul>';
      } else if (bl.k === "ayah"){
        // Copied verbatim from the source lesson. Never reformatted.
        body += '<div class="ayah" dir="rtl" lang="ar">'
              + speakable(esc(bl.v), "alquran") + '</div>';
      } else if (bl.k === "trans"){
        body += '<div class="trans" dir="rtl">' + esc(bl.v) + '</div>';
      } else if (bl.k === "steps"){
        var parts = bl.v.split("|");
        body += '<p>' + esc(parts[0]) + '</p><ol>';
        for (var j = 1; j < parts.length; j++) body += '<li>' + esc(parts[j]) + '</li>';
        body += '</ol>';
      } else if (bl.k === "tip"){
        body += '<div class="box tip"><b>' + esc(t("tip")) + '</b>' + esc(bl.v) + '</div>';
      } else if (bl.k === "warn"){
        body += '<div class="box warn"><b>' + esc(t("warn")) + '</b>' + esc(bl.v) + '</div>';
      } else if (bl.k === "sheet"){
        body += renderSheet(bl.v);
      } else if (bl.k === "code"){
        body += renderCode(bl.v);
      } else if (bl.k === "run"){
        body += runnerFor(bl.v, c.id, view.l);
      } else if (bl.k === "img" && bl.v && /^\/academy\//.test(bl.v.src || "")){
        body += '<figure class="limg"><img src="' + esc(bl.v.src).replace(/"/g, "&quot;") + '" alt="' + esc(bl.v.cap || "").replace(/"/g, "&quot;") + '" loading="lazy">'
              + (bl.v.cap ? '<figcaption>' + esc(bl.v.cap) + '</figcaption>' : '') + '</figure>';
      } else if (bl.k === "file" && bl.v && /^\/academy\//.test(bl.v.url || "")){
        body += '<a class="lfile" href="' + esc(bl.v.url).replace(/"/g, "&quot;") + '" download><span class="lfi">&#11015;</span><span><b>' + esc(bl.v.name || "") + '</b><small>' + esc(bl.v.note || "") + '</small></span></a>';
      } else if (bl.k === "key"){
        body += '<div class="keys"><b>' + esc(t("keys")) + '</b>';
        bl.v.split("|").forEach(function(row){
          var kv = row.split("=");
          body += '<div class="kr"><kbd>' + esc(kv[0]) + '</kbd><span>' + esc(kv[1] || "") + '</span></div>';
        });
        body += '</div>';
      }
    });

    body += '<div class="navrow">'
      + '<button data-act="prev"' + (i === 0 ? " disabled" : "") + '>&larr; ' + esc(t("prev")) + '</button>'
      + '<button class="' + (ok ? "done" : "") + '" data-act="toggle">'
      + (ok ? "&#10003; " + esc(t("undone")) : esc(t("done"))) + '</button>';
    if (i < c.lessons.length - 1){
      body += '<button class="main" data-act="next">' + esc(t("next")) + ' &rarr;</button>';
    }
    body += '</div></article>';

    return '<div class="crumb"><button data-nav="course">&larr; ' + esc(cname(c)) + '</button></div>'
      + '<div class="pwrap" style="--accent:' + c.accent + ';margin:0 0 16px">'
      + '<div class="track"><i style="width:' + pct + '%"></i></div></div>'
      + '<div class="learn">' + body
      + '<aside class="side"><h4>' + esc(t("curriculum")) + '</h4>'
      + curriculum(c, i) + '</aside></div>';
  }

  function renderCerts(){

  function colLetter(n){
    var s = "";
    while (n >= 0){ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
    return s;
  }

  function renderSheet(d){
    var rows = d.rows || [];
    var wide = 0;
    rows.forEach(function(r){ if (r.length > wide) wide = r.length; });

    var h = '<div class="sheet">';
    if (d.cap) h += '<p class="cap">' + esc(d.cap) + '</p>';
    h += '<div class="scroll"><table><tr><th class="colh"></th>';
    for (var c = 0; c < wide; c++) h += '<th class="colh">' + colLetter(c) + '</th>';
    h += '</tr>';

    rows.forEach(function(r, ri){
      var isHdr = d.hdr && ri === 0;
      h += '<tr' + (isHdr ? ' class="hdr"' : '') + '><td class="rowh">' + (ri + 1) + '</td>';
      for (var c = 0; c < wide; c++){
        var v = r[c] === undefined ? "" : String(r[c]);
        var cls = "";
        if (v.charAt(0) === "=") cls = "fx";
        else if (v !== "" && !isNaN(v) && !isHdr) cls = "num";
        h += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(v) + '</td>';
      }
      h += '</tr>';
    });
    return h + '</table></div></div>';
  }

  var codeSeq = 0;

  /* ================= the code runner =================

     Reading code teaches less than changing it and seeing what breaks.
     This puts an editable box in the lesson with the answer beside it.

     Three languages, three machines:

       html    a sandboxed iframe
       js      a web worker, so a runaway loop can be killed
       python  Pyodide, fetched only when a Python lesson asks

     A block is written as:
         {"k":"run","v":"js\nconsole.log('hi')"}
     first line the language, the rest the starting code. */

  var runSeq = 0;
  var runners = {};          // id -> {lang, start, key}
  var pyodide = null;        // loaded once, then reused
  var pyLoading = null;

  function runnerFor(src, courseId, lessonIdx){
    var nl = src.indexOf("\n");
    var lang = (nl === -1 ? src : src.slice(0, nl)).trim().toLowerCase();
    var code = nl === -1 ? "" : src.slice(nl + 1);
    if (["html", "js", "javascript", "python", "py"].indexOf(lang) === -1){
      // Not a language we run - fall back to showing it, which is
      // better than swallowing the block
      return renderCode(src);
    }
    if (lang === "javascript") lang = "js";
    if (lang === "py") lang = "python";

    var id = "r" + (runSeq++);
    var key = "xc_run_" + courseId + "_" + lessonIdx + "_" + id;
    runners[id] = {lang: lang, start: code, key: key};

    // What they typed last time, if anything
    var saved = "";
    try { saved = localStorage.getItem(key) || ""; } catch (e) {}

    var label = lang === "html" ? "HTML" : lang === "js" ? "JavaScript" : "Python";

    return '<div class="runner" data-run-id="' + id + '">'
      + '<div class="rbar"><b>' + label + '</b>'
      + '<span class="rsp"></span>'
      + '<button class="rreset" type="button">Reset</button>'
      + '<button class="rgo" type="button">Run</button></div>'
      + '<textarea class="rcode" spellcheck="false" rows="'
      + Math.min(16, Math.max(4, (saved || code).split("\n").length + 1))
      + '">' + esc(saved || code) + '</textarea>'
      + '<div class="rout" hidden></div>'
      + '</div>';
  }

  /* Output goes through here so nothing a learner prints can put markup
     on the page. */
  function rprint(box, text, kind){
    var line = document.createElement("div");
    if (kind) line.className = kind;
    line.textContent = String(text);
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function rclear(el){
    var box = el.querySelector(".rout");
    box.innerHTML = "";
    box.hidden = false;
    return box;
  }

  function rbusy(el, on, msg){
    var sp = el.querySelector(".rsp");
    sp.textContent = on ? (msg || "Running\u2026") : "";
    el.querySelector(".rgo").disabled = !!on;
  }

  /* ---- HTML: straight into a sandboxed frame ---- */
  function runHtml(el, code){
    var box = rclear(el);
    var f = document.createElement("iframe");
    f.className = "rframe";
    // No allow-same-origin: the frame cannot reach this page at all
    f.setAttribute("sandbox", "allow-scripts");
    f.srcdoc = code;
    box.appendChild(f);
  }

  /* ---- JavaScript: in a worker, with a hard stop ---- */
  function runJs(el, code){
    var box = rclear(el);
    var src = [
      "self.onmessage = function(e){",
      "  var out = [];",
      "  var say = function(){",
      "    var parts = [];",
      "    for (var i = 0; i < arguments.length; i++){",
      "      var a = arguments[i];",
      "      try {",
      "        parts.push(typeof a === 'object' && a !== null",
      "          ? JSON.stringify(a) : String(a));",
      "      } catch (err) { parts.push(String(a)); }",
      "    }",
      "    self.postMessage({t:'log', v: parts.join(' ')});",
      "  };",
      "  var console = {log: say, info: say, warn: say, error: say};",
      "  try {",
      "    (new Function('console', e.data))(console);",
      "    self.postMessage({t:'done'});",
      "  } catch (err) {",
      "    self.postMessage({t:'err', v: String(err)});",
      "  }",
      "};"
    ].join("\n");

    var w;
    try {
      w = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
    } catch (e){
      rprint(box, "This browser will not run the sandbox.", "rerr");
      return;
    }

    rbusy(el, true);
    var lines = 0;
    // Three seconds is long for a lesson and short for a frozen tab.
    var killer = setTimeout(function(){
      w.terminate();
      rbusy(el, false);
      rprint(box, "Stopped after 3 seconds. Is there a loop with no end?",
             "rerr");
    }, 3000);

    w.onmessage = function(ev){
      var m = ev.data || {};
      if (m.t === "log"){
        if (++lines > 200){
          if (lines === 201) rprint(box, "\u2026too many lines, stopping here.",
                                    "rerr");
          return;
        }
        rprint(box, m.v);
      } else if (m.t === "err"){
        clearTimeout(killer);
        rbusy(el, false);
        rprint(box, m.v, "rerr");
        w.terminate();
      } else {
        clearTimeout(killer);
        rbusy(el, false);
        if (!lines) rprint(box, "Ran, but nothing was printed. Try console.log.",
                           "rdim");
        w.terminate();
      }
    };
    w.onerror = function(e){
      clearTimeout(killer);
      rbusy(el, false);
      rprint(box, e.message || "Something went wrong.", "rerr");
      w.terminate();
    };
    w.postMessage(code);
  }

  /* ---- Python: Pyodide, fetched the first time only ---- */
  function loadPyodide2(onProgress){
    if (pyodide) return Promise.resolve(pyodide);
    if (pyLoading) return pyLoading;

    onProgress("Fetching Python\u2026 (about 6 MB, once only)");
    pyLoading = new Promise(function(resolve, reject){
      var sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
      sc.onload = function(){
        onProgress("Starting Python\u2026");
        window.loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
        }).then(function(p){
          pyodide = p;
          resolve(p);
        }).catch(reject);
      };
      sc.onerror = function(){
        reject(new Error("Could not fetch Python. Check the connection."));
      };
      document.head.appendChild(sc);
    });
    pyLoading.catch(function(){ pyLoading = null; });
    return pyLoading;
  }

  function runPython(el, code){
    var box = rclear(el);
    rbusy(el, true, "Loading\u2026");

    loadPyodide2(function(msg){ rbusy(el, true, msg); })
      .then(function(py){
        rbusy(el, true);
        // print() writes to stdout; catch it and put it in the box
        py.setStdout({batched: function(line){ rprint(box, line); }});
        py.setStderr({batched: function(line){ rprint(box, line, "rerr"); }});
        var before = box.childNodes.length;
        return py.runPythonAsync(code).then(function(){
          rbusy(el, false);
          if (box.childNodes.length === before){
            rprint(box, "Ran, but nothing was printed. Try print().", "rdim");
          }
        });
      })
      .catch(function(e){
        rbusy(el, false);
        var msg = String(e && e.message ? e.message : e);
        // Pyodide errors carry the whole traceback; the last line is
        // the part a learner needs
        var lines = msg.trim().split("\n");
        rprint(box, lines[lines.length - 1] || msg, "rerr");
        if (lines.length > 1){
          rprint(box, lines.slice(0, -1).join("\n"), "rdim");
        }
      });
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest(".runner") : null;
    if (!el) return;
    var id = el.getAttribute("data-run-id");
    var meta = runners[id];
    if (!meta) return;

    if (e.target.closest(".rreset")){
      el.querySelector(".rcode").value = meta.start;
      try { localStorage.removeItem(meta.key); } catch (err) {}
      var box = el.querySelector(".rout");
      box.innerHTML = "";
      box.hidden = true;
      return;
    }

    if (!e.target.closest(".rgo")) return;
    var code = el.querySelector(".rcode").value;
    try { localStorage.setItem(meta.key, code); } catch (err) {}

    if (meta.lang === "html") runHtml(el, code);
    else if (meta.lang === "js") runJs(el, code);
    else runPython(el, code);
  });

  document.addEventListener("keydown", function(e){
    // Ctrl+Enter runs, the way every editor does it
    if (!(e.ctrlKey || e.metaKey) || e.key !== "Enter") return;
    var ta = e.target;
    if (!ta || !ta.classList || !ta.classList.contains("rcode")) return;
    e.preventDefault();
    var el = ta.closest(".runner");
    var go = el && el.querySelector(".rgo");
    if (go) go.click();
  });

  document.addEventListener("input", function(e){
    var ta = e.target;
    if (!ta || !ta.classList || !ta.classList.contains("rcode")) return;
    var el = ta.closest(".runner");
    var meta = runners[el && el.getAttribute("data-run-id")];
    if (!meta) return;
    try { localStorage.setItem(meta.key, ta.value); } catch (err) {}
  });

  function renderCodeLang(label, src){
    // Code in any language: comments dimmed, nothing else touched. Escape first, always.
    var out = esc(src).replace(/^(\s*)((?:#|\/\/|&lt;!--).*)$/gm, '$1<span class="cm">$2</span>');
    var id = "c" + (codeSeq++);
    return '<div class="code"><div class="bar"><b>' + esc(label) + '</b>'
      + '<button data-copy="' + id + '">' + esc(t("copy")) + '</button></div>'
      + '<pre id="' + id + '">' + out + '</pre></div>';
  }

  function renderCode(src){
    // "@Python", "@Terminal", "@JSX" ... on the first line names the language (setup_devcourses_v1).
    // Without it the block is VBA, as before.
    var lm = /^@([^\n]{1,24})\n/.exec(src);
    if (lm) return renderCodeLang(lm[1], src.slice(lm[0].length));
    // Highlight comments, strings and keywords. Escape first, always.
    var out = esc(src)
      .replace(/^(\s*)('.*)$/gm, '$1<span class="cm">$2</span>')
      .replace(/&quot;([^&]*?)&quot;/g, '<span class="st">&quot;$1&quot;</span>')
      .replace(/\b(Sub|End|Dim|As|If|Then|ElseIf|Else|For|To|Next|Step|With|Set|Exit|On|Error|GoTo|Not|MsgBox|String|Long|Double|Worksheet|True|False)\b/g,
               '<span class="kw">$1</span>');
    var id = "c" + (codeSeq++);
    return '<div class="code"><div class="bar"><b>' + esc(t("vbacode")) + '</b>'
      + '<button data-copy="' + id + '">' + esc(t("copy")) + '</button></div>'
      + '<pre id="' + id + '">' + out + '</pre></div>';
  }


  /* ================= API ================= */

  var API = "/api";

  function cookie(name){
    var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return m ? m.pop() : "";
  }

  function api(path, opts){
    opts = opts || {};
    var h = {"Content-Type": "application/json"};
    if (opts.method && opts.method !== "GET") h["X-CSRFToken"] = cookie("xc_csrf");
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: h,
      credentials: "same-origin",
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        return { ok: r.ok, status: r.status, data: d };
      });
    }).catch(function(){
      return { ok: false, status: 0, data: { detail: "Network error. Check your connection." } };
    });
  }

  /* ================= saying the words out loud =================

     A learner reading "annyeonghaseyo" still does not know how it
     sounds. The device already has voices; this just uses them.

     The word is found by its script, not by a separator, because the
     lessons are not written to one pattern. Korean day 1 reads
     "a  - like the a in father"; there is no " = " to split on. */

  var VOICE_FOR = {
    korean: "ko-KR", japanese: "ja-JP", alquran: "ar-SA",
    arabic: "ar-SA", german: "de-DE", french: "fr-FR",
    turkish: "tr-TR", spanish: "es-ES", chinese: "zh-CN"
  };

  // Hangul, Kana, Hanzi, Arabic. One run of them is a word to speak.
  var SCRIPT = /[\u0600-\u06FF\u3040-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uAC00-\uD7AF\u1100-\u11FF]+/g;

  var canSpeak = typeof window !== "undefined"
    && "speechSynthesis" in window
    && typeof window.SpeechSynthesisUtterance === "function";

  /* Wraps every run of foreign script in a tappable span. Takes text
     that is ALREADY escaped and only ever adds tags of its own, so a
     lesson file still cannot put markup on the page. */
  function speakable(safeText, courseId){
    if (!canSpeak) return safeText;
    var lang = VOICE_FOR[courseId];
    if (!lang) return safeText;
    SCRIPT.lastIndex = 0;
    return safeText.replace(SCRIPT, function(run){
      var clean = run.replace(/"/g, "&quot;");
      return '<span class="say" role="button" tabindex="0" '
        + 'data-say="' + clean + '" data-lang="' + lang + '" '
        + 'title="Hear it">' + run
        + '<span class="sayic" aria-hidden="true">\ud83d\udd0a</span></span>';
    });
  }

  var voicesReady = false;
  function warmVoices(){
    if (!canSpeak || voicesReady) return;
    // Voices arrive late on some browsers; asking early gets them loading
    window.speechSynthesis.getVoices();
    voicesReady = true;
  }

  function pickVoice(lang){
    var all = window.speechSynthesis.getVoices() || [];
    if (!all.length) return null;
    var base = lang.split("-")[0];
    var exact = all.filter(function(v){ return v.lang === lang; })[0];
    if (exact) return exact;
    // ko-KR asked for, ko_KR or plain ko offered - still the right voice
    var loose = all.filter(function(v){
      return (v.lang || "").replace("_", "-").split("-")[0] === base;
    })[0];
    return loose || null;
  }

  var saidOnce = false;
  function sayIt(text, lang, el){
    if (!canSpeak){
      if (!saidOnce){
        saidOnce = true;
        alert("This device has no speech built in, so the words cannot be "
            + "read aloud here.");
      }
      return;
    }
    try {
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(text);
      var v = pickVoice(lang);
      if (v){
        u.voice = v;
        u.lang = v.lang;
      } else {
        // No voice for this language. Speak anyway with whatever is
        // there - a rough attempt beats a button that does nothing.
        u.lang = lang;
      }
      u.rate = 0.82;          // slow, because this is for learning
      if (el){
        el.classList.add("saying");
        u.onend = u.onerror = function(){ el.classList.remove("saying"); };
      }
      window.speechSynthesis.speak(u);
    } catch (e){}
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-say]") : null;
    if (!el) return;
    e.preventDefault();
    warmVoices();
    sayIt(el.getAttribute("data-say"), el.getAttribute("data-lang"), el);
  });

  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = e.target && e.target.closest
      ? e.target.closest("[data-say]") : null;
    if (!el) return;
    e.preventDefault();
    warmVoices();
    sayIt(el.getAttribute("data-say"), el.getAttribute("data-lang"), el);
  });

  if (canSpeak && window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = function(){ voicesReady = true; };
  }

  /* ================= auth sheet ================= */

  var authState = { mode: "signin", email: "", busy: false, msg: "", msgType: "err" };

  /* Pehli dafa aane wale ko "Create account" dikhna chahiye — "Sign in"
     ka us ke liye koi matlab nahi. Login hote hi nishan rakh dete hain. */
  function seenBefore(){
    try { return localStorage.getItem("xc_seen") === "1"; }
    catch (e) { return false; }
  }
  function markSeen(){
    try { localStorage.setItem("xc_seen", "1"); } catch (e) {}
  }

  function openAuth(mode){
    authState = { mode: mode || "signin", email: authState.email, busy: false, msg: "", msgType: "err" };
    api("/auth/csrf/");           // seeds the csrftoken cookie
    drawAuth();
    document.getElementById("scrim").classList.add("on");
    document.getElementById("sheet").classList.add("on");
    document.body.style.overflow = "hidden";
  }

  function closeAuth(){
    document.getElementById("scrim").classList.remove("on");
    document.getElementById("sheet").classList.remove("on");
    document.body.style.overflow = "";
  }

  var EYE_OPEN = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7'
    + '-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_SHUT = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/>'
    + '<path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.9 17.9 0 0 1-3.4 4.3"/>'
    + '<path d="M6.5 6.9C3.8 8.6 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 4.1-.8"/>'
    + '<path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/></svg>';

  function fld(id, label, type, value, note, cls){
    var isPw = type === "password";
    var input = '<input id="' + id + '" type="' + type + '" value="' + esc(value || "") + '"'
      + (cls === "code" ? ' inputmode="numeric" maxlength="6"' : '')
      + (type === "email" ? ' autocomplete="email"' : '')
      + (isPw ? ' autocomplete="' + (authState.mode === "register" || authState.mode === "reset"
                                     ? "new-password" : "current-password") + '"' : '')
      + '>';
    if (isPw){
      input = '<span class="pw">' + input
        + '<button type="button" class="eye" data-eye="' + id + '"'
        + ' aria-label="Show password">' + EYE_OPEN + '</button></span>';
    }
    return '<div class="fld ' + (cls || "") + '">'
      + '<label for="' + id + '">' + esc(label) + '</label>'
      + input + (note ? '<p class="note">' + esc(note) + '</p>' : '') + '</div>';
  }

  function drawAuth(){
    var m = authState.mode, h = "";
    var msg = authState.msg
      ? '<div class="msg ' + authState.msgType + ' on">' + esc(authState.msg) + '</div>' : '';

    if (m === "signin"){
      h = '<h3>' + esc(t("signIn")) + '</h3>'
        + '<p class="sub">' + esc(t("saveHint")) + '</p>' + msg
        + fld("aEmail", t("lEmail"), "email", authState.email)
        + fld("aPass", t("lPass"), "password", "")
        + '<button class="primary" data-auth="signin">' + esc(authState.busy ? t("working") : t("signIn")) + '</button>'
        + '<div class="linkrow">'
        + '<button data-auth="go-forgot">' + esc(t("forgot")) + '</button>'
        + '<span>' + esc(t("noAcc")) + ' <button data-auth="go-register">' + esc(t("register")) + '</button></span>'
        + '</div>';

    } else if (m === "register"){
      h = '<h3>' + esc(t("register")) + '</h3>'
        + '<p class="sub">' + esc(t("saveHint")) + '</p>' + msg
        + fld("aName", t("lName"), "text", "", t("nameHint"))
        + fld("aEmail", t("lEmail"), "email", authState.email)
        + fld("aPass", t("lPass"), "password", "")
        + '<button class="primary" data-auth="register">' + esc(authState.busy ? t("working") : t("register")) + '</button>'
        + '<div class="linkrow"><span>' + esc(t("haveAcc"))
        + ' <button data-auth="go-signin">' + esc(t("signIn")) + '</button></span></div>';

    } else if (m === "verify"){
      h = '<h3>' + esc(t("vTitle")) + '</h3>'
        + '<p class="sub">' + esc(t("vHint")) + '<br><b>' + esc(authState.email) + '</b></p>' + msg
        + fld("aCode", t("lCode"), "text", "", "", "code")
        + '<button class="primary" data-auth="verify">' + esc(authState.busy ? t("working") : t("signIn")) + '</button>'
        + '<div class="linkrow">'
        + '<button data-auth="resend">' + esc(t("resend")) + '</button>'
        + '<button data-auth="go-signin">' + esc(t("cancel")) + '</button></div>';

    } else if (m === "forgot"){
      h = '<h3>' + esc(t("forgot")) + '</h3>'
        + '<p class="sub">' + esc(t("vHint")) + '</p>' + msg
        + fld("aEmail", t("lEmail"), "email", authState.email)
        + '<button class="primary" data-auth="forgot">' + esc(authState.busy ? t("working") : t("resend")) + '</button>'
        + '<div class="linkrow"><button data-auth="go-signin">' + esc(t("cancel")) + '</button></div>';

    } else if (m === "reset"){
      h = '<h3>' + esc(t("newPass")) + '</h3>'
        + '<p class="sub">' + esc(t("vHint")) + '<br><b>' + esc(authState.email) + '</b></p>' + msg
        + fld("aCode", t("lCode"), "text", "", "", "code")
        + fld("aPass", t("newPass"), "password", "")
        + '<button class="primary" data-auth="reset">' + esc(authState.busy ? t("working") : t("newPass")) + '</button>'
        + '<div class="linkrow"><button data-auth="go-signin">' + esc(t("cancel")) + '</button></div>';
    }
    var keep = {};
    document.querySelectorAll("#sheetBody input").forEach(function(i){ keep[i.id] = i.value; });

    document.getElementById("sheetBody").innerHTML = h;

    // Browser autofill does not fire an input event, so values have to be
    // carried over by hand or they vanish on the next draw.
    Object.keys(keep).forEach(function(id){
      var i = document.getElementById(id);
      if (i && !i.value) i.value = keep[id];
    });
  }

  function val(id){
    var e = document.getElementById(id);
    return e ? e.value.trim() : "";
  }

  function authBusy(on){ authState.busy = on; drawAuth(); }

  function authFail(r){
    authState.msg = r.data.detail
      || (r.data.email && r.data.email[0])
      || (r.data.password && r.data.password[0])
      || (r.data.code && r.data.code[0])
      || (r.data.new_password && r.data.new_password[0])
      || "Something went wrong.";
    authState.msgType = "err";
    authBusy(false);
  }

  document.getElementById("sheetBody").addEventListener("click", function(e){
    var eye = e.target.closest("[data-eye]");
    if (eye){
      var inp = document.getElementById(eye.getAttribute("data-eye"));
      if (!inp) return;
      var showing = inp.type === "text";
      inp.type = showing ? "password" : "text";
      eye.innerHTML = showing ? EYE_OPEN : EYE_SHUT;
      eye.setAttribute("aria-label", showing ? "Show password" : "Hide password");
      inp.focus();
      return;
    }

    var b = e.target.closest("[data-auth]");
    if (!b || authState.busy) return;
    var a = b.getAttribute("data-auth");

    if (a.indexOf("go-") === 0){
      authState.mode = a.slice(3);
      authState.msg = "";
      return drawAuth();
    }

    if (a === "signin"){
      // Read everything first. authBusy() re-renders the sheet, and anything
      // read after that comes back empty - which is what produced the
      // "field may not be blank" error on a visibly filled form.
      var f = { email: val("aEmail"), pass: val("aPass") };
      authState.email = f.email;
      authBusy(true);
      return api("/auth/login/", { method:"POST",
        body:{ email: f.email, password: f.pass } }).then(function(r){
        if (r.ok){ me = r.data.user; paintAcct(); closeAuth(); loadCerts(); return loadProgress(); }
        if (r.data.needs_verification){ authState.mode = "verify"; authState.msg = r.data.detail; }
        return authFail(r);
      });
    }

    if (a === "register"){
      var f = { email: val("aEmail"), pass: val("aPass"), name: val("aName") };
      authState.email = f.email;
      authBusy(true);
      return api("/auth/register/", { method:"POST",
        body:{ email: f.email, password: f.pass, full_name: f.name,
               preferred_lang: lang } }).then(function(r){
        if (r.ok){ authState.mode = "verify"; authState.msg = ""; return authBusy(false); }
        return authFail(r);
      });
    }

    if (a === "verify"){
      var code = val("aCode");
      authBusy(true);
      return api("/auth/verify-email/", { method:"POST",
        body:{ email: authState.email, code: code } }).then(function(r){
        if (r.ok && r.data.user){ me = r.data.user; paintAcct(); closeAuth(); loadCerts(); return loadProgress(); }
        if (r.ok){ authState.mode = "signin"; authState.msg = r.data.detail; authState.msgType = "ok"; return authBusy(false); }
        return authFail(r);
      });
    }

    if (a === "resend"){
      authBusy(true);
      return api("/auth/resend-verify/", { method:"POST", body:{ email: authState.email } })
        .then(function(r){
          authState.msg = r.data.detail || "";
          authState.msgType = r.ok ? "ok" : "err";
          authBusy(false);
        });
    }

    if (a === "forgot"){
      authState.email = val("aEmail");
      authBusy(true);
      // email captured above, nothing else to read
      return api("/auth/forgot-password/", { method:"POST", body:{ email: authState.email } })
        .then(function(r){
          if (r.ok){ authState.mode = "reset"; authState.msg = ""; return authBusy(false); }
          return authFail(r);
        });
    }

    if (a === "reset"){
      var r2 = { code: val("aCode"), pass: val("aPass") };
      authBusy(true);
      return api("/auth/reset-password/", { method:"POST",
        body:{ email: authState.email, code: r2.code, new_password: r2.pass } })
        .then(function(r){
          if (r.ok){ authState.mode = "signin"; authState.msg = r.data.detail; authState.msgType = "ok"; return authBusy(false); }
          return authFail(r);
        });
    }
  });

  document.getElementById("acctBtn").addEventListener("click", function(){
    // Button ab saaf keh raha hai ke kya karega, is liye seedha yahin.
    if (me) acDoLogout();
    else openAuth("signin");
  });
  document.getElementById("scrim").addEventListener("click", closeAuth);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") closeAuth(); });

  /* ================= quiz ================= */

  function startQuiz(slug){
    if (!me) return openAuth("signin");
    api("/academy/quiz/" + slug + "/start/", { method:"POST" }).then(function(r){
      if (!r.ok){ alert(r.data.detail || "Could not start the quiz."); return; }
      quiz = { attempt_id: r.data.attempt_id, questions: r.data.questions,
               pass_percent: r.data.pass_percent, answers: {}, result: null };
      view.page = "quiz";
      render();
    });
  }

  function submitQuiz(){
    var unanswered = quiz.questions.filter(function(q){ return !quiz.answers[q.id]; }).length;
    if (unanswered){ alert(t("qUnanswered").replace("%d", unanswered)); return; }
    api("/academy/quiz/" + view.c + "/submit/", { method:"POST",
      body: { attempt_id: quiz.attempt_id, answers: quiz.answers } }).then(function(r){
      if (!r.ok){ alert(r.data.detail || "Could not submit."); return; }
      quiz.result = r.data;
      render();
      if (r.data.passed) loadCerts();
    });
  }

  function renderQuiz(c){
    if (quiz.result) return renderResult(c);

    var answered = Object.keys(quiz.answers).length;
    var total = quiz.questions.length;
    var h = '<div class="crumb"><button data-act="quizback">&larr; ' + esc(cname(c)) + '</button></div>'
      + '<div class="lesson" style="--accent:' + c.accent + '">'
      + '<h2>' + c.icon + ' ' + esc(cname(c)) + '</h2>'
      + '<div class="qbar"><div class="track"><i style="width:' + Math.round(answered/total*100) + '%"></i></div>'
      + '<span class="n">' + answered + " / " + total + '</span></div>';

    quiz.questions.forEach(function(q, i){
      h += '<div class="qcard"><p class="qt">' + (i+1) + '. ' + esc(q.text) + '</p>';
      q.choices.forEach(function(ch){
        var sel = quiz.answers[q.id] === ch.id;
        h += '<button class="opt' + (sel ? " sel" : "") + '" data-q="' + q.id + '" data-ch="' + ch.id + '">'
          + '<span class="dot"></span><span>' + esc(ch.text) + '</span></button>';
      });
      h += '</div>';
    });

    return h + '<button class="primary" data-act="quizsubmit">' + esc(t("qSubmit")) + '</button></div>';
  }

  function renderResult(c){
    var r = quiz.result;
    var h = '<div class="crumb"><button data-act="quizback">&larr; ' + esc(cname(c)) + '</button></div>'
      + '<div class="lesson" style="--accent:' + c.accent + '">'
      + '<div class="result">'
      + '<div class="big">' + r.percent + '%</div>'
      + '<div class="verdict ' + (r.passed ? "pass" : "fail") + '">'
      + (r.passed ? esc(t("passed")) : esc(t("failed"))) + '</div>'
      + '<p class="sub2">' + r.score + " / " + r.total + " &middot; " + esc(t("passed")) + " " + r.pass_percent + '%</p>';

    if (r.passed && r.review_needed){
      h += reviewForm(r.review_course);
    } else if (r.passed && r.certificate_serial){
      h += certDone(r.certificate_serial);
    } else if (!r.passed && r.retry_in_minutes){
      h += '<p class="sub2">' + esc(t("retryIn").replace("%d", r.retry_in_minutes)) + '</p>';
    }
    h += '</div>';

    // The explanations are the point: this is where the learner finds out WHY,
    // not just what they scored.
    r.review.forEach(function(it, i){
      var q = quiz.questions.filter(function(x){ return x.id === it.question_id; })[0] || { choices: [] };
      function label(id){
        var ch = q.choices.filter(function(x){ return x.id === id; })[0];
        return ch ? ch.text : "-";
      }
      h += '<div class="rev"><p class="rq">' + (i+1) + '. ' + esc(it.text) + '</p>'
        + '<p class="ra ' + (it.was_correct ? "ok" : "no") + '"><b>' + esc(t("yourAns")) + ':</b> '
        + esc(label(it.your_choice_id)) + (it.was_correct ? " &check;" : "") + '</p>';
      if (!it.was_correct){
        h += '<p class="ra ok"><b>' + esc(t("corrAns")) + ':</b> ' + esc(label(it.correct_choice_id)) + '</p>';
      }
      if (it.explanation) h += '<p class="ex">' + esc(it.explanation) + '</p>';
      h += '</div>';
    });

    return h + '</div>';
  }

  document.getElementById("app").addEventListener("click", function(e){
    var o = e.target.closest("[data-q]");
    if (o && quiz && !quiz.result){
      quiz.answers[parseInt(o.getAttribute("data-q"),10)] = parseInt(o.getAttribute("data-ch"),10);
      render();
    }
    var cp = e.target.closest("[data-copy]");
    if (cp){
      var pre = document.getElementById(cp.getAttribute("data-copy"));
      if (pre && navigator.clipboard){
        navigator.clipboard.writeText(pre.textContent).then(function(){
          cp.textContent = t("copied"); cp.classList.add("ok");
          setTimeout(function(){ cp.textContent = t("copy"); cp.classList.remove("ok"); }, 1600);
        }).catch(function(){});
      }
    }
  });


  /* ================= remote course content ================= */

  var loadingCourse = null;
  var loadError = null;

  function ensureContent(c){
    // Already loaded, or ships with the page.
    if (!c.remote || c.lessons.length) return true;
    if (loadingCourse === c.id) return false;

    loadingCourse = c.id;
    loadError = null;

    fetch(c.remote, { credentials: "same-origin" })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
      .then(function(data){
        // The JSON is an object keyed by lesson slug. Order comes from the
        // day number in the key, not from object key order, which is not
        // guaranteed for numeric-looking keys in every engine.
        var keys = Object.keys(data).sort(function(a, b){
          return (parseInt(a.replace(/\D/g, ""), 10) || 0)
               - (parseInt(b.replace(/\D/g, ""), 10) || 0);
        });
        c.lessons = keys.map(function(k){
          // Was hardcoded to 30, so every remote course said 30 even
          // when its own entry said 25. Take the course's number.
          return { key: k, t: data[k].t,
                   m: c.knownMinutes || 25, b: data[k].b };
        });
        loadingCourse = null;
        render();
      })
      .catch(function(){
        loadingCourse = null;
        loadError = c.id;
        render();
      });
    return false;
  }

  function loadingView(c){
    if (loadError === c.id){
      return '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
        + '<div class="loadbox">' + esc(t("loadFail"))
        + '<br><button data-act="retry">' + esc(t("retry")) + '</button></div>';
    }
    return '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
      + '<div class="loadbox">' + esc(t("loadingC")) + '</div>';
  }


  var board = null;

  function loadBoard(){
    api("/academy/learners/").then(function(r){
      board = r.ok ? r.data : { top: [], me: null };
      if (view.page === "board") render();
    });
  }

  function renderBoard(){
    var h = '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
      + '<div class="head"><h3>' + esc(t("topL")) + '</h3></div>'
      + '<p class="lead" style="margin:-6px 2px 16px;font-size:13.5px;color:var(--ink-soft)">'
      + esc(t("byCerts")) + '</p>';

    if (!board) return h + '<div class="empty2">' + esc(t("loadingC")) + '</div>';
    if (!board.top.length) return h + '<div class="empty2">' + esc(t("noBoard")) + '</div>';

    h += '<div class="lb">';
    board.top.forEach(function(row){
      var mine = board.me && board.me.rank === row.rank;
      h += '<div class="lbrow' + (row.rank <= 3 ? " gold" : "") + (mine ? " me" : "") + '">'
        + '<span class="r">' + (row.rank === 1 ? "\u2605" : row.rank) + '</span>'
        + '<span class="n' + (row.anonymous ? " anon" : "") + '">' + esc(row.name) + '</span>'
        + '<span class="v"><b>' + row.certificates + '</b>'
        + '<small>' + esc(t("certsW")) + ' &middot; ' + row.lessons + '</small></span></div>';
    });
    h += '</div>';

    // Outside the top 50 you still want to know where you stand.
    if (board.me && !board.top.some(function(x){ return x.rank === board.me.rank; })){
      h += '<div class="head"><h3>' + esc(t("youAre")) + '</h3></div><div class="lb">'
        + '<div class="lbrow me"><span class="r">' + board.me.rank + '</span>'
        + '<span class="n">' + esc(board.me.name) + '</span>'
        + '<span class="v"><b>' + board.me.certificates + '</b>'
        + '<small>' + esc(t("certsW")) + ' &middot; ' + board.me.lessons + '</small></span></div></div>';
    }

    h += '<p class="tinynote">' + esc(t("privacyL")) + '</p>'
      + '<a class="ctacard" href="https://xpertcreation.com/typing">'
      + '<span class="e">&#9000;</span><span class="t"><b>' + esc(t("typingCta")) + '</b>'
      + '<small>' + esc(t("typingDesc")) + '</small></span>'
      + '<span class="go">' + esc(t("open")) + ' &rarr;</span></a>';
    return h;
  }

  function render(push){
    syncUrl(push);
    var app = document.getElementById("app");
    if (view.page === "home") app.innerHTML = renderHome();
    else if (view.page === "certs") app.innerHTML = renderCerts();
    else if (view.page === "badges") app.innerHTML = renderBadges();
    else if (view.page === "board") app.innerHTML = renderBoard();
    else if (view.page === "vqueue") app.innerHTML = renderVideoQueue();
    else if (!ensureContent(courseById(view.c))) app.innerHTML = loadingView(courseById(view.c));
    else if (view.page === "course") app.innerHTML = renderCourse(courseById(view.c));
    else if (view.page === "quiz") app.innerHTML = renderQuiz(courseById(view.c));
    else { app.innerHTML = renderLesson(courseById(view.c), view.l); if (window.XCLX) { try { XCLX.lesson(courseById(view.c), view.l, lessonFor(courseById(view.c), view.l).l, lang); } catch (e) { if (window.console) console.error(e); } } }
    // Tapping an answer re-renders; jumping to the top each time would make
    // the quiz unusable on a phone.
    if (!(view.page === "quiz" && quiz && !quiz.result)) window.scrollTo(0,0);
  }

  /* ---------- events (delegated, so re-render never breaks them) ---------- */

  document.getElementById("app").addEventListener("click", function(e){
    var cp = e.target.closest("[data-copy]");
    if (cp){
      var pre = document.getElementById(cp.getAttribute("data-copy"));
      if (pre && navigator.clipboard){
        navigator.clipboard.writeText(pre.textContent).then(function(){
          cp.textContent = t("copied");
          cp.classList.add("ok");
          setTimeout(function(){ cp.textContent = t("copy"); cp.classList.remove("ok"); }, 1600);
        }).catch(function(){});
      }
      return;
    }
    var card = e.target.closest("[data-course]");
    if (card && view.page === "home"){
      view = { page:"course", c:card.getAttribute("data-course"), l:0 };
      return render(true);
    }
    var nav = e.target.closest("[data-nav]");
    if (nav){
      view.page = nav.getAttribute("data-nav");
      if (view.page === "board" && !board) loadBoard();
      return render();
    }
    var sect = e.target.closest("[data-sect]");
    if (sect){
      var co0 = courseById(view.c);
      var k = co0.id + ":" + sect.getAttribute("data-sect");
      var el = sect.closest(".sect");
      openSections[k] = !el.classList.contains("open");
      return render();
    }

    // Works from the course page AND from the sidebar while reading, so you
    // can jump anywhere without going back a level.
    var li = e.target.closest("[data-lesson]");
    if (li && (view.page === "course" || view.page === "lesson")){
      view.page = "lesson";
      view.l = parseInt(li.getAttribute("data-lesson"), 10);
      return render(true);
    }
    var act = e.target.closest("[data-act]");
    if (act){
      var a = act.getAttribute("data-act");
      // Ye dono sirf lesson wale safe par kaam ke hain. Pehle ye upar
      // chalti thin, aur homepage par co undefined hone se lkey() error
      // de deta tha — us se sign in ka button bhi mar jata tha.
      if (a === "signin"){ return openAuth("signin"); }
      if (a === "register"){ return openAuth("register"); }
      if (a === "signout"){ return doSignOut(); }
      if (a === "retry"){ loadError = null; return render(); }
      if (a === "quiz"){ return startQuiz(view.c); }
      if (a === "quizsubmit"){ return submitQuiz(); }
      if (a === "quizback"){ quiz = null; view.page = "course"; return render(); }
      var co = courseById(view.c);
      var key = lkey(co, view.l);
      if (a === "toggle"){
        var now = !done[key];
        if (now) done[key] = true; else delete done[key];
