<style>
:root{
  --ink:#0D1424; --ink-soft:#5A657C; --paper:#F6F7FB; --card:#FFFFFF;
  --brand:#1B4DFF; --go:#00B37E; --amber:#B45309; --line:#E4E8F2;
  --accent:#1B4DFF;
  --shadow:0 2px 4px rgba(13,20,36,.04), 0 12px 28px rgba(13,20,36,.07);
  --display:"Bricolage Grotesque",system-ui,sans-serif;
  --body:"Plus Jakarta Sans",system-ui,sans-serif;
  --mono:"Space Mono",ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{font-family:var(--body);background:var(--paper);color:var(--ink);line-height:1.6;overflow-x:hidden}
button{font:inherit;color:inherit;border:none;background:none;cursor:pointer}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--brand);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding-bottom:40px}
@media(min-width:900px){.wrap{max-width:760px}}

.topbar{position:sticky;top:0;z-index:60;display:flex;align-items:center;gap:10px;padding:12px 16px;
  background:rgba(246,247,251,.88);backdrop-filter:saturate(180%) blur(14px);
  -webkit-backdrop-filter:saturate(180%) blur(14px);border-bottom:1px solid var(--line)}
.logo{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.03em;display:flex;align-items:center;gap:7px}
.logo img{height:24px;width:auto;max-width:120px;border-radius:6px;display:block}
.logo .mark{width:25px;height:25px;border-radius:8px;background:var(--go);display:grid;place-items:center;color:#fff;font-size:13px}
.logo .mark.hide{display:none}
.spacer{flex:1}
/* brand chip — the mark sits on its own dark plate, matching the artwork */
.logo .chip{
  width:29px;height:29px;border-radius:9px;display:block;flex:0 0 auto;
  background:#14151A;object-fit:cover;
  box-shadow:0 2px 6px rgba(13,20,36,.18);
}
.logo .chip.gone{display:none}
#langSel{-webkit-appearance:none;appearance:none;padding:7px 26px 7px 11px;border-radius:999px;
  background:var(--card) url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='%235A657C' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 10px center;
  border:1px solid var(--line);font-size:13px;font-weight:600;max-width:126px;text-overflow:ellipsis}

.hero{padding:30px 18px 20px}
.hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--go);margin-bottom:12px}
.hero h1{font-family:var(--display);font-weight:800;font-size:clamp(27px,7.6vw,42px);line-height:1.04;letter-spacing:-.035em;max-width:16ch}
.hero p{margin-top:12px;font-size:14.5px;color:var(--ink-soft);max-width:40ch;font-weight:500}

.note{margin:0 18px 16px;padding:11px 14px;border-radius:12px;background:rgba(27,77,255,.06);
  border:1px dashed var(--brand);font-size:12.5px;color:var(--ink-soft);line-height:1.5}

.sec{padding:0 16px}
.ccard{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:17px;
  margin-bottom:12px;box-shadow:var(--shadow);position:relative;overflow:hidden;cursor:pointer;transition:transform .16s}
.ccard:active{transform:scale(.99)}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--a)}
.ccard .row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
.ccard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;
  background:var(--a);color:#fff;flex:0 0 auto}
.ccard .nm{font-family:var(--display);font-weight:800;font-size:17.5px;letter-spacing:-.025em}
.ccard .meta{font-size:11.5px;color:var(--ink-soft);font-weight:600;font-family:var(--mono)}
.ccard p{font-size:13.5px;color:var(--ink-soft);line-height:1.55}
.bar{height:6px;border-radius:99px;background:var(--paper);margin-top:12px;overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--a);width:0;transition:width .4s}
.pct{font-size:11px;color:var(--ink-soft);font-weight:600;margin-top:5px;display:block}
.ccard .go{display:inline-flex;align-items:center;gap:6px;margin-top:12px;padding:10px 18px;
  border-radius:12px;background:var(--ink);color:#fff;font-size:13.5px;font-weight:700}

.crumb{display:flex;align-items:center;gap:8px;padding:14px 16px 6px}
.crumb button{font-size:13px;font-weight:700;color:var(--brand);display:flex;align-items:center;gap:5px}
.chead{padding:4px 16px 14px}
.chead h2{font-family:var(--display);font-weight:800;font-size:23px;letter-spacing:-.03em}
.chead .meta{font-size:12px;color:var(--ink-soft);font-family:var(--mono);margin-top:3px}

.llist{padding:0 16px}
.litem{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:15px;padding:13px;margin-bottom:8px;cursor:pointer;transition:transform .14s}
.litem:active{transform:scale(.99)}
.litem .n{width:30px;height:30px;border-radius:10px;background:var(--paper);border:1px solid var(--line);
  display:grid;place-items:center;font-size:12.5px;font-weight:700;font-family:var(--mono);flex:0 0 auto}
.litem.ok .n{background:var(--go);border-color:var(--go);color:#fff}
.litem .t{flex:1;min-width:0}
.litem .t b{font-size:14px;font-weight:700;display:block;letter-spacing:-.01em;line-height:1.35}
.litem .t small{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono)}
.litem .ar{color:var(--ink-soft);font-size:15px}

.lesson{padding:0 18px}
.lesson h2{font-family:var(--display);font-weight:800;font-size:24px;letter-spacing:-.032em;line-height:1.12}
.lesson .meta{font-size:12px;color:var(--ink-soft);font-family:var(--mono);margin:5px 0 18px}
.lesson p{font-size:15px;margin-bottom:15px;line-height:1.65}
.lesson ol{margin:0 0 16px 0;padding:0;counter-reset:s;list-style:none}
.lesson ol li{position:relative;padding-left:30px;margin-bottom:9px;font-size:14.5px;line-height:1.6}
.lesson ol li::before{counter-increment:s;content:counter(s);position:absolute;left:0;top:2px;
  width:21px;height:21px;border-radius:7px;background:var(--accent);color:#fff;
  font-size:11px;font-weight:700;display:grid;place-items:center;font-family:var(--mono)}
.box{border-radius:13px;padding:13px 15px;margin-bottom:16px;font-size:14px;line-height:1.6}
.box b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:5px;font-family:var(--mono)}
.box.tip{background:rgba(0,179,126,.08);border:1px solid rgba(0,179,126,.3)}
.box.tip b{color:#00875F}
.box.warn{background:rgba(180,83,9,.07);border:1px solid rgba(180,83,9,.28)}
.box.warn b{color:var(--amber)}
.keys{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:13px 15px;margin-bottom:16px}
.keys b{display:block;font-size:11px;letter-spacing:.09em;text-transform:uppercase;margin-bottom:9px;
  font-family:var(--mono);color:var(--ink-soft)}
.keys .kr{display:flex;justify-content:space-between;gap:12px;font-size:13.5px;padding:5px 0;border-bottom:1px solid var(--line)}
.keys .kr:last-child{border-bottom:none}
.keys kbd{font-family:var(--mono);font-size:12px;background:var(--paper);border:1px solid var(--line);
  border-radius:6px;padding:2px 7px;white-space:nowrap;direction:ltr;display:inline-block}

.foot{display:flex;gap:9px;flex-wrap:wrap;margin:24px 0 8px;padding-top:18px;border-top:1px solid var(--line)}
.foot button{padding:13px 20px;border-radius:13px;font-size:14px;font-weight:700}
.foot .mark{background:var(--go);color:#fff;flex:1;min-width:150px}
.foot .mark.on{background:var(--paper);color:var(--go);border:1.5px solid var(--go)}
.foot .nxt{background:var(--ink);color:#fff;flex:1;min-width:130px}


/* spreadsheet grid */
.sheet{margin-bottom:17px;direction:ltr}
.sheet .cap{font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-family:var(--mono);
  color:var(--ink-soft);margin-bottom:7px}
.sheet .scroll{overflow-x:auto;border:1px solid #C6CBD8;border-radius:10px;background:#fff;
  -webkit-overflow-scrolling:touch}
.sheet table{border-collapse:collapse;font-size:13px;min-width:100%;font-family:var(--body)}
.sheet th,.sheet td{border:1px solid #DDE1EA;padding:7px 11px;text-align:left;white-space:nowrap}
.sheet .colh,.sheet .rowh{background:#EEF1F6;color:var(--ink-soft);font-weight:600;
  font-family:var(--mono);font-size:11px;text-align:center;padding:5px 9px}
.sheet .rowh{position:sticky;left:0;z-index:1}
.sheet .hdr td{background:#F4F6FA;font-weight:700}
.sheet .fx{font-family:var(--mono);font-size:12px;color:#0F766E;background:#F0FDF9}
.sheet .num{text-align:right;font-family:var(--mono);font-size:12.5px}

/* code block */
.code{margin-bottom:17px;direction:ltr}
.code .bar{display:flex;align-items:center;gap:8px;margin-bottom:0;
  background:#131C2E;border-radius:10px 10px 0 0;padding:8px 13px}
.code .bar b{font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;
  font-family:var(--mono);color:#8FA0BF;font-weight:600}
.code .bar button{margin-left:auto;font-size:11px;font-family:var(--mono);color:#8FA0BF;
  border:1px solid #2C3A54;border-radius:6px;padding:3px 9px}
.code .bar button.ok{color:#4ADE80;border-color:#166534}
.code pre{margin:0;background:#0B1220;color:#E6EDF7;border-radius:0 0 10px 10px;
  padding:14px;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.65;
  -webkit-overflow-scrolling:touch}
.code .cm{color:#7A8CA8;font-style:italic}
.code .kw{color:#7DD3FC}
.code .st{color:#FCA5A5}
body.rtl .sheet,body.rtl .code{direction:ltr}

body.rtl{direction:rtl}
body.rtl .lesson ol li{padding-left:0;padding-right:30px}
body.rtl .lesson ol li::before{left:auto;right:0}
body.f-ur{font-family:"Noto Nastaliq Urdu",var(--body);line-height:2.15}
body.f-ur h1,body.f-ur h2,body.f-ur .nm{font-family:"Noto Nastaliq Urdu",var(--display);line-height:1.8;letter-spacing:0}
body.f-ur h1{font-size:clamp(21px,5.8vw,30px)}
body.f-ur .go,body.f-ur .foot button{line-height:1.9;padding-top:.75em;padding-bottom:.75em}
body.f-ar{font-family:"Noto Naskh Arabic",var(--body);line-height:1.9}
body.f-ar h1,body.f-ar h2,body.f-ar .nm{font-family:"Noto Naskh Arabic",var(--display);letter-spacing:0;line-height:1.55}
body.f-hi{font-family:"Noto Sans Devanagari",var(--body)}
body.f-bn{font-family:"Noto Sans Bengali",var(--body)}
body.f-zh h1,body.f-zh h2{letter-spacing:0}
body.f-long h1{font-size:clamp(24px,6.6vw,36px)}
.mono-ltr{font-family:var(--mono);direction:ltr;display:inline-block}
@media(prefers-reduced-motion:reduce){*{transition-duration:.01ms!important}}


/* =====================================================================
   Everything below was written for the course layout, the auth sheet, the
   quiz and the Quranic blocks. It is appended rather than woven in so a
   missing anchor can never silently drop it again.
   ===================================================================== */

/* ---------- account button ---------- */
.acct{display:flex;align-items:center;gap:6px;padding:8px 14px;border-radius:999px;
  background:var(--ink);color:#fff;font-size:12.5px;font-weight:700;white-space:nowrap;
  max-width:150px;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.acct.out{background:var(--card);color:var(--ink);border:1px solid var(--line)}
/* Button mein ab tasveer bhi hai. Naam lamba ho to kat jaye, warna
   chhoti screen par button poori chaurai kha leta hai. */
.acct img,.acct .ini{width:26px;height:26px;border-radius:50%;object-fit:cover;
  flex:0 0 auto;display:grid;place-items:center;background:var(--paper);
  color:var(--ink);font-weight:800;font-size:12px}
.acct .nm2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px}

/* ---------- auth sheet ---------- */
.scrim{position:fixed;inset:0;z-index:90;background:rgba(13,20,36,.55);
  backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:95;max-width:520px;margin:0 auto;
  background:var(--paper);border-radius:24px 24px 0 0;
  padding:8px 20px calc(24px + env(safe-area-inset-bottom));
  max-height:92vh;overflow-y:auto;transform:translateY(103%);
  transition:transform .32s cubic-bezier(.32,.72,0,1);box-shadow:0 -8px 40px rgba(13,20,36,.2)}
.sheet.on{transform:translateY(0)}
.grab{width:38px;height:4px;border-radius:99px;background:var(--line);margin:6px auto 16px}
.sheet h3{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.03em;margin-bottom:5px}
.sheet .sub{font-size:13px;color:var(--ink-soft);margin-bottom:18px;line-height:1.5}
.fld{margin-bottom:13px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);
  letter-spacing:.03em;margin-bottom:5px;text-transform:uppercase}
.fld input{width:100%;padding:13px 14px;border:1.5px solid var(--line);border-radius:13px;
  background:var(--card);font-size:15px;outline:none;transition:border-color .18s;font-family:inherit}
.fld input:focus{border-color:var(--brand)}
.fld .note{font-size:11.5px;color:var(--ink-soft);margin-top:5px;line-height:1.45}
.fld.code input{font-family:var(--mono);font-size:24px;letter-spacing:.35em;text-align:center;direction:ltr}
.primary{width:100%;padding:15px;border-radius:14px;background:var(--brand);color:#fff;
  font-weight:700;font-size:15px;margin-top:6px;transition:opacity .2s}
.primary:disabled{opacity:.4}
.linkrow{display:flex;justify-content:space-between;align-items:center;gap:10px;
  margin-top:15px;font-size:13px;flex-wrap:wrap}
.linkrow button{color:var(--brand);font-weight:700}
.linkrow span{color:var(--ink-soft)}
.msg{padding:11px 13px;border-radius:11px;font-size:13px;line-height:1.5;
  margin-bottom:13px;display:none}
.msg.on{display:block}
.msg.err{background:rgba(180,83,9,.09);border:1px solid rgba(180,83,9,.3);color:#92400E}
.msg.ok{background:rgba(0,179,126,.09);border:1px solid rgba(0,179,126,.32);color:#00734F}

/* ---------- course landing ---------- */
.chero{background:var(--card);border:1px solid var(--line);border-radius:22px;
  padding:22px 20px;margin-bottom:22px;position:relative;overflow:hidden;box-shadow:var(--shadow)}
.chero::before{content:"";position:absolute;inset:0 0 auto 0;height:5px;background:var(--accent)}
.chero .ic{width:56px;height:56px;border-radius:17px;background:var(--accent);color:#fff;
  display:grid;place-items:center;font-size:27px;margin-bottom:14px}
.chero h2{font-family:var(--display);font-weight:800;font-size:clamp(23px,6.2vw,31px);
  letter-spacing:-.033em;line-height:1.1}
.chero .blurb{font-size:14.5px;color:var(--ink-soft);margin-top:10px;line-height:1.6;max-width:54ch}
.chero .facts{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}
.chero .facts span{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);
  background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:5px 11px}
.chero .cta{display:inline-flex;align-items:center;gap:8px;margin-top:18px;padding:14px 26px;
  border-radius:14px;background:var(--ink);color:#fff;font-weight:700;font-size:15px;cursor:pointer}
.pwrap{margin-top:16px}
.pwrap .track{height:8px;border-radius:99px;background:var(--paper);
  border:1px solid var(--line);overflow:hidden}
.pwrap .track i{display:block;height:100%;background:var(--accent);transition:width .4s}
.pwrap .lbl{font-size:11.5px;color:var(--ink-soft);font-weight:600;margin-top:7px;display:block}

/* ---------- curriculum: sections of lesson cards ---------- */
.sect{margin-bottom:14px}
.sect .sh{display:flex;align-items:center;gap:10px;padding:12px 15px;cursor:pointer;
  background:var(--card);border:1px solid var(--line);border-radius:14px;
  transition:border-color .18s}
.sect.open .sh{border-radius:14px 14px 0 0;border-bottom-color:transparent}
.sect .sh .cv{font-size:11px;color:var(--ink-soft);transition:transform .2s;flex:0 0 auto}
.sect.open .sh .cv{transform:rotate(90deg)}
.sect .sh b{flex:1;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.sect .sh small{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);white-space:nowrap}
.sect .sb{display:none}
.sect.open .sb{display:grid;gap:8px;padding:10px;background:var(--card);
  border:1px solid var(--line);border-top:none;border-radius:0 0 14px 14px}
@media(min-width:680px){ .sect.open .sb{grid-template-columns:1fr 1fr} }

/* Each lesson is a card, not a row: easier to hit on a phone and it reads
   like a course rather than a file listing. */
.lrow{display:flex;align-items:center;gap:11px;padding:13px 14px;cursor:pointer;
  background:var(--paper);border:1.5px solid var(--line);border-radius:13px;
  transition:transform .14s,border-color .18s,background .18s}
.lrow:active{transform:scale(.985)}
.lrow:hover{border-color:var(--accent)}
.lrow.now{border-color:var(--accent);background:var(--card)}
.lrow.ok{background:rgba(0,179,126,.05);border-color:rgba(0,179,126,.35)}
.lrow .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);
  flex:0 0 auto;display:grid;place-items:center;font-size:12px;color:transparent;
  background:var(--card);font-weight:700}
.lrow.ok .tick{background:var(--go);border-color:var(--go);color:#fff}
.lrow .t{flex:1;min-width:0;font-size:14px;line-height:1.4;font-weight:500}
.lrow.now .t{font-weight:700}
.lrow small{font-size:11px;color:var(--ink-soft);font-family:var(--mono);white-space:nowrap}

/* ---------- learning view ---------- */
.learn{display:block}
@media(min-width:980px){
  .wrap{max-width:1180px}
  .learn{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:26px;align-items:start}
  .learn .side{position:sticky;top:74px;max-height:calc(100vh - 96px);overflow-y:auto;
    background:var(--card);border:1px solid var(--line);border-radius:18px;padding:14px}
  .learn .side h4{font-size:11px;letter-spacing:.09em;text-transform:uppercase;
    color:var(--ink-soft);font-family:var(--mono);margin-bottom:11px;padding:0 2px}
  .learn .side .sect{margin-bottom:7px}
  .learn .side .sh{padding:10px 11px;border-radius:11px}
  .learn .side .sect.open .sb{grid-template-columns:1fr;padding:7px;gap:6px}
  .learn .side .lrow{padding:9px 11px;border-radius:10px}
  .learn .side .lrow .t{font-size:12.5px}
  .learn .side .lrow .tick{width:21px;height:21px;font-size:10px}
}
@media(max-width:979px){ .learn .side{display:none} }

.navrow{display:flex;gap:9px;margin-top:24px;padding-top:18px;border-top:1px solid var(--line);flex-wrap:wrap}
.navrow button{flex:1;min-width:110px;padding:13px;border-radius:13px;font-size:14px;
  font-weight:700;background:var(--card);border:1px solid var(--line);cursor:pointer}
.navrow button.main{background:var(--ink);color:#fff;border-color:var(--ink)}
.navrow button.done{background:var(--go);color:#fff;border-color:var(--go)}
.navrow button:disabled{opacity:.35;cursor:not-allowed}

/* ---------- quiz ---------- */
.qbar{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.qbar .track{flex:1;height:7px;border-radius:99px;background:var(--card);
  border:1px solid var(--line);overflow:hidden}
.qbar .track i{display:block;height:100%;background:var(--accent);transition:width .3s}
.qbar .n{font-size:11.5px;font-family:var(--mono);color:var(--ink-soft);white-space:nowrap}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:17px;margin-bottom:12px}
.qcard .qt{font-size:15.5px;font-weight:600;line-height:1.5;margin-bottom:13px}
.opt{display:flex;align-items:flex-start;gap:10px;padding:12px 14px;border-radius:13px;
  border:1.5px solid var(--line);background:var(--paper);margin-bottom:8px;cursor:pointer;
  transition:all .15s;font-size:14.5px;line-height:1.45;text-align:left;width:100%}
.opt:active{transform:scale(.99)}
.opt.sel{border-color:var(--brand);background:rgba(27,77,255,.06)}
.opt .dot{width:19px;height:19px;border-radius:50%;border:2px solid var(--line);
  flex:0 0 auto;margin-top:1px;display:grid;place-items:center}
.opt.sel .dot{border-color:var(--brand);background:var(--brand)}
.opt.sel .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.result{background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:24px;text-align:center;margin-bottom:16px}
.result .big{font-family:var(--display);font-weight:800;font-size:46px;
  letter-spacing:-.04em;line-height:1}
.result .verdict{font-size:15px;font-weight:700;margin-top:6px}
.result .verdict.pass{color:#00734F}
.result .verdict.fail{color:#92400E}
.result .sub2{font-size:13px;color:var(--ink-soft);margin-top:6px;line-height:1.5}
.result .cta{display:inline-block;margin-top:16px;padding:13px 24px;border-radius:13px;
  background:var(--go);color:#fff;font-weight:700;font-size:14.5px;text-decoration:none}
.rev{background:var(--card);border:1px solid var(--line);border-radius:15px;
  padding:14px;margin-bottom:9px}
.rev .rq{font-size:14px;font-weight:600;line-height:1.45;margin-bottom:8px}
.rev .ra{font-size:13px;line-height:1.5;margin-bottom:4px}
.rev .ra.ok{color:#00734F}
.rev .ra.no{color:#92400E}
.rev .ex{font-size:12.5px;color:var(--ink-soft);line-height:1.55;margin-top:8px;
  padding-top:8px;border-top:1px solid var(--line)}
.lockmsg{background:rgba(180,83,9,.07);border:1px dashed rgba(180,83,9,.35);
  border-radius:13px;padding:13px 15px;font-size:13.5px;color:#92400E;
  line-height:1.5;margin-bottom:12px}

/* ---------- certificates ---------- */
.certcard{background:var(--card);border:1px solid var(--line);border-radius:18px;
  padding:16px;margin-bottom:11px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow)}
.certcard .seal{width:46px;height:46px;border-radius:13px;background:#B8892D;color:#fff;
  display:grid;place-items:center;font-size:22px;flex:0 0 auto}
.certcard .t{flex:1;min-width:0}
.certcard .t b{display:block;font-size:14.5px;font-weight:700;letter-spacing:-.01em}
.certcard .t small{display:block;font-size:11.5px;color:var(--ink-soft);
  font-family:var(--mono);margin-top:2px}
.certcard .open{padding:9px 15px;border-radius:11px;background:var(--ink);color:#fff;
  font-size:12.5px;font-weight:700;text-decoration:none;white-space:nowrap}
.empty2{background:var(--card);border:1px dashed var(--line);border-radius:16px;
  padding:22px;text-align:center;color:var(--ink-soft);font-size:13.5px;line-height:1.55}

/* ---------- Quranic blocks ---------- */
.lesson .h2{font-family:var(--display);font-weight:800;font-size:19px;letter-spacing:-.02em;
  margin:28px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
.lesson .h2:first-child{margin-top:0}
.lesson ul.bl{margin:0 0 16px;padding:0;list-style:none}
.lesson ul.bl li{position:relative;padding-left:18px;margin-bottom:8px;font-size:15px;line-height:1.7}
/* the word being taught, and its meaning */
.lesson ul.bl li .tgt{font-weight:800;font-size:1.12em;letter-spacing:-.01em}
.lesson ul.bl li .mean{opacity:.72;font-size:.95em}
.lesson ul.bl li .mean::before{content:" \2014 ";opacity:.45}
@media(max-width:520px){
  /* on a phone the two halves wrap anyway, so give them their own lines */
  .lesson ul.bl li .tgt{display:block}
  .lesson ul.bl li .mean{display:block;margin-top:1px}
  .lesson ul.bl li .mean::before{content:none}
}
.lesson ul.bl li::before{content:"";position:absolute;left:4px;top:.75em;width:5px;height:5px;
  border-radius:50%;background:var(--accent)}
body.rtl .lesson ul.bl li{padding-left:0;padding-right:18px}
body.rtl .lesson ul.bl li::before{left:auto;right:4px}

/* An ayah must never be mistaken for commentary: bigger, naskh, its own frame,
   with the translation visibly subordinate underneath it. */
.ayah{direction:rtl;text-align:center;margin:22px 0 0;padding:22px 20px;
  background:linear-gradient(180deg,rgba(184,137,45,.07),rgba(184,137,45,.02));
  border:1px solid rgba(184,137,45,.38);border-radius:16px 16px 0 0;
  font-family:"Noto Naskh Arabic","Amiri",serif;font-size:23px;line-height:2.2;color:#1a1a1a}
.trans{direction:rtl;text-align:center;margin:0 0 22px;padding:13px 20px;
  background:var(--card);border:1px solid rgba(184,137,45,.3);border-top:none;
  border-radius:0 0 16px 16px;font-size:14px;line-height:1.8;color:var(--ink-soft)}
@media(max-width:600px){ .ayah{font-size:20px;line-height:2;padding:18px 14px} }

.loadbox{text-align:center;padding:48px 20px;color:var(--ink-soft);font-size:14px}
.loadbox button{margin-top:14px;padding:11px 20px;border-radius:12px;background:var(--ink);
  color:#fff;font-weight:700;font-size:13.5px;cursor:pointer}


.fld .pw{position:relative}
.fld .pw input{padding-right:46px}
.fld .pw .eye{position:absolute;top:50%;right:5px;transform:translateY(-50%);
  width:36px;height:36px;border-radius:10px;display:grid;place-items:center;
  color:var(--ink-soft);cursor:pointer;transition:color .15s,background .15s}
.fld .pw .eye:hover{background:var(--paper);color:var(--ink)}
.fld .pw .eye svg{width:20px;height:20px;fill:none;stroke:currentColor;
  stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}

/* =====================================================================
   Front page
   ===================================================================== */

/* The backdrop is a fixed layer, so content slides over it as you scroll.
   background-attachment:fixed is avoided on purpose - iOS Safari ignores it
   and Android repaints the whole page on every scroll frame. */
.bg{position:fixed;inset:0;z-index:-2;pointer-events:none;overflow:hidden;background:var(--paper)}
.bg .blob{position:absolute;border-radius:50%;filter:blur(90px);opacity:.34}
.bg .b1{width:520px;height:520px;background:#1B4DFF;top:-190px;left:-140px}
.bg .b2{width:460px;height:460px;background:#00B37E;top:6%;right:-180px;opacity:.24}
.bg .b3{width:420px;height:420px;background:#B8892D;top:52%;left:-150px;opacity:.20}
.bg .b4{width:480px;height:480px;background:#B7472A;bottom:-200px;right:-140px;opacity:.18}
.bg .grid{position:absolute;inset:0;
  background-image:linear-gradient(rgba(13,20,36,.045) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(13,20,36,.045) 1px,transparent 1px);
  background-size:46px 46px;
  -webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 35%,transparent 78%);
  mask-image:radial-gradient(ellipse 80% 55% at 50% 0%,#000 35%,transparent 78%)}
body{background:transparent}

/* ---------- hero ---------- */
.hero{padding:26px 4px 20px;text-align:center;position:relative}

/* Welcome ka khana. Account ka button header se nikal diya: chhoti screen
   par wo naam kaat deta tha. Yahan poora naam, tareekh, waqt aur ek
   quote — jagah bhi hai aur kaam ki cheez bhi. */
/* Panel kinaron se chipka hua tha. Baqi safe jitna hi faasla. */
#acWelcome{margin:14px 16px 4px}
@media(min-width:900px){ #acWelcome{margin-left:0;margin-right:0} }
/* Safed tha aur baqi cards jaisa hi lagta tha. Sunehra rang isay alag
   kar deta hai, aur certificates wale andaz se bhi meil khata hai. */
.acw{display:flex;align-items:center;gap:13px;padding:16px 17px;
  background:linear-gradient(140deg,#2B2113,#4A3717 55%,#6B5122);
  border:1px solid rgba(214,178,94,.42);border-radius:20px;color:#F6EEDD;
  box-shadow:0 3px 8px rgba(43,33,19,.18),0 16px 38px rgba(43,33,19,.22)}
.acw .greet2{color:rgba(246,238,221,.72)}
.acw .nm3{color:#FBF3E2}
.acw .dt{color:rgba(246,238,221,.62)}
.acw img,.acw .ini2{border-color:rgba(214,178,94,.5);
  background:rgba(214,178,94,.2);color:#F6EEDD}
.acw .out2{background:rgba(246,238,221,.12);
  border-color:rgba(214,178,94,.35);color:#F0E3C8}
.acw .out2:hover{background:rgba(246,238,221,.2);color:#FFF6E4;
  border-color:rgba(214,178,94,.6)}
.acq{border-color:rgba(214,178,94,.4);background:rgba(214,178,94,.08)}
.acq b{color:#7A5D22}

#acFooter{padding:22px 4px calc(28px + env(safe-area-inset-bottom));
  border-top:1px solid var(--line);margin-top:20px}
#acFooter .links{display:flex;gap:15px;flex-wrap:wrap;font-size:12.5px;
  color:var(--ink-soft);font-weight:600}
#acFooter .links a{color:var(--ink-soft);text-decoration:none}
#acFooter .links a:hover{color:var(--ink)}
#acFooter .cr{font-size:11.5px;color:var(--ink-soft);margin-top:11px;
  line-height:1.6}
.acw a.pic{flex:0 0 auto;line-height:0;border-radius:16px;display:block}
.acw img,.acw .ini2{width:52px;height:52px;border-radius:16px;object-fit:cover;
  display:grid;place-items:center;background:var(--ink);color:#fff;
  font-family:var(--display);font-weight:800;font-size:21px;
  border:2px solid var(--line)}
.acw .t2{flex:1;min-width:0}
.acw .greet2{font-size:12px;color:var(--ink-soft);font-weight:600}
.acw .nm3{font-family:var(--display);font-weight:800;font-size:19px;
  letter-spacing:-.028em;line-height:1.2;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.acw .dt{font-size:12px;color:var(--ink-soft);margin-top:2px;
  font-variant-numeric:tabular-nums}
.acw .out2{margin-left:auto;flex:0 0 auto;padding:8px 13px;border-radius:11px;
  background:var(--paper);border:1px solid var(--line);font-size:12px;
  font-weight:700;color:var(--ink-soft);cursor:pointer;white-space:nowrap}
.acw .out2:hover{color:var(--ink);border-color:var(--ink-soft)}
/* Panel ke neeche chhote links — pehle ye do bari qatarein thin jo
   poori chaurai leti thin aur courses ko neeche dhakel deti thin. */
.acLinks{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.acl{padding:8px 13px;border-radius:11px;font-size:12.5px;font-weight:700;
  border:1px solid var(--line);background:rgba(255,255,255,.72);
  color:var(--ink);cursor:pointer;text-decoration:none;
  display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.acl:hover{border-color:var(--go);color:var(--go)}
.acl b{font-weight:800;color:var(--go)}
@media(max-width:420px){ .acl{padding:7px 10px;font-size:11.5px} }

.acq{margin-top:9px;padding:12px 16px;border-radius:16px;
  background:rgba(255,255,255,.6);border:1px dashed var(--line);
  font-size:13px;color:var(--ink-soft);line-height:1.55}
.acq b{color:var(--ink);font-weight:700}
@media(max-width:420px){
  .acw{padding:13px 14px;gap:11px}
  .acw img,.acw .ini2{width:46px;height:46px;font-size:19px}
  .acw .nm3{font-size:17px}
  .acw .out2{padding:7px 10px;font-size:11.5px}
}
.hero .eyebrow{display:inline-block;font-family:var(--mono);font-size:11px;
  letter-spacing:.11em;text-transform:uppercase;color:var(--brand);
  background:rgba(255,255,255,.72);border:1px solid rgba(27,77,255,.22);
  border-radius:999px;padding:7px 15px;margin-bottom:20px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hero h1{font-family:var(--display);font-weight:800;
  font-size:clamp(31px,8.4vw,54px);line-height:1.03;letter-spacing:-.04em;
  max-width:15ch;margin:0 auto}
.hero h1 em{font-style:normal;
  background:linear-gradient(100deg,var(--brand),#00B37E 60%,#B8892D);
  -webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:16px auto 0;font-size:15.5px;color:var(--ink-soft);
  max-width:44ch;line-height:1.62;font-weight:500}
.hero .acts{display:flex;gap:10px;justify-content:center;margin-top:26px;flex-wrap:wrap}
.hero .go1{padding:15px 30px;border-radius:999px;background:var(--ink);color:#fff;
  font-weight:700;font-size:15px;cursor:pointer;
  box-shadow:0 10px 30px rgba(13,20,36,.22);transition:transform .16s}
.hero .go1:active{transform:scale(.97)}
.hero .go2{padding:15px 26px;border-radius:999px;background:rgba(255,255,255,.8);
  border:1px solid var(--line);font-weight:700;font-size:15px;cursor:pointer;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}

/* ---------- stats ---------- */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:32px 0 8px}
.stat{background:rgba(255,255,255,.78);border:1px solid var(--line);border-radius:16px;
  padding:15px 8px;text-align:center;
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat b{display:block;font-family:var(--display);font-weight:800;font-size:24px;
  letter-spacing:-.035em;line-height:1}
.stat span{display:block;font-size:10.5px;color:var(--ink-soft);font-weight:600;
  margin-top:5px;letter-spacing:.02em}
@media(max-width:420px){ .stat b{font-size:20px} .stat span{font-size:9.5px} }

/* ---------- course cards ---------- */
.ccard{position:relative;background:rgba(255,255,255,.86);border:1px solid var(--line);
  border-radius:20px;padding:14px;margin-bottom:9px;overflow:hidden;cursor:pointer;
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  box-shadow:0 2px 4px rgba(13,20,36,.03),0 14px 34px rgba(13,20,36,.07);
  transition:transform .18s,box-shadow .18s}
.ccard:hover{transform:translateY(-2px);box-shadow:0 6px 12px rgba(13,20,36,.06),0 22px 48px rgba(13,20,36,.11)}
.ccard:active{transform:scale(.995)}
.ccard::before{content:"";position:absolute;inset:0 0 auto 0;height:4px;background:var(--a)}
.ccard .row{display:flex;align-items:center;gap:12px;margin-bottom:7px}
.ccard .ic{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;
  font-size:25px;background:var(--a);color:#fff;flex:0 0 auto;
  box-shadow:0 6px 16px color-mix(in srgb,var(--a) 35%,transparent)}
.ccard .nm{font-family:var(--display);font-weight:800;font-size:18px;letter-spacing:-.028em}
.ccard .meta{font-size:11.5px;color:var(--ink-soft);font-family:var(--mono);margin-top:3px}
.ccard p{font-size:13.5px;color:var(--ink-soft);line-height:1.5}
.ccard .foot{display:flex;align-items:center;gap:10px;margin-top:6px}

/* A word you can hear. Kept quiet until pointed at, so a lesson full of
   Korean does not turn into a wall of speaker icons. */
/* The code runner. Dark box, because every editor a learner will meet
   later is dark and the switch is jarring otherwise. */
/* Courses in a grid. Four across on a wide screen, two on a phone -
   never one, because a single column is what made this page so long. */
.ghead{display:flex;align-items:baseline;gap:9px;margin:24px 0 11px}
.ghead h3{font-size:15px;font-weight:800;letter-spacing:-.02em}
.ghead .gn{font-size:11.5px;font-weight:700;color:var(--ink-soft);
  background:var(--card);border:1px solid var(--line);border-radius:20px;
  padding:1px 9px}
.cgrid{display:grid;gap:11px;
  grid-template-columns:repeat(auto-fill,minmax(168px,1fr))}
.cgrid .ccard{position:relative;background:var(--card);
  border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px;
  cursor:pointer;transition:transform .13s,box-shadow .13s,border-color .13s;
  display:flex;flex-direction:column;gap:5px;overflow:hidden}
.cgrid .ccard::before{content:"";position:absolute;inset:0 auto 0 0;width:3px;
  background:var(--a);opacity:.85}
.cgrid .ccard:hover{transform:translateY(-2px);border-color:var(--a);
  box-shadow:0 8px 22px rgba(13,20,36,.10)}
.cgrid .ccard .ic{font-size:26px;line-height:1.1}
.cgrid .ccard .nm{font-weight:700;font-size:14px;line-height:1.3;
  letter-spacing:-.01em}
.cgrid .ccard .meta{font-size:11.5px;color:var(--ink-soft);font-weight:600}
.cgrid .ccard .seal{position:absolute;top:10px;right:11px;font-size:15px}
.cgrid .ccard .prog{margin-top:auto;padding-top:8px;display:flex;
  align-items:center;gap:7px;min-height:17px}
.cgrid .ccard .prog.empty{min-height:17px}
.cgrid .ccard .bar{flex:1;height:4px;border-radius:3px;background:var(--line);
  overflow:hidden}
.cgrid .ccard .bar i{display:block;height:100%;background:var(--a);
  border-radius:3px}
.cgrid .ccard .pc{font-size:10.5px;font-weight:800;color:var(--ink-soft)}
@media(max-width:400px){
  .cgrid{grid-template-columns:repeat(2,1fr);gap:9px}
  .cgrid .ccard{padding:12px 12px 10px}
  .cgrid .ccard .ic{font-size:22px}
  .cgrid .ccard .nm{font-size:13px}
}

/* Community videos. The thumbnail is a button - the player only
   appears when somebody wants it, because thirty embedded players on
   one page makes it crawl. */
.vhead{display:flex;align-items:center;gap:10px}
.vhead h3{flex:1}
.vadd{padding:7px 14px;border-radius:11px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink);font-size:12.5px;font-weight:700;
  cursor:pointer;font-family:inherit;white-space:nowrap}
.vadd:hover{border-color:var(--go);color:var(--go)}
.vwrap{display:grid;gap:10px;margin-bottom:16px}
.vdim{color:var(--ink-soft);font-size:13.5px;padding:10px 2px}
.vdim2{color:var(--ink-soft);font-size:11.5px;font-weight:700}
.vcard{background:var(--card);border:1px solid var(--line);
  border-radius:16px;overflow:hidden;display:grid;
  grid-template-columns:150px 1fr}
.vcard.vq{grid-template-columns:1fr}
@media(max-width:520px){ .vcard{grid-template-columns:1fr} }
.vthumb{border:none;padding:0;cursor:pointer;background:#0F1A2E center/cover;
  min-height:92px;display:grid;place-items:center;position:relative}
.vthumb:hover .vgo{transform:scale(1.12);background:rgba(0,0,0,.78)}
.vgo{width:42px;height:42px;border-radius:50%;background:rgba(0,0,0,.6);
  color:#fff;display:grid;place-items:center;font-size:15px;
  transition:transform .15s,background .15s;padding-left:3px}
.vplay{grid-column:1 / -1;aspect-ratio:16/9;background:#000}
.vplay iframe{width:100%;height:100%;border:none;display:block}
.vbody{padding:12px 14px;min-width:0}
.vtitle{font-weight:700;font-size:14.5px;display:block;line-height:1.35}
.vnote{font-size:13px;color:var(--ink-soft);margin-top:4px;line-height:1.5}
.vfoot{display:flex;align-items:center;gap:7px;margin-top:9px}
.vby{font-size:11.5px;color:var(--ink-soft);font-weight:700;overflow:hidden;
  text-overflow:ellipsis;white-space:nowrap}
.vsp{flex:1}

    w1d:{en:"Short and written, with real examples you can follow on your own computer. Five to twelve minutes each.",ur:"مختصر اور تحریری، اصل مثالوں کے ساتھ جو آپ اپنے کمپیوٹر پر آزما سکیں۔ ہر سبق پانچ سے بارہ منٹ۔",ar:"قصيرة ومكتوبة، بأمثلة حقيقية تجرّبها على جهازك. من خمس إلى اثنتي عشرة دقيقة لكل درس.",hi:"छोटे और लिखित, असली उदाहरणों के साथ जिन्हें आप अपने कंप्यूटर पर आज़मा सकें। हर पाठ पाँच से बारह मिनट।",bn:"সংক্ষিপ্ত ও লিখিত, বাস্তব উদাহরণসহ যা নিজের কম্পিউটারে করে দেখতে পারেন। প্রতিটি পাঁচ থেকে বারো মিনিট।",zh:"简短的图文课程，配有可在自己电脑上跟做的实例，每课五到十二分钟。",es:"Cortas y escritas, con ejemplos reales que puedes seguir en tu propio ordenador. De cinco a doce minutos cada una.",fr:"Courtes et écrites, avec de vrais exemples à reproduire sur votre ordinateur. De cinq à douze minutes chacune.",pt:"Curtas e escritas, com exemplos reais para acompanhar no seu computador. De cinco a doze minutos cada.",ru:"Короткие текстовые уроки с реальными примерами, которые можно повторить на своём компьютере. По пять–двенадцать минут.",tr:"Kısa ve yazılı, kendi bilgisayarınızda uygulayabileceğiniz gerçek örneklerle. Her biri beş ila on iki dakika.",id:"Singkat dan tertulis, dengan contoh nyata yang bisa Anda ikuti di komputer sendiri. Lima sampai dua belas menit."},
    w2t:{en:"Pass the quiz",ur:"کوئز پاس کریں",ar:"اجتز الاختبار",hi:"क्विज़ पास करें",bn:"কুইজ পাস করুন",zh:"通过测验",es:"Aprueba el examen",fr:"Réussissez le quiz",pt:"Passe no teste",ru:"Сдайте тест",tr:"Sınavı geçin",id:"Lulus kuis"},
    w2d:{en:"Questions are drawn from a pool and marked on the server, so nobody can read the answers from the page. Wrong answers come back with an explanation.",ur:"سوال ایک ذخیرے سے آتے ہیں اور سرور پر جانچے جاتے ہیں، اس لیے جوابات صفحے سے پڑھے نہیں جا سکتے۔ غلط جواب کے ساتھ وجہ بھی آتی ہے۔",ar:"تُسحب الأسئلة من بنك أسئلة وتُصحَّح على الخادم، فلا يمكن قراءة الإجابات من الصفحة. وتأتي الإجابات الخاطئة مع شرح.",hi:"प्रश्न एक बैंक से आते हैं और सर्वर पर जाँचे जाते हैं, इसलिए उत्तर पेज से नहीं पढ़े जा सकते। ग़लत उत्तर के साथ कारण भी आता है।",bn:"প্রশ্ন একটি ব্যাংক থেকে আসে ও সার্ভারে যাচাই হয়, তাই উত্তর পৃষ্ঠা থেকে পড়া যায় না। ভুল উত্তরের সাথে ব্যাখ্যা আসে।",zh:"题目从题库随机抽取并在服务器判分，答案不会出现在页面上。答错会附带解析。",es:"Las preguntas salen de un banco y se corrigen en el servidor, así que nadie puede leer las respuestas en la página. Los fallos vienen con explicación.",fr:"Les questions sont tirées d'une banque et corrigées sur le serveur : impossible de lire les réponses dans la page. Les erreurs sont expliquées.",pt:"As perguntas vêm de um banco e são corrigidas no servidor, então ninguém lê as respostas na página. Os erros vêm com explicação.",ru:"Вопросы берутся из банка и проверяются на сервере, поэтому ответов нет в коде страницы. К ошибкам даётся объяснение.",tr:"Sorular bir havuzdan çekilir ve sunucuda değerlendirilir; cevaplar sayfadan okunamaz. Yanlışlar açıklamayla gelir.",id:"Soal diambil dari bank soal dan dinilai di server, jadi jawabannya tidak bisa dibaca dari halaman. Jawaban salah disertai penjelasan."},
    w3t:{en:"Keep the certificate",ur:"سرٹیفکیٹ حاصل کریں",ar:"احصل على الشهادة",hi:"सर्टिफिकेट पाएँ",bn:"সার্টিফিকেট নিন",zh:"获得证书",es:"Quédate el certificado",fr:"Gardez le certificat",pt:"Fique com o certificado",ru:"Получите сертификат",tr:"Sertifikayı alın",id:"Dapatkan sertifikat"},
    w3d:{en:"Every certificate carries a number. Send the link to an employer and they can check it themselves — no account, no phone call.",ur:"ہر سرٹیفکیٹ کا اپنا نمبر ہوتا ہے۔ لنک آجر کو بھیجیں، وہ خود تصدیق کر لے گا — نہ اکاؤنٹ چاہیے، نہ فون۔",ar:"لكل شهادة رقم خاص. أرسل الرابط لصاحب العمل ليتحقق بنفسه — بلا حساب ولا مكالمة.",hi:"हर सर्टिफिकेट का अपना नंबर होता है। लिंक नियोक्ता को भेजें, वे खुद जाँच लेंगे — न अकाउंट चाहिए, न फ़ोन।",bn:"প্রতিটি সার্টিফিকেটের নিজস্ব নম্বর থাকে। লিঙ্ক নিয়োগকর্তাকে পাঠান, তিনি নিজেই যাচাই করবেন — অ্যাকাউন্ট বা ফোন লাগবে না।",zh:"每张证书都有编号。把链接发给用人单位，他们可自行核验，无需注册或来电。",es:"Cada certificado lleva un número. Envía el enlace a un empleador y podrá comprobarlo por su cuenta: sin cuenta ni llamadas.",fr:"Chaque certificat porte un numéro. Envoyez le lien à un employeur, il vérifie lui-même — sans compte ni appel.",pt:"Cada certificado tem um número. Envie o link ao empregador e ele mesmo verifica — sem conta, sem telefonema.",ru:"У каждого сертификата свой номер. Отправьте ссылку работодателю — он проверит сам, без аккаунта и звонков.",tr:"Her sertifikanın bir numarası var. Bağlantıyı işverene gönderin, kendisi doğrulasın — hesap da telefon da gerekmez.",id:"Setiap sertifikat punya nomor. Kirim tautannya ke pemberi kerja, mereka bisa memeriksanya sendiri — tanpa akun, tanpa telepon."},

    n5:{en:"Quranic Arabic",ur:"قرآنی عربی",ar:"العربية القرآنية",hi:"क़ुरआनी अरबी",bn:"কুরআনি আরবি",zh:"古兰经阿拉伯语",es:"Árabe coránico",fr:"Arabe coranique",pt:"Árabe corânico",ru:"Коранический арабский",tr:"Kur'an Arapçası",id:"Bahasa Arab Al-Quran"},
    d5:{en:"Thirty short daily lessons in Quranic Arabic: vocabulary, basic grammar, and reading short passages word by word. Taught in Urdu.",ur:"قرآنی عربی کے تیس مختصر روزانہ اسباق: الفاظ، بنیادی قواعد، اور چھوٹی عبارتیں لفظ بہ لفظ پڑھنا۔ اردو میں۔",ar:"ثلاثون درسًا يوميًا قصيرًا في العربية القرآنية: المفردات والقواعد الأساسية وقراءة نصوص قصيرة كلمة بكلمة. بالأردية.",hi:"क़ुरआनी अरबी के तीस छोटे दैनिक पाठ: शब्दावली, बुनियादी व्याकरण, और छोटी इबारतें शब्द दर शब्द। उर्दू में।",bn:"কুরআনি আরবির ত্রিশটি সংক্ষিপ্ত দৈনিক পাঠ: শব্দভাণ্ডার, মৌলিক ব্যাকরণ ও ছোট অনুচ্ছেদ শব্দে শব্দে। উর্দুতে।",zh:"三十节古兰经阿拉伯语短课：词汇、基础语法，逐词阅读短段落。以乌尔都语讲授。",es:"Treinta lecciones diarias breves de árabe coránico: vocabulario, gramática básica y lectura palabra por palabra. En urdu.",fr:"Trente courtes leçons quotidiennes d'arabe coranique : vocabulaire, grammaire de base, lecture mot à mot. En ourdou.",pt:"Trinta lições diárias curtas de árabe corânico: vocabulário, gramática básica e leitura palavra por palavra. Em urdu.",ru:"Тридцать коротких ежедневных уроков коранического арабского: лексика, базовая грамматика, чтение слово за словом. На урду.",tr:"Kur'an Arapçası için otuz kısa günlük ders: kelimeler, temel dilbilgisi ve kelime kelime okuma. Urduca anlatım.",id:"Tiga puluh pelajaran harian singkat bahasa Arab Al-Quran: kosakata, tata bahasa dasar, dan membaca kata per kata. Dalam bahasa Urdu."},

    noCerts:{en:"Finish a course and pass its quiz to earn your first certificate.",ur:"کوئی کورس مکمل کریں اور اس کا کوئز پاس کریں — پہلا سرٹیفکیٹ مل جائے گا۔",ar:"أكمل دورة واجتز اختبارها للحصول على شهادتك الأولى.",hi:"कोई कोर्स पूरा करें और उसका क्विज़ पास करें — पहला सर्टिफिकेट मिल जाएगा।",bn:"একটি কোর্স শেষ করে কুইজ পাস করুন — প্রথম সার্টিফিকেট পাবেন।",zh:"完成一门课程并通过测验，即可获得第一张证书。",es:"Termina un curso y aprueba su examen para obtener tu primer certificado.",fr:"Terminez un cours et réussissez son quiz pour obtenir votre premier certificat.",pt:"Conclua um curso e passe no teste para ganhar seu primeiro certificado.",ru:"Пройдите курс и сдайте тест, чтобы получить первый сертификат.",tr:"Bir kursu bitirip sınavını geçin, ilk sertifikanızı alın.",id:"Selesaikan kursus dan lulus kuisnya untuk sertifikat pertama Anda."},

    noteEn:{en:"This lesson is still in English. A translated version is on the way.",ur:"یہ سبق ابھی انگریزی میں ہے۔ ترجمہ شدہ نسخہ جلد آ رہا ہے۔",ar:"هذا الدرس ما زال بالإنجليزية. النسخة المترجمة قادمة قريبًا.",hi:"यह पाठ अभी अंग्रेज़ी में है। अनुवादित संस्करण जल्द आ रहा है।",bn:"এই পাঠটি এখনও ইংরেজিতে। অনূদিত সংস্করণ শীঘ্রই আসছে।",zh:"本课暂为英文，翻译版本即将推出。",es:"Esta lección sigue en inglés. La versión traducida llegará pronto.",fr:"Cette leçon est encore en anglais. Une version traduite arrive bientôt.",pt:"Esta lição ainda está em inglês. A versão traduzida chega em breve.",ru:"Этот урок пока на английском. Перевод скоро появится.",tr:"Bu ders şimdilik İngilizce. Çevirisi yolda.",id:"Pelajaran ini masih dalam bahasa Inggris. Versi terjemahan segera hadir."},

            "v": "Suppose every item needs 17% sales tax, and that rate sits in one cell, E1. You write =B2*E1 and copy it down. Row 3 becomes =B3*E2. Row 4 becomes =B4*E3. Those cells are empty, so your tax comes out as zero and nothing warns you."

              "cap": "The rate lives in E1 — one place, so it is easy to change",

                  "17%"

                [

                  "2500",
                  "=B2*$E$1",
                  "=B2+C2",
                  ""
                ],
                [
                  "Cooking oil",
                  "890",
                  "=B3*$E$1",
                  "=B3+C3",
                  ""
                ],
                [
                  "Sugar",
                  "640",

                  "=B4+C4",
                  ""
                ]

            "v": "The fix is the dollar sign. It pins part of a reference so it does not move when copied."

      {
        "t": "IF: making the sheet decide",
        "m": 10,
        "b": [
          {
            "k": "p",
            "v": "IF checks a condition and gives one answer when it is true and another when it is false. It reads as: IF this is true, do that, otherwise do the other thing."

            "k": "p",
            "v": "The shape is always the same: =IF(test, value if true, value if false)"

            "k": "sheet",
            "v": {

              "rows": [
                [
                  "Student",

                  "Result"
                ],
                [
                  "Ayesha",
                  "78",
                  "=IF(B2>=40,\"Pass\",\"Fail\")"

                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "p",
            "v": "Text inside a formula must be wrapped in double quotes. Numbers must not be. Getting this backwards produces a #NAME? error."
          },

            "k": "key",

            "v": "You can nest IFs to handle more than two outcomes, though it gets hard to read quickly. For grades: =IF(B2>=80,\"A\",IF(B2>=60,\"B\",IF(B2>=40,\"C\",\"F\"))). Excel checks each test in order and stops at the first one that is true — so the order matters."
          },
          {

            "v": "In Excel 2019 and later, IFS is cleaner for several conditions: =IFS(B2>=80,\"A\",B2>=60,\"B\",B2>=40,\"C\",TRUE,\"F\"). The final TRUE acts as the catch-all."

      {
        "t": "IFS, AND, OR and IFERROR",
        "m": 10,
        "b": [
          {
            "k": "p",
            "v": "One IF answers one question. Real rules usually have more than one condition: a student gets admission only if marks are at least 60 AND attendance is at least 75%. That is what AND and OR are for."
          },
          {
            "k": "img",
            "v": {
              "src": "/academy/img/office/excel-10.webp",
              "cap": "Where to click: the Formulas tab, then Logical — and the formula bar. Numbers show the order."
            }
          },
          {
            "k": "sheet",
            "v": {
              "cap": "Admission rule: marks 60+ AND attendance 75%+",
              "rows": [
                [
                  "Student",
                  "Marks",
                  "Attendance",
                  "Admission"
                ],
                [
                  "Ayesha",
                  "78",
                  "0.92",
                  "=IF(AND(B2>=60,C2>=0.75),\"Yes\",\"No\")"
                ],
                [
                  "Bilal",
                  "65",
                  "0.70",
                  "=IF(AND(B3>=60,C3>=0.75),\"Yes\",\"No\")"
                ],
                [
                  "Hina",
                  "55",
                  "0.95",
                  "=IF(AND(B4>=60,C4>=0.75),\"Yes\",\"No\")"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "steps",
            "v": "Read them like plain English:|AND(a, b) is TRUE only when every condition is true — Ayesha gets Yes, Bilal and Hina get No|OR(a, b) is TRUE when at least one is true — =IF(OR(B2>=90,C2>=0.98),\"Prize\",\"\")|NOT(a) flips TRUE and FALSE"
          },
          {
            "k": "p",
            "v": "IFS checks several conditions in order and returns the first match, without nesting: =IFS(B2>=80,\"A\",B2>=60,\"B\",B2>=40,\"C\",TRUE,\"F\"). It is in Excel 2019, 2021 and Microsoft 365."
          },
          {
            "k": "p",
            "v": "IFERROR catches errors and shows something friendly instead. =IFERROR(B2/C2,0) shows 0 instead of #DIV/0! when C2 is empty. Wrap it around lookups too, so a missing code shows Not found instead of #N/A."
          },
          {
            "k": "warn",
            "v": "Do not use IFERROR to hide every error while building a sheet. An error is often telling you something is really wrong. Add IFERROR last, once the formula is correct."
          },

            "k": "tip",
            "v": "Percentages like 75% are stored as 0.75. In a formula, write C2>=0.75 or C2>=75% — both work."

          {
            "k": "p",
            "v": "Now in another area you type a code and want the price to appear by itself. With VLOOKUP: =VLOOKUP(F2,A2:C5,3,FALSE)"
          },
          {
            "k": "steps",
            "v": "What each part means:|F2 — the value you are looking for|A2:C5 — the table to search in|3 — bring back the third column of that table|FALSE — exact match only"
          },
          {
            "k": "warn",
            "v": "That final FALSE is not optional. Leave it out and Excel does an approximate match, which returns confidently wrong answers on unsorted data. Always write FALSE. Always."
          },
          {
            "k": "p",
            "v": "VLOOKUP has a real limitation: it only looks rightwards. The value you search for must be in the leftmost column of your table. If the code sits to the right of the price, VLOOKUP simply cannot do it."
          },
          {
            "k": "p",
            "v": "XLOOKUP, in Microsoft 365 and Excel 2021, fixes this and reads more clearly: =XLOOKUP(F2,A2:A5,C2:C5). Look for this, in this column, return from that column. It looks in any direction and defaults to exact match."
          },
          {
            "k": "tip",
            "v": "Wrap it to handle missing codes: =IFERROR(VLOOKUP(F2,A2:C5,3,FALSE),\"Not found\"). Without this, a typo fills your sheet with #N/A."

      {
        "t": "INDEX and MATCH",
        "m": 11,
        "b": [
          {
            "k": "p",
            "v": "INDEX and MATCH together do what VLOOKUP does, but in any direction and without counting columns. Many experienced users prefer them, and you will meet them in every office that uses Excel seriously."

          {
            "k": "img",
            "v": {
              "src": "/academy/img/office/excel-13.webp",
              "cap": "Where to click: the Formulas tab, then Lookup & Reference — and the formula bar. Numbers show the order."
            }
          },
          {
            "k": "steps",
            "v": "Learn the two parts separately:|MATCH finds the position: =MATCH(\"P03\",A2:A5,0) gives 3, because P03 is the third item|The 0 at the end means exact match — always use it|INDEX returns the item at a position: =INDEX(C2:C5,3) gives the third price|Together: =INDEX(C2:C5,MATCH(F2,A2:A5,0))"
          },
          {
            "k": "sheet",
            "v": {

                  "2500",
                  "P01"
                ],

                  "890",
                  "P02"
                ],
                [
                  "Sugar",
                  "640",
                  "P03"
                ],
                [
                  "Tea",
                  "1150",
                  "P04"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "p",
            "v": "Here the code is in column C, to the right of the price. VLOOKUP fails, but =INDEX(B2:B5,MATCH(\"P03\",C2:C5,0)) returns 640, because INDEX and MATCH do not care which side the columns are on."
          },
          {
            "k": "p",
            "v": "A two-way lookup finds the value where a row and a column cross, like a city's sales in a given month: =INDEX(B2:E5, MATCH(H1,A2:A5,0), MATCH(H2,B1:E1,0)). The first MATCH picks the row, the second the column."
          },

    "id": "powerpoint",
    "name": "Microsoft PowerPoint",
    "icon": "📽️",

    "lessons": [
      {
        "t": "Slides and layouts",
        "m": 6,
        "b": [
          {
            "k": "p",
            "v": "A presentation is a stack of slides. The panel on the left shows them all in order; the big area in the middle is the slide you are editing."
          },
          {
            "k": "p",
            "v": "Every new slide comes with a layout — a ready-made arrangement of boxes. Using layouts instead of dragging text boxes around keeps everything lined up across slides."
          },
          {
            "k": "steps",
            "v": "To add a slide:|Go to the Home tab|Click the arrow under New Slide|Pick a layout — Title and Content covers most cases|Click inside a box and type"
          },
          {
            "k": "tip",
            "v": "Drag slides up and down in the left panel to reorder them. To duplicate a slide, right-click it and choose Duplicate Slide — quicker than rebuilding a layout you liked."
          }
        ]
      },
      {
        "t": "Text that works on a slide",
        "m": 7,
        "b": [
          {
            "k": "p",
            "v": "The most common mistake in PowerPoint is treating a slide like a page. Slides are not documents. Anything you write will be read from the back of a room, in a few seconds, while you are also talking."
          },
          {
            "k": "steps",
            "v": "Practical limits:|One idea per slide|Six bullet points at most, and fewer is better|Six words per bullet where you can manage it|Never below 24 point font"
          },
          {
            "k": "warn",
            "v": "If you read your slides out loud word for word, the audience switches off — they can read faster than you can speak. Put the short version on the slide and say the rest."
          },
          {
            "k": "p",
            "v": "Use the Notes pane below the slide for what you plan to say. The audience never sees it, but you can see it in Presenter View while you present."
          },
          {
            "k": "tip",
            "v": "Write your slide titles as full statements. Quarterly sales rose 40% tells the audience something. Sales Update does not."
          }
        ]
      },
      {
        "t": "Images and shapes",
        "m": 7,
        "b": [
          {
            "k": "p",
            "v": "One clear image explains more than three bullet points. Insert them from the Insert tab, either from your computer or from Stock Images."
          },
          {
            "k": "steps",
            "v": "To place an image well:|Insert, then Pictures|Drag a corner handle to resize — never a side handle, that stretches the picture|Use the guides that appear as you drag to line it up|Right-click and choose Send to Back to put it behind text"
          },
          {
            "k": "warn",
            "v": "Only use images you have the right to use. Pulling a photo off Google Search and putting it in a commercial presentation can land you a copyright claim. Stock Images inside PowerPoint, and sites like Unsplash and Pexels, are safe."
          },
          {
            "k": "p",
            "v": "Shapes are useful for arrows, boxes and simple diagrams. Hold Shift while drawing to keep circles round and squares square."
          },
          {
            "k": "tip",
            "v": "Select several objects, then use Format, Align to line them up precisely. Eyeballing it never quite works, and the audience notices."
          }

      },
      {
        "t": "Themes and colour",
        "m": 6,
        "b": [
          {
            "k": "p",
            "v": "A theme sets fonts and colours across every slide at once. Choose one at the start from the Design tab and your deck stays consistent without any effort."
          },
          {
            "k": "p",
            "v": "Contrast is what matters most. Dark text on a light background, or light text on a dark background. Anything in between becomes unreadable on a projector, which washes colours out badly."
          },

            "k": "steps",
            "v": "A simple, safe scheme:|One dark colour for text|One light colour for the background|One accent colour for emphasis|That is all — three colours is plenty"
          },

            "k": "warn",
            "v": "Never put text directly on a busy photo. Either place a solid or semi-transparent shape behind the text, or crop the photo so the text sits over a plain area."

          },

    "lessons": [
      {
        "t": "What VBA is, and when to use it",
        "m": 8,
        "b": [
          {
            "k": "p",
            "v": "VBA stands for Visual Basic for Applications. It is a programming language built into Excel that lets you tell Excel to do things by itself — the same twelve clicks you do every Monday morning, done in one."
          },
          {
            "k": "p",
            "v": "A macro is simply a saved set of VBA instructions. When you run the macro, Excel carries out those instructions in order."
          },
          {
            "k": "steps",
            "v": "VBA is worth it when:|You repeat the same steps on a schedule — daily, weekly, monthly|You reformat data that arrives in the same messy shape every time|You need a button that non-technical colleagues can press|A task takes long enough to be annoying but is too fiddly for formulas"
          },
          {
            "k": "warn",
            "v": "VBA is not worth it for a one-off job. If you will do something once, do it by hand. Writing and debugging a macro takes longer than most single tasks."
          },
          {
            "k": "p",
            "v": "One important limitation to know upfront: VBA does not exist in Excel on the web, and support on Mac is partial. Macros are a Windows desktop Excel feature. If your workbook needs to run in a browser, formulas or Power Query are the better path."
          },
          {
            "k": "warn",
            "v": "Macros can do anything your user account can do, including deleting files. That is why Excel blocks them by default, and why you must never enable macros in a workbook that arrived by email from someone you do not know. Macro-borne malware is still common."
          }
        ]
      },
      {
        "t": "Setting up: the Developer tab and .xlsm",
        "m": 8,
        "b": [
          {
            "k": "p",
            "v": "The Developer tab is hidden until you ask for it. Everything to do with macros lives there."
          },
          {
            "k": "steps",
            "v": "Turn it on:|File, then Options|Choose Customize Ribbon on the left|In the right-hand list, tick Developer|Click OK — the Developer tab now appears on the Ribbon"
          },
          {
            "k": "p",
            "v": "Next, the file format. A normal .xlsx file cannot store macros at all — Excel will strip them out on save and warn you as it does. Macro-enabled workbooks use the .xlsm extension."
          },
          {
            "k": "steps",
            "v": "Save correctly:|File, then Save As|In the file type dropdown, choose Excel Macro-Enabled Workbook (*.xlsm)|Save"
          },
          {
            "k": "warn",
            "v": "Skip this and your work disappears. Excel does show a warning, but it is easy to click past, and the macros are gone the moment the file closes."
          },
          {
            "k": "p",
            "v": "Macro security lives under Developer, then Macro Security. The sensible setting is Disable all macros with notification — macros will not run automatically, but you get a yellow bar offering to enable them when you know the file is yours."

            "v": "Record a formatting macro:|Put some data in A1:C5 first|Developer tab, Record Macro|Name it FormatHeader — no spaces allowed in macro names|Shortcut key: hold Shift and press H, giving Ctrl+Shift+H|Click OK — recording has started"
          },
          {
            "k": "steps",
            "v": "Now do the actions:|Select row 1|Make it bold|Set the fill colour to a light grey|Click Stop Recording on the Developer tab"
          },
          {
            "k": "p",
            "v": "Now undo everything with Ctrl+Z a few times, then press Ctrl+Shift+H. The formatting comes back instantly. Excel just repeated all four of your steps."
          },
          {
            "k": "warn",
            "v": "Avoid Ctrl+S, Ctrl+C and Ctrl+V as macro shortcuts. Your shortcut overrides Excel's built-in one for as long as the workbook is open, and losing Ctrl+S is genuinely painful."
          },

            "k": "tip",

            "k": "code",

  function t(k){ return (T[k] && T[k][lang]) || (T[k] && T[k].en) || k; }

  /* ---- the address bar ----

     The page used to leave the URL alone, so a lesson could not be
     linked, a refresh lost your place, and Back left the site. The
     address now says what you are looking at. */

  function urlFor(v){
    if (!v || v.page === "home") return "/academy/";
    if (v.page === "certs") return "/academy/?v=certs";
    if (v.page === "board") return "/academy/?v=board";
    // Without this the address gets rewritten to /academy/ and the
    // queue is lost on the next read.
    if (v.page === "vqueue") return "/academy/?v=vqueue";
    if (v.page === "badges") return "/academy/?v=badges";
    if (!v.c) return "/academy/";
    var u = "/academy/?c=" + encodeURIComponent(v.c);
    if (v.page === "quiz") return u + "&v=quiz";
    if (v.page === "lesson") return u + "&l=" + v.l;
    return u;
  }

  /* push adds a step to history, replace does not. Moving between
     lessons should be undoable with Back; a redraw of the same place
     should not pile up entries. */
  function syncUrl(push){
    var want = urlFor(view);
    if (location.pathname + location.search === want) return;
    try {
      if (push) history.pushState({v: view.page, c: view.c, l: view.l}, "", want);
      else history.replaceState({v: view.page, c: view.c, l: view.l}, "", want);
    } catch (e) {}
  }

  /* Read the address on the way in, so a shared link or a pinned
     shortcut opens the right thing. */
  function viewFromUrl(){
    var q = {};
    location.search.replace(/^\?/, "").split("&").forEach(function(pair){
      if (!pair) return;
      var bits = pair.split("=");
      q[decodeURIComponent(bits[0])] = decodeURIComponent(bits[1] || "");
    });

    if (q.v === "certs") return {page:"certs", c:null, l:0};
    if (q.v === "board") return {page:"board", c:null, l:0};
    // The video queue. Nothing links to it - moderators type the
    // address, so there is no point advertising it in the menu.
    if (q.v === "vqueue") return {page:"vqueue", c:null, l:0};
    if (q.v === "badges") return {page:"badges", c:null, l:0};
    if (!q.c) return {page:"home", c:null, l:0};
    if (!courseById(q.c)) return {page:"home", c:null, l:0};
    if (q.v === "quiz") return {page:"quiz", c:q.c, l:0};
    if (q.l !== undefined && q.l !== ""){
      var n2 = parseInt(q.l, 10);
      if (!isNaN(n2) && n2 >= 0) return {page:"lesson", c:q.c, l:n2};

  function slugify(t){

      var seen = {};
      c.lessons.forEach(function(l){

      });

  function courseCard(c){

  /* ================= community videos =================

  var vidCache = {};        // course id -> list, so leaving and coming
                            // back does not fetch again
  var vidOpen = {};         // which ones have been expanded

  function videoSection(c){
    // Drawn empty, then filled when the fetch lands. Waiting for the
    // network before showing the course would be worse.
    setTimeout(function(){ loadVideos(c.id); }, 30);
    return '<div class="head vhead"><h3>Videos from learners</h3>'
      + (me ? '<button class="vadd" data-vadd="' + esc(c.id) + '">Add one</button>' : '')
      + '</div>'

      + '<div class="vdim">Looking\u2026</div></div>';
  }

  function loadVideos(courseId, force){
    var box = document.getElementById("vwrap-" + courseId);
    if (!box) return;

    if (!force && vidCache[courseId]){
      paintVideos(courseId, vidCache[courseId]);
      return;
    }

    api("/academy/videos/?course=" + encodeURIComponent(courseId))
      .then(function(r){
        if (!r.ok) throw new Error("no");
        vidCache[courseId] = r.data.videos || [];
        paintVideos(courseId, vidCache[courseId]);
      })
      .catch(function(){
        var b = document.getElementById("vwrap-" + courseId);
        if (b) b.innerHTML = '<div class="vdim">Could not load these.</div>';
      });
  }

  function paintVideos(courseId, list){
    var box = document.getElementById("vwrap-" + courseId);
    if (!box) return;

    if (!list.length){
      box.innerHTML = '<div class="vdim">Nothing here yet.'
        + (me ? ' Be the first to add something.' : '') + '</div>';
      return;
    }

    box.innerHTML = list.map(function(v){
      var open = vidOpen[v.id];
      var mine = me && v.author_id === me.id;

      var media = open
        ? '<div class="vplay"><iframe src="' + esc(v.embed)
          + '?rel=0" title="' + esc(v.title) + '" loading="lazy" '

          + 'allowfullscreen></iframe></div>'

          + '><span class="vgo">\u25b6</span></button>';

  function sendVideo(courseId){
    var msg = document.getElementById("vfMsg");
    var btn = document.querySelector("[data-vsend]");
    var url = (document.getElementById("vfUrl") || {}).value || "";
    var title = (document.getElementById("vfTitle") || {}).value || "";
    var note = (document.getElementById("vfNote") || {}).value || "";

    if (!url.trim()){ msg.textContent = "Paste the link first."; msg.className = "vfmsg bad"; return; }
    if (title.trim().length < 6){ msg.textContent = "Give it a title."; msg.className = "vfmsg bad"; return; }

    if (btn) btn.disabled = true;
    msg.textContent = "Sending\u2026";
    msg.className = "vfmsg";

    api("/academy/videos/add/", {method: "POST", body: {
      course: courseId, url: url, title: title, note: note
    }}).then(function(r){
      if (btn) btn.disabled = false;
      if (!r.ok){
        msg.textContent = r.data.detail || "That did not work.";
        msg.className = "vfmsg bad";
        return;
      }
      var f = document.getElementById("vform");
      if (f) f.innerHTML = '<b>Thank you</b><p class="vdim">'
        + esc(r.data.detail || "A moderator will look at it shortly.")
        + '</p><div class="vfrow"><button class="vfcancel" data-vcancel>Close</button></div>';
    });
  }

  function voteVideo(id, val){
    var card = document.querySelector('[data-vid="' + id + '"]');
    var v = null;
    for (var k in vidCache){
      (vidCache[k] || []).forEach(function(x){ if (x.id === id) v = x; });
    }
    if (!v) return;

    // Pressing the same one again takes the vote back
    var send = (v.my_vote === val) ? 0 : val;

    api("/academy/videos/" + id + "/vote/", {method: "POST", body: {value: send}})
      .then(function(r){
        if (!r.ok) return;
        v.up = r.data.up;
        v.down = r.data.down;
        v.my_vote = r.data.my_vote;
        var course = null;
        for (var k2 in vidCache){
          if ((vidCache[k2] || []).indexOf(v) !== -1) course = k2;
        }
        if (course) paintVideos(course, vidCache[course]);
      });
  }

  /* ---- the moderation queue ---- */

  function renderVideoQueue(){
    setTimeout(loadVideoQueue, 30);
    return '<div class="crumb"><button data-nav="home">&larr; '
      + esc(t("back")) + '</button></div>'
      + '<div class="head"><h3>Videos waiting</h3></div>'
      + '<div class="vwrap" id="vqueue"><div class="vdim">Looking\u2026</div></div>';
  }

  function loadVideoQueue(){
    api("/academy/videos/queue/").then(function(r){
      var box = document.getElementById("vqueue");
      if (!box) return;
      if (!r.ok){
        box.innerHTML = '<div class="vdim">' + esc(r.data.detail || "Not allowed.") + '</div>';
        return;
      }
      var list = r.data.videos || [];
      if (!list.length){
        box.innerHTML = '<div class="vdim">Nothing waiting.</div>';
        return;
      }
      box.innerHTML = list.map(function(v){
        return '<div class="vcard vq" data-vid="' + v.id + '">'
          + '<button class="vthumb" data-vqplay="' + esc(v.embed) + '"'
          + (v.thumb ? ' style="background-image:url(' + esc(v.thumb) + ')"' : '')
          + '><span class="vgo">\u25b6</span></button>'
          + '<div class="vbody">'
          + '<b class="vtitle">' + esc(v.title) + '</b>'
          + '<p class="vnote">' + esc(v.note || "") + '</p>'
          + '<p class="vdim">' + esc(v.course) + ' \u00b7 by ' + esc(v.author)
          + ' \u00b7 <a href="' + esc(v.watch) + '" target="_blank" '
          + 'rel="noopener">watch it</a></p>'
          + '<div class="vfrow">'
          + '<button class="vfcancel" data-vno="' + v.id + '">Turn down</button>'
          + '<button class="vfgo" data-vyes="' + v.id + '">Publish</button>'
          + '</div></div></div>';
      }).join("");
    });
  }

  function decideVideo(id, action){
    api("/academy/videos/" + id + "/decide/", {method: "POST",
        body: {action: action}}).then(function(r){
      if (!r.ok) return;
      var card = document.querySelector('.vq[data-vid="' + id + '"]');
      if (card) card.remove();
      vidCache = {};   // a published one changes a course list
      var box = document.getElementById("vqueue");
      if (box && !box.querySelector(".vq")){
        box.innerHTML = '<div class="vdim">Nothing waiting.</div>';
      }
    });
  }

  document.addEventListener("click", function(e){
    if (!e.target.closest) return;

    var play = e.target.closest("[data-vplay]");
    if (play){
      var pid = parseInt(play.getAttribute("data-vplay"), 10);
      vidOpen[pid] = true;
      for (var k in vidCache){
        if ((vidCache[k] || []).some(function(x){ return x.id === pid; })){
          paintVideos(k, vidCache[k]);
          api("/academy/videos/" + pid + "/seen/", {method: "POST"});
        }
      }
      return;
    }

    var vv = e.target.closest("[data-vvote]");
    if (vv){
      if (!me){ openAuth("signin"); return; }
      voteVideo(parseInt(vv.getAttribute("data-vvote"), 10),
                parseInt(vv.getAttribute("data-val"), 10));
      return;
    }

    var add = e.target.closest("[data-vadd]");
    if (add){ videoForm(add.getAttribute("data-vadd")); return; }

    if (e.target.closest("[data-vcancel]")){
      var f = document.getElementById("vform");
      if (f) f.remove();
      return;
    }

    var send = e.target.closest("[data-vsend]");
    if (send){ sendVideo(send.getAttribute("data-vsend")); return; }

    var yes = e.target.closest("[data-vyes]");
    if (yes){ decideVideo(parseInt(yes.getAttribute("data-vyes"), 10), "live"); return; }

    var no = e.target.closest("[data-vno]");
    if (no){ decideVideo(parseInt(no.getAttribute("data-vno"), 10), "rejected"); return; }
  });

  /* ================= the review gate =================

     A passed quiz makes the certificate at once, but its number stays
     hidden until the learner says how the course was. Stars are all that
     is needed; the rest is optional. Afterwards comes a plain invitation
     to rate the app and share - asked, never required. */

  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.xpertcreation.app";

  function certUrl(serial){
    return "https://xpertcreation.com/certificate/" + serial + "/";
  }

  function reviewForm(slug){
    var stars = "";
    for (var i = 1; i <= 5; i++){
      stars += '<button type="button" data-rvstar="' + i + '" aria-label="' + i
        + ' stars">\u2605</button>';
    }
    function seg(group, labels){
      return '<div class="rvseg" data-rvgroup="' + group + '">'
        + labels.map(function(l, i){
            return '<button type="button" data-rvval="' + (i + 1) + '">' + l + '</button>';
          }).join("") + '</div>';
    }
    return '<div class="rvbox" data-rvcourse="' + esc(slug) + '">'
      + '<b class="rvh">One last step</b>'
      + '<p class="rvp">Tell us how the course was and your certificate opens '
      + 'straight after. Stars are enough \u2014 the rest is optional.</p>'
      + '<div class="rvstars">' + stars + '</div>'
      + '<p class="rvq">Was it clear?</p>'
      + seg("clarity", ["Hard to follow", "Mostly", "Very clear"])
      + '<p class="rvq">The pace?</p>'
      + seg("pace", ["Too slow", "About right", "Too fast"])
      + '<textarea class="rvtext" maxlength="600" '
      + 'placeholder="Anything you would add or change? (optional)"></textarea>'
      + '<div class="rvmsg"></div>'
      + '<button type="button" class="cta rvsend">Open my certificate &rarr;</button>'
      + '</div>';
  }

  function certDone(serial){
    var u = certUrl(serial);
    var wa = "I just earned a certificate from XpertAcademy: " + u;
    return '<a class="cta" href="/certificate/' + esc(serial) + '/" target="_blank" '
      + 'rel="noopener">' + esc(t("viewCert")) + ' &rarr;</a>'
      + '<div class="invite"><b>Enjoyed it? A small favour</b>'
      + '<p>They help more people find free courses like this one.</p>'
      + '<div class="invrow">'
      + '<a href="' + PLAY_URL + '" target="_blank" rel="noopener">\u2b50 Rate the app</a>'
      + '<a href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u)
      + '" target="_blank" rel="noopener">Share on Facebook</a>'
      + '<a href="https://wa.me/?text=' + encodeURIComponent(wa)
      + '" target="_blank" rel="noopener">WhatsApp</a>'
      + '<a href="https://www.facebook.com/groups/1202505063279206" '
      + 'target="_blank" rel="noopener">\ud83d\udc65 Join our group</a>'
