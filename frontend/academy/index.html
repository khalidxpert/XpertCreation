            "v": "Dates are secretly numbers. Behind the scenes Excel counts days from 1 January 1900, so 1 August 2026 is stored as 46235. That is why you can subtract one date from another and get the number of days between them — try =B2-A2 with two dates."
          },
          {
            "k": "sheet",
            "v": {
              "cap": "Date maths",
              "rows": [
                [
                  "Start",
                  "End",
                  "Days"
                ],
                [
                  "01/08/2026",
                  "15/08/2026",
                  "=B2-A2"
                ],
                [
                  "Result",
                  "",
                  "14"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "tip",
            "v": "Seeing ##### means the column is too narrow, not that anything is broken. Double-click the line between the column headers to widen it to fit."
          }
        ]
      },
      {
        "t": "IF: making the sheet decide",
        "m": 10,
        "b": [
          {
            "k": "p",
            "v": "IF checks a condition and gives one answer when it is true and another when it is false. It reads as: IF this is true, do that, otherwise do the other thing."
          },
          {
            "k": "p",
            "v": "The shape is always the same: =IF(test, value if true, value if false)"
          },
          {
            "k": "sheet",
            "v": {
              "cap": "Pass mark is 40",
              "rows": [
                [
                  "Student",
                  "Marks",
                  "Result"
                ],
                [
                  "Ayesha",
                  "78",
                  "=IF(B2>=40,\"Pass\",\"Fail\")"
                ],
                [
                  "Bilal",
                  "35",
                  "=IF(B3>=40,\"Pass\",\"Fail\")"
                ],
                [
                  "Hina",
                  "91",
                  "=IF(B4>=40,\"Pass\",\"Fail\")"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "p",
            "v": "Text inside a formula must be wrapped in double quotes. Numbers must not be. Getting this backwards produces a #NAME? error."
          },
          {
            "k": "key",
            "v": ">=Greater than|<=Less than|>==At least|<==At most|==Equal to|<>=Not equal to"
          },
          {
            "k": "p",
            "v": "You can nest IFs to handle more than two outcomes, though it gets hard to read quickly. For grades: =IF(B2>=80,\"A\",IF(B2>=60,\"B\",IF(B2>=40,\"C\",\"F\"))). Excel checks each test in order and stops at the first one that is true — so the order matters."
          },
          {
            "k": "tip",
            "v": "In Excel 2019 and later, IFS is cleaner for several conditions: =IFS(B2>=80,\"A\",B2>=60,\"B\",B2>=40,\"C\",TRUE,\"F\"). The final TRUE acts as the catch-all."
          }
        ]
      },
      {
        "t": "COUNTIF and SUMIF",
        "m": 9,
        "b": [
          {
            "k": "p",
            "v": "SUM adds everything. SUMIF adds only the rows that match a condition. COUNTIF counts them. These two answer most of the questions people actually ask a spreadsheet."
          },
          {
            "k": "sheet",
            "v": {
              "cap": "A small sales sheet",
              "rows": [
                [
                  "Date",
                  "City",
                  "Salesperson",
                  "Amount"
                ],
                [
                  "01/08",
                  "Lahore",
                  "Ayesha",
                  "12500"
                ],
                [
                  "01/08",
                  "Karachi",
                  "Bilal",
                  "8900"
                ],
                [
                  "02/08",
                  "Lahore",
                  "Ayesha",
                  "15200"
                ],
                [
                  "02/08",
                  "Islamabad",
                  "Hina",
                  "7400"
                ],
                [
                  "03/08",
                  "Lahore",
                  "Bilal",
                  "9100"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "steps",
            "v": "Now answer real questions:|How many Lahore sales? =COUNTIF(B2:B6,\"Lahore\") gives 3|Total from Lahore? =SUMIF(B2:B6,\"Lahore\",D2:D6) gives 36800|Ayesha's total? =SUMIF(C2:C6,\"Ayesha\",D2:D6) gives 27700|Sales above 10000? =COUNTIF(D2:D6,\">10000\") gives 2"
          },
          {
            "k": "p",
            "v": "Read SUMIF as: look in this range, find the ones matching this, then add up the matching values from that other range. The order is range, criteria, sum range."
          },
          {
            "k": "tip",
            "v": "Do not type \"Lahore\" into the formula. Put it in a cell, say F1, and write =SUMIF(B2:B6,F1,D2:D6). Now you can change one cell to see any city, instead of rewriting the formula each time."
          },
          {
            "k": "warn",
            "v": "COUNTIF and SUMIF ignore case, so \"lahore\" and \"Lahore\" both match. But they do not ignore stray spaces — \"Lahore \" with a trailing space will not match. Use TRIM to clean imported data."
          }
        ]
      },
      {
        "t": "VLOOKUP and XLOOKUP",
        "m": 11,
        "b": [
          {
            "k": "p",
            "v": "A lookup pulls information from another table. You have a product code and want its price; you have a student roll number and want their name. Doing this by hand is where whole afternoons disappear."
          },
          {
            "k": "sheet",
            "v": {
              "cap": "Price list — this is the table you look into",
              "rows": [
                [
                  "Code",
                  "Product",
                  "Price"
                ],
                [
                  "P01",
                  "Rice bag",
                  "2500"
                ],
                [
                  "P02",
                  "Cooking oil",
                  "890"
                ],
                [
                  "P03",
                  "Sugar",
                  "640"
                ],
                [
                  "P04",
                  "Tea",
                  "1150"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "p",
            "v": "Now in another area you type a code and want the price to appear by itself. With VLOOKUP: =VLOOKUP(F2,A2:C5,3,FALSE)"
          },
          {
            "k": "steps",
            "v": "What each part means:|F2 — the value you are looking for|A2:C5 — the table to search in|3 — bring back the third column of that table|FALSE — exact match only"
          },
          {
            "k": "warn",
            "v": "That final FALSE is not optional. Leave it out and Excel does an approximate match, which returns confidently wrong answers on unsorted data. Always write FALSE. Always."
          },
          {
            "k": "p",
            "v": "VLOOKUP has a real limitation: it only looks rightwards. The value you search for must be in the leftmost column of your table. If the code sits to the right of the price, VLOOKUP simply cannot do it."
          },
          {
            "k": "p",
            "v": "XLOOKUP, in Microsoft 365 and Excel 2021, fixes this and reads more clearly: =XLOOKUP(F2,A2:A5,C2:C5). Look for this, in this column, return from that column. It looks in any direction and defaults to exact match."
          },
          {
            "k": "tip",
            "v": "Wrap it to handle missing codes: =IFERROR(VLOOKUP(F2,A2:C5,3,FALSE),\"Not found\"). Without this, a typo fills your sheet with #N/A."
          }
        ]
      },
      {
        "t": "Worked example: student result sheet",
        "m": 12,
        "b": [
          {
            "k": "p",
            "v": "This one pulls together IF, SUM, AVERAGE and formatting into a sheet you could hand to a school tomorrow."
          },
          {
            "k": "sheet",
            "v": {
              "cap": "Step 1 — the marks",
              "rows": [
                [
                  "Roll",
                  "Name",
                  "Urdu",
                  "English",
                  "Maths",
                  "Science"
                ],
                [
                  "1",
                  "Ayesha",
                  "78",
                  "82",
                  "91",
                  "88"
                ],
                [
                  "2",
                  "Bilal",
                  "45",
                  "38",
                  "52",
                  "41"
                ],
                [
                  "3",
                  "Hina",
                  "92",
                  "95",
                  "89",
                  "94"
                ],
                [
                  "4",
                  "Danish",
                  "61",
                  "58",
                  "67",
                  "55"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "steps",
            "v": "Step 2 — add the calculated columns:|G1: Total — in G2 type =SUM(C2:F2)|H1: Average — in H2 type =AVERAGE(C2:F2)|I1: Percent — in I2 type =G2/400 and format as percentage|J1: Grade — in J2 type =IF(H2>=80,\"A\",IF(H2>=60,\"B\",IF(H2>=40,\"C\",\"F\")))|Select G2:J2 and double-click the fill handle to copy all four down"
          },
          {
            "k": "p",
            "v": "Bilal's average is 44, so his grade is C — he passed on average even though he failed English. If you want the grade to depend on passing every subject, use =IF(MIN(C2:F2)<40,\"F\",IF(H2>=80,\"A\",IF(H2>=60,\"B\",\"C\"))). MIN finds his weakest subject and fails him on it."
          },
          {
            "k": "p",
            "v": "That single change shows why writing the rule down matters. Two reasonable people would build these two sheets differently and both would call it correct."
          },
          {
            "k": "tip",
            "v": "Add class statistics below: =AVERAGE(H2:H5) for the class average, =MAX(G2:G5) for the top total, and =COUNTIF(J2:J5,\"F\") for how many failed."
          }
        ]
      },
      {
        "t": "Sorting, filtering and Tables",
        "m": 8,
        "b": [
          {
            "k": "p",
            "v": "Once a sheet passes one screen, sorting and filtering are how you find anything at all."
          },
          {
            "k": "steps",
            "v": "Set it up:|Click any cell inside your data|Data tab, then Filter|Small arrows appear on every header|Click an arrow to sort, or untick values to hide them"
          },
          {
            "k": "warn",
            "v": "Before sorting, make sure there are no blank rows inside your data. A blank row makes Excel think the data ends there, so it sorts only the top part and silently scrambles the relationship between your columns. This corrupts data in a way that is very hard to spot afterwards."
          },
          {
            "k": "p",
            "v": "The safer approach is to convert your range into a Table. Select any cell in the data and press Ctrl+T. Excel then knows exactly where your data starts and ends."
          },
          {
            "k": "steps",
            "v": "What a Table gives you for free:|Filter arrows on every header|Alternating row colours that stay correct when you sort|Formulas that extend automatically to new rows|Headers that stay visible as you scroll|A name you can use in formulas instead of A2:D500"
          },
          {
            "k": "tip",
            "v": "Press Ctrl+Shift+L to toggle filters on and off without leaving the keyboard."
          }
        ]
      },
      {
        "t": "Conditional formatting and dropdowns",
        "m": 9,
        "b": [
          {
            "k": "p",
            "v": "Conditional formatting colours cells based on their value. It turns a wall of numbers into something you can read at a glance."
          },
          {
            "k": "steps",
            "v": "To highlight overspending in your budget:|Select the Difference column|Home tab, Conditional Formatting, Highlight Cells Rules, Greater Than|Type 0|Choose the red fill and click OK"
          },
          {
            "k": "p",
            "v": "Data Bars are even quicker for comparing sizes. Select a column of numbers, then Conditional Formatting, Data Bars. Each cell gets a small bar proportional to its value — a chart inside the cells."
          },
          {
            "k": "p",
            "v": "Data Validation does the opposite job: it stops bad data getting in. If a column should only ever hold Lahore, Karachi or Islamabad, make it a dropdown."
          },
          {
            "k": "steps",
            "v": "To build a dropdown:|Select the cells|Data tab, Data Validation|Under Allow, choose List|In Source, type Lahore,Karachi,Islamabad — or point at a range of cells|Click OK"
          },
          {
            "k": "tip",
            "v": "Dropdowns are the single best defence against the spelling problem. Typed by hand, you end up with Lahore, lahore and Lahroe — and COUNTIF treats them as three different cities."
          }
        ]
      },
      {
        "t": "Charts that explain themselves",
        "m": 9,
        "b": [
          {
            "k": "p",
            "v": "A chart converts numbers into a shape people can understand instantly. Excel makes them easy; choosing the right one is the part that takes judgement."
          },
          {
            "k": "steps",
            "v": "To make one:|Select your data including the headers|Insert tab|Pick a chart type|Drag the chart where you want it"
          },
          {
            "k": "p",
            "v": "Pick by what you are showing. Column charts compare separate things. Line charts show change over time. Pie charts show parts of one whole, and only work when there are a few slices."
          },
          {
            "k": "warn",
            "v": "A pie chart with ten slices communicates nothing — people cannot compare angles accurately. Above about five categories, use a bar chart. People judge lengths far better than angles."
          },
          {
            "k": "steps",
            "v": "Before you show it to anyone:|Give it a real title — Monthly spend by category, not Chart 1|Label the axes, with units|Add data labels if there are only a few bars|Delete the legend if there is only one series"
          },
          {
            "k": "tip",
            "v": "Select your data and press Alt then F1 to drop a chart onto the same sheet instantly. Press F11 instead and it goes onto its own sheet."
          }
        ]
      },
      {
        "t": "PivotTables",
        "m": 11,
        "b": [
          {
            "k": "p",
            "v": "A PivotTable summarises a long list without you writing a single formula. Give it a thousand rows of sales and it tells you the total per city, per month, per person — and you can change the question by dragging."
          },
          {
            "k": "sheet",
            "v": {
              "cap": "The kind of list a pivot is built for",
              "rows": [
                [
                  "Date",
                  "City",
                  "Salesperson",
                  "Amount"
                ],
                [
                  "01/08",
                  "Lahore",
                  "Ayesha",
                  "12500"
                ],
                [
                  "01/08",
                  "Karachi",
                  "Bilal",
                  "8900"
                ],
                [
                  "02/08",
                  "Lahore",
                  "Ayesha",
                  "15200"
                ],
                [
                  "02/08",
                  "Islamabad",
                  "Hina",
                  "7400"
                ],
                [
                  "03/08",
                  "Lahore",
                  "Bilal",
                  "9100"
                ],
                [
                  "03/08",
                  "Karachi",
                  "Hina",
                  "11300"
                ]
              ],
              "hdr": true
            }
          },
          {
            "k": "steps",
            "v": "Build one:|Click any cell inside the data|Insert tab, PivotTable, then OK|A panel opens on the right with your column names|Drag City into Rows|Drag Amount into Values"
          },
          {
            "k": "p",
            "v": "You now have the total per city. Drag Salesperson into Columns and you get a full cross-tab — every city against every salesperson — in about four seconds. Doing that with formulas would take twenty minutes and break the moment new rows arrive."
          },
          {
            "k": "p",
            "v": "By default Values uses Sum. Click the item in the Values box, choose Value Field Settings, and you can switch it to Count, Average, Max or Min."
          },
          {
            "k": "warn",
            "v": "Pivots do not refresh by themselves. When the source data changes, right-click the pivot and choose Refresh, or your report quietly shows last week's numbers."
          },
          {
            "k": "tip",
            "v": "Turn your source into a Table with Ctrl+T before building the pivot. New rows then get included automatically on refresh, instead of you having to redefine the range every time."
          }
        ]
      }
    ]
  },
  {
    "id": "powerpoint",
    "name": "Microsoft PowerPoint",
    "icon": "📽️",
    "accent": "#B7472A",
    "blurb": "Build slides people actually follow — for class, for work, and for pitching an idea.",
    "lessons": [
      {
        "t": "Slides and layouts",
        "m": 6,
        "b": [
          {
            "k": "p",
            "v": "A presentation is a stack of slides. The panel on the left shows them all in order; the big area in the middle is the slide you are editing."
          },
          {
            "k": "p",
            "v": "Every new slide comes with a layout — a ready-made arrangement of boxes. Using layouts instead of dragging text boxes around keeps everything lined up across slides."
          },
          {
            "k": "steps",
            "v": "To add a slide:|Go to the Home tab|Click the arrow under New Slide|Pick a layout — Title and Content covers most cases|Click inside a box and type"
          },
          {
            "k": "tip",
            "v": "Drag slides up and down in the left panel to reorder them. To duplicate a slide, right-click it and choose Duplicate Slide — quicker than rebuilding a layout you liked."
          }
        ]
      },
      {
        "t": "Text that works on a slide",
        "m": 7,
        "b": [
          {
            "k": "p",
            "v": "The most common mistake in PowerPoint is treating a slide like a page. Slides are not documents. Anything you write will be read from the back of a room, in a few seconds, while you are also talking."
          },
          {
            "k": "steps",
            "v": "Practical limits:|One idea per slide|Six bullet points at most, and fewer is better|Six words per bullet where you can manage it|Never below 24 point font"
          },
          {
            "k": "warn",
            "v": "If you read your slides out loud word for word, the audience switches off — they can read faster than you can speak. Put the short version on the slide and say the rest."
          },
          {
            "k": "p",
            "v": "Use the Notes pane below the slide for what you plan to say. The audience never sees it, but you can see it in Presenter View while you present."
          },
          {
            "k": "tip",
            "v": "Write your slide titles as full statements. Quarterly sales rose 40% tells the audience something. Sales Update does not."
          }
        ]
      },
      {
        "t": "Images and shapes",
        "m": 7,
        "b": [
          {
            "k": "p",
            "v": "One clear image explains more than three bullet points. Insert them from the Insert tab, either from your computer or from Stock Images."
          },
          {
            "k": "steps",
            "v": "To place an image well:|Insert, then Pictures|Drag a corner handle to resize — never a side handle, that stretches the picture|Use the guides that appear as you drag to line it up|Right-click and choose Send to Back to put it behind text"
          },
          {
            "k": "warn",
            "v": "Only use images you have the right to use. Pulling a photo off Google Search and putting it in a commercial presentation can land you a copyright claim. Stock Images inside PowerPoint, and sites like Unsplash and Pexels, are safe."
          },
          {
            "k": "p",
            "v": "Shapes are useful for arrows, boxes and simple diagrams. Hold Shift while drawing to keep circles round and squares square."
          },
          {
            "k": "tip",
            "v": "Select several objects, then use Format, Align to line them up precisely. Eyeballing it never quite works, and the audience notices."
          }
        ]
      },
      {
        "t": "Themes and colour",
        "m": 6,
        "b": [
          {
            "k": "p",
            "v": "A theme sets fonts and colours across every slide at once. Choose one at the start from the Design tab and your deck stays consistent without any effort."
          },
          {
            "k": "p",
            "v": "Contrast is what matters most. Dark text on a light background, or light text on a dark background. Anything in between becomes unreadable on a projector, which washes colours out badly."
          },
          {
            "k": "steps",
            "v": "A simple, safe scheme:|One dark colour for text|One light colour for the background|One accent colour for emphasis|That is all — three colours is plenty"
          },
          {
            "k": "warn",
            "v": "Never put text directly on a busy photo. Either place a solid or semi-transparent shape behind the text, or crop the photo so the text sits over a plain area."
          },
          {
            "k": "tip",
            "v": "Design, then Format Background lets you set the same background across all slides in one go."
          }
        ]
      },
      {
        "t": "Transitions and animation",
        "m": 6,
        "b": [
          {
            "k": "p",
            "v": "Transitions control how one slide gives way to the next. Animations control how items appear within a slide. Both are easy to overuse, and overuse is what makes a deck look amateur."
          },
          {
            "k": "steps",
            "v": "If you use them at all:|Pick one transition and apply it to every slide — Fade or Morph|Set the duration to around half a second|Use Appear or Fade for animations, nothing that spins or bounces"
          },
          {
            "k": "p",
            "v": "There is one genuinely useful case for animation: revealing bullet points one at a time so the audience listens to the current point instead of reading ahead. Select the text box, go to Animations, choose Appear, then set Start to On Click."
          },
          {
            "k": "warn",
            "v": "Sound effects on transitions have no place in a professional presentation. Neither does text flying in from the side."
          }
        ]
      },
      {
        "t": "Presenting and exporting",
        "m": 7,
        "b": [
          {
            "k": "p",
            "v": "Press F5 to start from the first slide, or Shift+F5 to start from the slide you are on. Escape ends the show."
          },
          {
            "k": "key",
            "v": "F5=Start show|Shift+F5=From current slide|B=Blank the screen|N or Space=Next|P=Previous|Esc=End"
          },
          {
            "k": "p",
            "v": "B blanks the screen to black. It is the most underused key in PowerPoint — when you want the room looking at you rather than the slide, press it."
          },
          {
            "k": "steps",
            "v": "Before you present:|Run through the whole deck once in slideshow mode|Check every slide on the actual projector if you can — colours look different|Have a PDF copy as a backup on a USB drive|Note the time; roughly one to two minutes per slide"
          },
          {
            "k": "tip",
            "v": "Presenter View shows your notes and the next slide on your laptop while the audience sees only the slide. Turn it on from the Slide Show tab, and tick Use Presenter View."
          }
        ]
      }
    ]
  },
  {
    "id": "vba",
    "name": "Excel VBA & Macros",
    "icon": "⚙️",
    "accent": "#0F766E",
    "blurb": "Automate the boring parts of Excel. Record your first macro, then learn to read and write the code yourself.",
    "lessons": [
      {
        "t": "What VBA is, and when to use it",
        "m": 8,
        "b": [
          {
            "k": "p",
            "v": "VBA stands for Visual Basic for Applications. It is a programming language built into Excel that lets you tell Excel to do things by itself — the same twelve clicks you do every Monday morning, done in one."
          },
          {
            "k": "p",
            "v": "A macro is simply a saved set of VBA instructions. When you run the macro, Excel carries out those instructions in order."
          },
          {
            "k": "steps",
            "v": "VBA is worth it when:|You repeat the same steps on a schedule — daily, weekly, monthly|You reformat data that arrives in the same messy shape every time|You need a button that non-technical colleagues can press|A task takes long enough to be annoying but is too fiddly for formulas"
          },
          {
            "k": "warn",
            "v": "VBA is not worth it for a one-off job. If you will do something once, do it by hand. Writing and debugging a macro takes longer than most single tasks."
          },
          {
            "k": "p",
            "v": "One important limitation to know upfront: VBA does not exist in Excel on the web, and support on Mac is partial. Macros are a Windows desktop Excel feature. If your workbook needs to run in a browser, formulas or Power Query are the better path."
          },
          {
            "k": "warn",
            "v": "Macros can do anything your user account can do, including deleting files. That is why Excel blocks them by default, and why you must never enable macros in a workbook that arrived by email from someone you do not know. Macro-borne malware is still common."
          }
        ]
      },
      {
        "t": "Setting up: the Developer tab and .xlsm",
        "m": 8,
        "b": [
          {
            "k": "p",
            "v": "The Developer tab is hidden until you ask for it. Everything to do with macros lives there."
          },
          {
            "k": "steps",
            "v": "Turn it on:|File, then Options|Choose Customize Ribbon on the left|In the right-hand list, tick Developer|Click OK — the Developer tab now appears on the Ribbon"
          },
          {
            "k": "p",
            "v": "Next, the file format. A normal .xlsx file cannot store macros at all — Excel will strip them out on save and warn you as it does. Macro-enabled workbooks use the .xlsm extension."
          },
          {
            "k": "steps",
            "v": "Save correctly:|File, then Save As|In the file type dropdown, choose Excel Macro-Enabled Workbook (*.xlsm)|Save"
          },
          {
            "k": "warn",
            "v": "Skip this and your work disappears. Excel does show a warning, but it is easy to click past, and the macros are gone the moment the file closes."
          },
          {
            "k": "p",
            "v": "Macro security lives under Developer, then Macro Security. The sensible setting is Disable all macros with notification — macros will not run automatically, but you get a yellow bar offering to enable them when you know the file is yours."
          },

  function t(k){ return (T[k] && T[k][lang]) || (T[k] && T[k].en) || k; }
  var done = {};   // "courseSlug:lessonKey" -> true
  var me = null;   // signed-in user, or null
  var view = { page:"home", c:null, l:0 };

  /* ---- the address bar ----

     The page used to leave the URL alone, so a lesson could not be
     linked, a refresh lost your place, and Back left the site. The
     address now says what you are looking at. */

  function urlFor(v){
    if (!v || v.page === "home") return "/academy/";
    if (v.page === "certs") return "/academy/?v=certs";
    if (v.page === "board") return "/academy/?v=board";
    // Without this the address gets rewritten to /academy/ and the
    // queue is lost on the next read.
    if (v.page === "vqueue") return "/academy/?v=vqueue";
    if (v.page === "badges") return "/academy/?v=badges";
    if (!v.c) return "/academy/";
    var u = "/academy/?c=" + encodeURIComponent(v.c);
    if (v.page === "quiz") return u + "&v=quiz";
    if (v.page === "lesson") return u + "&l=" + v.l;
    return u;
  }

  /* push adds a step to history, replace does not. Moving between
     lessons should be undoable with Back; a redraw of the same place
     should not pile up entries. */
  function syncUrl(push){
    var want = urlFor(view);
    if (location.pathname + location.search === want) return;
    try {
      if (push) history.pushState({v: view.page, c: view.c, l: view.l}, "", want);
      else history.replaceState({v: view.page, c: view.c, l: view.l}, "", want);
    } catch (e) {}
  }

  /* Read the address on the way in, so a shared link or a pinned
     shortcut opens the right thing. */
  function viewFromUrl(){
    var q = {};
    location.search.replace(/^\?/, "").split("&").forEach(function(pair){
      if (!pair) return;
      var bits = pair.split("=");
      q[decodeURIComponent(bits[0])] = decodeURIComponent(bits[1] || "");
    });

    if (q.v === "certs") return {page:"certs", c:null, l:0};
    if (q.v === "board") return {page:"board", c:null, l:0};
    // The video queue. Nothing links to it - moderators type the
    // address, so there is no point advertising it in the menu.
    if (q.v === "vqueue") return {page:"vqueue", c:null, l:0};
    if (q.v === "badges") return {page:"badges", c:null, l:0};
    if (!q.c) return {page:"home", c:null, l:0};
    if (!courseById(q.c)) return {page:"home", c:null, l:0};
    if (q.v === "quiz") return {page:"quiz", c:q.c, l:0};
    if (q.l !== undefined && q.l !== ""){
      var n2 = parseInt(q.l, 10);
      if (!isNaN(n2) && n2 >= 0) return {page:"lesson", c:q.c, l:n2};
    }
    return {page:"course", c:q.c, l:0};
  }

  /**
   * Must match slugify in seed_academy.py exactly, or progress saved by the
   * server would come back under keys the frontend does not recognise.
   */
  function slugify(t){
    return t.toLowerCase().replace(/[^a-z0-9]+/g, "-")
            .replace(/^-+|-+$/g, "").slice(0, 60);
  }

  function buildKeys(){
    COURSES.forEach(function(c){
      var seen = {};
      c.lessons.forEach(function(l){
        var k = slugify(l.t), base = k, n = 2;
        while (seen[k]) { k = base + "-" + n; n++; }
        seen[k] = true;
        l.key = k;
      });
    });
  }
  buildKeys();

    for (var i=0;i<COURSES.length;i++) if (COURSES[i].id===id) return COURSES[i];

  function totalLessons(){
    return COURSES.reduce(function(a, c){
      // A remote course has no lessons until it loads, so fall back to the
      // count we know it has rather than showing zero on the front page.
      return a + (c.lessons.length || c.knownLessons || 0);

  function courseCard(c){
    var total = courseCount(c);
    var d = countDone(c);
    var pct = (c.lessons.length && total) ? Math.round(d / total * 100) : 0;
    var cert = certs.filter(function(x){ return x.course === c.id; })[0];

    return '<article class="ccard" style="--a:' + c.accent + '" '
      + 'data-course="' + c.id + '">'
      + (cert ? '<span class="seal">&#127894;</span>' : '')
      + '<span class="ic">' + c.icon + '</span>'
      + '<div class="nm">' + esc(cname(c)) + '</div>'
      + '<div class="meta">' + total + " " + esc(t("lessons2"))
      + " &middot; " + courseMinutes(c) + " " + esc(t("min")) + '</div>'
      + (d > 0
          ? '<div class="prog"><span class="bar"><i style="width:' + pct
            + '%"></i></span><span class="pc">' + pct + '%</span></div>'
          : '<div class="prog empty"></div>')
      + '</article>';
  }

  function courseGroups(){
    var seen = {}, h = "";

    COURSE_GROUPS.forEach(function(g){
      var list = [];
      g.ids.forEach(function(id){

      if (!list.length) return;
      h += '<div class="ghead"><h3>' + esc(g.t) + '</h3>'
        + '<span class="gn">' + list.length + '</span></div>'
        + '<div class="cgrid">'
        + list.map(courseCard).join("")
        + '</div>';
    });

    // Whatever was not in a group. Better an odd heading than a course

    var rest = COURSES.filter(function(c){ return !seen[c.id]; });
    if (rest.length){
      h += '<div class="ghead"><h3>More</h3>'
        + '<span class="gn">' + rest.length + '</span></div>'
        + '<div class="cgrid">' + rest.map(courseCard).join("") + '</div>';

    h += courseGroups();

    h += '<div class="head"><h3>' + esc(t("hHow")) + '</h3></div><div class="steps">'
      + '<div class="step"><span class="n">1</span><h4>' + esc(t("w1t")) + '</h4>'
      + '<p>' + esc(t("w1d")) + '</p></div>'
      + '<div class="step"><span class="n">2</span><h4>' + esc(t("w2t")) + '</h4>'
      + '<p>' + esc(t("w2d")) + '</p></div>'
      + '<div class="step"><span class="n">3</span><h4>' + esc(t("w3t")) + '</h4>'
      + '<p>' + esc(t("w3d")) + '</p></div></div>'
      + '<div style="text-align:center;margin:22px 0 10px">'
      + '<a href="https://xpertcreation.com/verify" target="_blank" rel="noopener" '
      + 'style="font-size:13.5px;font-weight:700;color:var(--brand)">'
      + 'Check a certificate &rarr;</a></div>'
      + '<p style="text-align:center;font-size:12px;color:var(--ink-soft);'
      + 'line-height:1.6;margin-bottom:28px">' + esc(t("note")) + '</p>';

    return h;
  }

  function sectionsFor(c){
    var raw = (SECTIONS[c.id] || [{ at: 0, t: { en: "" } }])
      .filter(function(sec){ return sec.at < c.lessons.length; });
    if (!raw.length) raw = [{ at: 0, t: { en: "" } }];
    return raw.map(function(sec, i){
      var next = raw[i+1] ? raw[i+1].at : c.lessons.length;
      return { title: sec.key ? t(sec.key) : (sec.t[lang] || sec.t.en),
               from: sec.at, to: Math.min(next, c.lessons.length) };
    });
  }

  var openSections = {};

  function curriculum(c, currentIndex){
    var h = "";
    sectionsFor(c).forEach(function(sec, si){
      var key = c.id + ":" + si;
      // Open the section you are reading; on the landing page open the first
      // one only, so the whole curriculum is scannable without scrolling past
      // every lesson in the course.
      var isOpen = openSections[key] !== undefined
        ? openSections[key]
        : (currentIndex != null
            ? (currentIndex >= sec.from && currentIndex < sec.to)
            : si === 0);

      var total = sec.to - sec.from, doneN = 0, mins = 0;
      for (var i = sec.from; i < sec.to; i++){
        if (done[lkey(c,i)]) doneN++;
        mins += c.lessons[i].m;
      }

      h += '<div class="sect' + (isOpen ? " open" : "") + '">'
        + '<div class="sh" data-sect="' + si + '">'
        + '<span class="cv">&#9656;</span><b>' + esc(sec.title) + '</b>'
        + '<small>' + doneN + "/" + total + " &middot; " + mins + " " + esc(t("min")) + '</small></div>'
        + '<div class="sb">';

      for (var j = sec.from; j < sec.to; j++){
        var ok = done[lkey(c,j)];
        h += '<div class="lrow' + (ok ? " ok" : "") + (j === currentIndex ? " now" : "") + '" data-lesson="' + j + '">'
          + '<span class="tick">&#10003;</span>'
          + '<span class="t">' + esc(lessonTitle(c, j)) + '</span>'
          + '<small>' + c.lessons[j].m + " " + esc(t("min")) + '</small></div>';
      }
      h += '</div></div>';
    });
    return h;
  }

  function nextUndone(c){
    for (var i = 0; i < c.lessons.length; i++) if (!done[lkey(c,i)]) return i;
    return 0;
  }

  function renderCourse(c){
    var d = countDone(c), total = c.lessons.length;
    var pct = total ? Math.round(d/total*100) : 0;
    var NEED = 80;
    var resume = nextUndone(c);

    var h = '<div class="crumb"><button data-nav="home">&larr; ' + esc(t("back")) + '</button></div>'
      + '<section class="chero" style="--accent:' + c.accent + '">'
      + '<div class="ic">' + c.icon + '</div>'
      + '<h2>' + esc(cname(c)) + '</h2>'
      + '<p class="blurb">' + esc(cblurb(c)) + '</p>'
      + '<div class="facts"><span>' + total + " " + esc(t("lessons2")) + '</span>'
      + '<span>' + mins(c) + " " + esc(t("min")) + '</span>'
      + '<span>' + sectionsFor(c).length + " " + esc(t("secs")) + '</span></div>';

    if (d > 0){
      h += '<div class="pwrap"><div class="track"><i style="width:' + pct + '%"></i></div>'
        + '<span class="lbl">' + pct + "% " + esc(t("prog")) + " &middot; " + d + "/" + total + '</span></div>';
    }

    h += '<button class="cta" data-lesson="' + resume + '">'
      + esc(d > 0 ? t("continue") : t("startCourse")) + ' &rarr;</button>'
      + '</section>'
      + '<div class="head"><h3>' + esc(t("curriculum")) + '</h3></div>'
      + '<div class="llist">' + curriculum(c, null) + '</div>';

    h += '<div class="lesson" style="--accent:' + c.accent + '">';
    if (!me){
      h += '<div class="lockmsg">' + esc(t("saveHint")) + '</div>'
        + '<button class="primary" data-act="signin">' + esc(t("signIn")) + '</button>';
    } else if (pct >= NEED){
      h += '<button class="primary" data-act="quiz">' + esc(t("quizBtn")) + '</button>';
    } else {
      h += '<div class="lockmsg">' + esc(t("quizLock").replace("%d%%", NEED + "%").replace("%d", NEED)) + '</div>';
    }
    h += '</div>';
    h += videoSection(c);
    return h;
  }

  /* ================= community videos =================

     People who have finished a course can add a link to something that
     helped them. A moderator decides whether it goes up.

     Only the thumbnail loads at first. Thirty embedded players on one
     page would make it crawl, so the real player appears when tapped. */

  var vidCache = {};        // course id -> list, so leaving and coming
                            // back does not fetch again
  var vidOpen = {};         // which ones have been expanded

  function videoSection(c){
    // Drawn empty, then filled when the fetch lands. Waiting for the
    // network before showing the course would be worse.
    setTimeout(function(){ loadVideos(c.id); }, 30);
    return '<div class="head vhead"><h3>Videos from learners</h3>'
      + (me ? '<button class="vadd" data-vadd="' + esc(c.id) + '">Add one</button>' : '')
      + '</div>'
      + '<div class="vwrap" id="vwrap-' + esc(c.id) + '">'
      + '<div class="vdim">Looking\u2026</div></div>';
  }

  function loadVideos(courseId, force){
    var box = document.getElementById("vwrap-" + courseId);
    if (!box) return;

    if (!force && vidCache[courseId]){
      paintVideos(courseId, vidCache[courseId]);
      return;
    }

    api("/academy/videos/?course=" + encodeURIComponent(courseId))
      .then(function(r){
        if (!r.ok) throw new Error("no");
        vidCache[courseId] = r.data.videos || [];
        paintVideos(courseId, vidCache[courseId]);
      })
      .catch(function(){
        var b = document.getElementById("vwrap-" + courseId);
        if (b) b.innerHTML = '<div class="vdim">Could not load these.</div>';
      });
  }

  function paintVideos(courseId, list){
    var box = document.getElementById("vwrap-" + courseId);
    if (!box) return;

    if (!list.length){
      box.innerHTML = '<div class="vdim">Nothing here yet.'
        + (me ? ' Be the first to add something.' : '') + '</div>';
      return;
    }

    box.innerHTML = list.map(function(v){
      var open = vidOpen[v.id];
      var mine = me && v.author_id === me.id;

      var media = open
        ? '<div class="vplay"><iframe src="' + esc(v.embed)
          + '?rel=0" title="' + esc(v.title) + '" loading="lazy" '
          + 'allow="accelerometer; encrypted-media; picture-in-picture" '
          + 'referrerpolicy="strict-origin-when-cross-origin" '
          + 'allowfullscreen></iframe></div>'
        : '<button class="vthumb" data-vplay="' + v.id + '"'
          + (v.thumb ? ' style="background-image:url(' + esc(v.thumb) + ')"' : '')
          + '><span class="vgo">\u25b6</span></button>';

      return '<div class="vcard" data-vid="' + v.id + '">'
        + media
        + '<div class="vbody">'
        + '<b class="vtitle">' + esc(v.title) + '</b>'
        + (v.note ? '<p class="vnote">' + esc(v.note) + '</p>' : '')
        + '<div class="vfoot">'
        + '<span class="vby">' + esc(v.author) + '</span>'
        + (v.author_role ? '<span class="vrole">' + v.author_role.icon + ' '
            + esc(v.author_role.title) + '</span>' : '')
        + '<span class="vsp"></span>'
        + (mine
            ? '<span class="vdim2">your own</span>'
            : '<button class="vvote' + (v.my_vote === 1 ? " on" : "") + '" '
              + 'data-vvote="' + v.id + '" data-val="1">\u25b3 ' + v.up + '</button>'
              + '<button class="vvote' + (v.my_vote === -1 ? " on bad" : "") + '" '
              + 'data-vvote="' + v.id + '" data-val="-1">\u25bd ' + v.down + '</button>')
        + '</div></div></div>';
    }).join("");
  }

  /* ---- adding one ---- */

  function videoForm(courseId){
    var wrap = document.getElementById("vwrap-" + courseId);
    if (!wrap) return;
    if (document.getElementById("vform")) return;

    var d = document.createElement("div");
    d.className = "vform";
    d.id = "vform";
    d.innerHTML = '<b>Add a video to this course</b>'
      + '<p class="vdim">A YouTube or Vimeo link. A moderator will look '
      + 'at it before it appears.</p>'
      + '<input id="vfUrl" placeholder="https://youtube.com/watch?v=..." '
      + 'autocomplete="off" spellcheck="false">'
      + '<input id="vfTitle" placeholder="What is it called?" maxlength="140">'
      + '<textarea id="vfNote" rows="2" maxlength="600" '
      + 'placeholder="What does it cover? (optional)"></textarea>'
      + '<div class="vfmsg" id="vfMsg"></div>'
      + '<div class="vfrow">'
      + '<button class="vfcancel" data-vcancel>Cancel</button>'
      + '<button class="vfgo" data-vsend="' + esc(courseId) + '">Send it</button>'
      + '</div>';
    wrap.parentNode.insertBefore(d, wrap);
    var u = document.getElementById("vfUrl");
    if (u) u.focus();
  }

  function sendVideo(courseId){
    var msg = document.getElementById("vfMsg");
    var btn = document.querySelector("[data-vsend]");
    var url = (document.getElementById("vfUrl") || {}).value || "";
    var title = (document.getElementById("vfTitle") || {}).value || "";
    var note = (document.getElementById("vfNote") || {}).value || "";

    if (!url.trim()){ msg.textContent = "Paste the link first."; msg.className = "vfmsg bad"; return; }
    if (title.trim().length < 6){ msg.textContent = "Give it a title."; msg.className = "vfmsg bad"; return; }

    if (btn) btn.disabled = true;
    msg.textContent = "Sending\u2026";
    msg.className = "vfmsg";

    api("/academy/videos/add/", {method: "POST", body: {
      course: courseId, url: url, title: title, note: note
    }}).then(function(r){
      if (btn) btn.disabled = false;
      if (!r.ok){
        msg.textContent = r.data.detail || "That did not work.";
        msg.className = "vfmsg bad";
        return;
      }
      var f = document.getElementById("vform");
      if (f) f.innerHTML = '<b>Thank you</b><p class="vdim">'
        + esc(r.data.detail || "A moderator will look at it shortly.")
        + '</p><div class="vfrow"><button class="vfcancel" data-vcancel>Close</button></div>';
    });
  }

  /* ---- voting ---- */

  function voteVideo(id, val){
    var card = document.querySelector('[data-vid="' + id + '"]');
    var v = null;
    for (var k in vidCache){
      (vidCache[k] || []).forEach(function(x){ if (x.id === id) v = x; });
    }
    if (!v) return;

    // Pressing the same one again takes the vote back
    var send = (v.my_vote === val) ? 0 : val;

    api("/academy/videos/" + id + "/vote/", {method: "POST", body: {value: send}})
      .then(function(r){
        if (!r.ok) return;
        v.up = r.data.up;
        v.down = r.data.down;
        v.my_vote = r.data.my_vote;
        var course = null;
        for (var k2 in vidCache){
          if ((vidCache[k2] || []).indexOf(v) !== -1) course = k2;
        }
        if (course) paintVideos(course, vidCache[course]);
      });
  }

  /* ---- the moderation queue ---- */

  function renderVideoQueue(){
    setTimeout(loadVideoQueue, 30);
    return '<div class="crumb"><button data-nav="home">&larr; '
      + esc(t("back")) + '</button></div>'
      + '<div class="head"><h3>Videos waiting</h3></div>'
      + '<div class="vwrap" id="vqueue"><div class="vdim">Looking\u2026</div></div>';
  }

  function loadVideoQueue(){
    api("/academy/videos/queue/").then(function(r){
      var box = document.getElementById("vqueue");
      if (!box) return;
      if (!r.ok){
        box.innerHTML = '<div class="vdim">' + esc(r.data.detail || "Not allowed.") + '</div>';
        return;
      }
      var list = r.data.videos || [];
      if (!list.length){
        box.innerHTML = '<div class="vdim">Nothing waiting.</div>';
        return;
      }
      box.innerHTML = list.map(function(v){
        return '<div class="vcard vq" data-vid="' + v.id + '">'
          + '<button class="vthumb" data-vqplay="' + esc(v.embed) + '"'
          + (v.thumb ? ' style="background-image:url(' + esc(v.thumb) + ')"' : '')
          + '><span class="vgo">\u25b6</span></button>'
          + '<div class="vbody">'
          + '<b class="vtitle">' + esc(v.title) + '</b>'
          + '<p class="vnote">' + esc(v.note || "") + '</p>'
          + '<p class="vdim">' + esc(v.course) + ' \u00b7 by ' + esc(v.author)
          + ' \u00b7 <a href="' + esc(v.watch) + '" target="_blank" '
          + 'rel="noopener">watch it</a></p>'
          + '<div class="vfrow">'
          + '<button class="vfcancel" data-vno="' + v.id + '">Turn down</button>'
          + '<button class="vfgo" data-vyes="' + v.id + '">Publish</button>'
          + '</div></div></div>';
      }).join("");
    });
  }

  function decideVideo(id, action){
    api("/academy/videos/" + id + "/decide/", {method: "POST",
        body: {action: action}}).then(function(r){
      if (!r.ok) return;
      var card = document.querySelector('.vq[data-vid="' + id + '"]');
      if (card) card.remove();
      vidCache = {};   // a published one changes a course list
      var box = document.getElementById("vqueue");
      if (box && !box.querySelector(".vq")){
        box.innerHTML = '<div class="vdim">Nothing waiting.</div>';
      }
    });
  }

  document.addEventListener("click", function(e){
    if (!e.target.closest) return;

    var play = e.target.closest("[data-vplay]");
    if (play){
      var pid = parseInt(play.getAttribute("data-vplay"), 10);
      vidOpen[pid] = true;
      for (var k in vidCache){
        if ((vidCache[k] || []).some(function(x){ return x.id === pid; })){
          paintVideos(k, vidCache[k]);
          api("/academy/videos/" + pid + "/seen/", {method: "POST"});
        }
      }
      return;
    }

    var vv = e.target.closest("[data-vvote]");
    if (vv){
      if (!me){ openAuth("signin"); return; }
      voteVideo(parseInt(vv.getAttribute("data-vvote"), 10),
                parseInt(vv.getAttribute("data-val"), 10));
      return;
    }

    var add = e.target.closest("[data-vadd]");
    if (add){ videoForm(add.getAttribute("data-vadd")); return; }

    if (e.target.closest("[data-vcancel]")){
      var f = document.getElementById("vform");
      if (f) f.remove();
      return;
    }

    var send = e.target.closest("[data-vsend]");
    if (send){ sendVideo(send.getAttribute("data-vsend")); return; }

    var yes = e.target.closest("[data-vyes]");
    if (yes){ decideVideo(parseInt(yes.getAttribute("data-vyes"), 10), "live"); return; }

    var no = e.target.closest("[data-vno]");
    if (no){ decideVideo(parseInt(no.getAttribute("data-vno"), 10), "rejected"); return; }
  });

  /* In the queue a thumbnail becomes the player when tapped, so a
     moderator watches the video instead of judging it by its title. */
  document.addEventListener("click", function(e){
    var b = e.target.closest ? e.target.closest("[data-vqplay]") : null;
    if (!b) return;
    var d = document.createElement("div");
    d.className = "vplay";
    d.innerHTML = '<iframe src="' + esc(b.getAttribute("data-vqplay"))
      + '?rel=0" loading="lazy" allowfullscreen '
      + 'allow="accelerometer; encrypted-media; picture-in-picture" '
      + 'referrerpolicy="strict-origin-when-cross-origin"></iframe>';
    b.replaceWith(d);
  });

  /* ================= the review gate =================

     A passed quiz makes the certificate at once, but its number stays
     hidden until the learner says how the course was. Stars are all that
     is needed; the rest is optional. Afterwards comes a plain invitation
     to rate the app and share - asked, never required. */

  var PLAY_URL = "https://play.google.com/store/apps/details?id=com.xpertcreation.app";

  function certUrl(serial){
    return "https://xpertcreation.com/certificate/" + serial + "/";
  }

  function reviewForm(slug){
    var stars = "";
    for (var i = 1; i <= 5; i++){
      stars += '<button type="button" data-rvstar="' + i + '" aria-label="' + i
        + ' stars">\u2605</button>';
    }
    function seg(group, labels){
      return '<div class="rvseg" data-rvgroup="' + group + '">'
        + labels.map(function(l, i){
            return '<button type="button" data-rvval="' + (i + 1) + '">' + l + '</button>';
          }).join("") + '</div>';
    }
    return '<div class="rvbox" data-rvcourse="' + esc(slug) + '">'
      + '<b class="rvh">One last step</b>'
      + '<p class="rvp">Tell us how the course was and your certificate opens '
      + 'straight after. Stars are enough \u2014 the rest is optional.</p>'
      + '<div class="rvstars">' + stars + '</div>'
      + '<p class="rvq">Was it clear?</p>'
      + seg("clarity", ["Hard to follow", "Mostly", "Very clear"])
      + '<p class="rvq">The pace?</p>'
      + seg("pace", ["Too slow", "About right", "Too fast"])
      + '<textarea class="rvtext" maxlength="600" '
      + 'placeholder="Anything you would add or change? (optional)"></textarea>'
      + '<div class="rvmsg"></div>'
      + '<button type="button" class="cta rvsend">Open my certificate &rarr;</button>'
      + '</div>';
  }

  function certDone(serial){
    var u = certUrl(serial);
    var wa = "I just earned a certificate from XpertAcademy: " + u;
    return '<a class="cta" href="/certificate/' + esc(serial) + '/" target="_blank" '
      + 'rel="noopener">' + esc(t("viewCert")) + ' &rarr;</a>'
      + '<div class="invite"><b>Enjoyed it? A small favour</b>'
      + '<p>They help more people find free courses like this one.</p>'
      + '<div class="invrow">'
      + '<a href="' + PLAY_URL + '" target="_blank" rel="noopener">\u2b50 Rate the app</a>'
      + '<a href="https://www.facebook.com/sharer/sharer.php?u=' + encodeURIComponent(u)
      + '" target="_blank" rel="noopener">Share on Facebook</a>'
      + '<a href="https://wa.me/?text=' + encodeURIComponent(wa)
      + '" target="_blank" rel="noopener">WhatsApp</a>'
      + '<a href="https://www.facebook.com/groups/1202505063279206" '
      + 'target="_blank" rel="noopener">\ud83d\udc65 Join our group</a>'
      + '</div></div>';
  }

  function openReviewSheet(slug){
    var d = document.createElement("div");
    d.className = "rvover";
    d.innerHTML = reviewForm(slug);
    d.addEventListener("click", function(e){ if (e.target === d) d.remove(); });
    document.body.appendChild(d);
  }

  function sendReview(box){
    var slug = box.getAttribute("data-rvcourse");
    var stars = parseInt(box.getAttribute("data-stars") || "0", 10);
    var msg = box.querySelector(".rvmsg");
    if (!stars){ msg.textContent = "Pick a number of stars first."; return; }

    function pick(group){
      var b = box.querySelector('[data-rvgroup="' + group + '"] .on');
      return b ? parseInt(b.getAttribute("data-rvval"), 10) : null;
    }

    var btn = box.querySelector(".rvsend");
    btn.disabled = true;
    msg.textContent = "";

    api("/academy/review/", {method: "POST", body: {
      course: slug, stars: stars, clarity: pick("clarity"), pace: pick("pace"),
      comment: (box.querySelector(".rvtext").value || "").trim()
    }}).then(function(r){
      btn.disabled = false;
      if (!r.ok){
        msg.textContent = (r.data && r.data.detail) || "That did not go through. Try again.";
        return;
      }
      var serial = r.data.serial;
      certs.forEach(function(c){
        if (c.course === slug){ c.serial = serial; c.review_needed = false; }
      });
      if (quiz && quiz.result){
        quiz.result.certificate_serial = serial;
        quiz.result.review_needed = false;
      }
      var done = document.createElement("div");
      done.className = "rvbox";
      done.innerHTML = '<b class="rvh">Thank you</b>'
        + (r.data.comment_pending
            ? '<p class="rvp">Your stars are up. What you wrote appears once a '
              + 'moderator has read it.</p>'
            : '')
        + certDone(serial);
      var over = box.closest(".rvover");
      box.replaceWith(done);
      if (over && view.page === "certs"){
        var app = document.getElementById("app");
        if (app) app.innerHTML = renderCerts();
      }
    });
  }

  document.addEventListener("click", function(e){
    if (!e.target.closest) return;
    var s = e.target.closest("[data-rvstar]");
    if (s){
      var box = s.closest(".rvbox");
      var n = parseInt(s.getAttribute("data-rvstar"), 10);
      box.setAttribute("data-stars", n);
      box.querySelectorAll("[data-rvstar]").forEach(function(b){
        b.classList.toggle("on", parseInt(b.getAttribute("data-rvstar"), 10) <= n);
      });
      return;
    }
    var v = e.target.closest("[data-rvval]");
    if (v){
      v.parentNode.querySelectorAll("[data-rvval]").forEach(function(b){
        b.classList.toggle("on", b === v);
      });
      return;
    }
    var go = e.target.closest(".rvsend");
    if (go){ sendReview(go.closest(".rvbox")); return; }
    var o = e.target.closest("[data-rvopen]");
    if (o){ openReviewSheet(o.getAttribute("data-rvopen")); return; }
  });

  /* ================= roles and medals =================

     Seven medals, each growing bronze, silver, gold, diamond, and one
     role on top. Every number is something the person did. */

  var badgeData = null, badgeLoading = false;

  var TIER_FILL = {
    bronze:  ["#F4BE8E", "#A35D2D", "Bronze"],
    silver:  ["#F5F7FB", "#97A2B2", "Silver"],
    gold:    ["#FFE590", "#C98A0A", "Gold"],
    diamond: ["#CCF7FF", "#5A78FF", "Diamond"]
  };

  function medal(f, i){
    var c = f.tier ? TIER_FILL[f.tier] : ["#F1F3F7", "#CDD3DD", ""];
    var id = "mg" + i;
    return '<svg class="medal' + (f.tier ? "" : " off") + '" viewBox="0 0 100 112" aria-hidden="true">'
      + '<defs><linearGradient id="' + id + '" x1="0" y1="0" x2="1" y2="1">'
      + '<stop offset="0" stop-color="' + c[0] + '"/>'
      + '<stop offset="1" stop-color="' + c[1] + '"/></linearGradient></defs>'

  function colLetter(n){
    var s = "";
    while (n >= 0){ s = String.fromCharCode(65 + (n % 26)) + s; n = Math.floor(n / 26) - 1; }
    return s;
  }

  function renderSheet(d){
    var rows = d.rows || [];
    var wide = 0;
    rows.forEach(function(r){ if (r.length > wide) wide = r.length; });

    var h = '<div class="sheet">';
    if (d.cap) h += '<p class="cap">' + esc(d.cap) + '</p>';
    h += '<div class="scroll"><table><tr><th class="colh"></th>';
    for (var c = 0; c < wide; c++) h += '<th class="colh">' + colLetter(c) + '</th>';
    h += '</tr>';

    rows.forEach(function(r, ri){
      var isHdr = d.hdr && ri === 0;
      h += '<tr' + (isHdr ? ' class="hdr"' : '') + '><td class="rowh">' + (ri + 1) + '</td>';
      for (var c = 0; c < wide; c++){
        var v = r[c] === undefined ? "" : String(r[c]);
        var cls = "";
        if (v.charAt(0) === "=") cls = "fx";
        else if (v !== "" && !isNaN(v) && !isHdr) cls = "num";
        h += '<td' + (cls ? ' class="' + cls + '"' : '') + '>' + esc(v) + '</td>';
      }
      h += '</tr>';
    });
    return h + '</table></div></div>';
  }

  var codeSeq = 0;

  /* ================= the code runner =================

     Reading code teaches less than changing it and seeing what breaks.
     This puts an editable box in the lesson with the answer beside it.

     Three languages, three machines:

       html    a sandboxed iframe
       js      a web worker, so a runaway loop can be killed
       python  Pyodide, fetched only when a Python lesson asks

     A block is written as:
         {"k":"run","v":"js\nconsole.log('hi')"}
     first line the language, the rest the starting code. */

  var runSeq = 0;
  var runners = {};          // id -> {lang, start, key}
  var pyodide = null;        // loaded once, then reused
  var pyLoading = null;

  function runnerFor(src, courseId, lessonIdx){
    var nl = src.indexOf("\n");
    var lang = (nl === -1 ? src : src.slice(0, nl)).trim().toLowerCase();
    var code = nl === -1 ? "" : src.slice(nl + 1);
    if (["html", "js", "javascript", "python", "py"].indexOf(lang) === -1){
      // Not a language we run - fall back to showing it, which is
      // better than swallowing the block
      return renderCode(src);
    }
    if (lang === "javascript") lang = "js";
    if (lang === "py") lang = "python";

    var id = "r" + (runSeq++);
    var key = "xc_run_" + courseId + "_" + lessonIdx + "_" + id;
    runners[id] = {lang: lang, start: code, key: key};

    // What they typed last time, if anything
    var saved = "";
    try { saved = localStorage.getItem(key) || ""; } catch (e) {}

    var label = lang === "html" ? "HTML" : lang === "js" ? "JavaScript" : "Python";

    return '<div class="runner" data-run-id="' + id + '">'
      + '<div class="rbar"><b>' + label + '</b>'
      + '<span class="rsp"></span>'
      + '<button class="rreset" type="button">Reset</button>'
      + '<button class="rgo" type="button">Run</button></div>'
      + '<textarea class="rcode" spellcheck="false" rows="'
      + Math.min(16, Math.max(4, (saved || code).split("\n").length + 1))
      + '">' + esc(saved || code) + '</textarea>'
      + '<div class="rout" hidden></div>'
      + '</div>';
  }

  /* Output goes through here so nothing a learner prints can put markup
     on the page. */
  function rprint(box, text, kind){
    var line = document.createElement("div");
    if (kind) line.className = kind;
    line.textContent = String(text);
    box.appendChild(line);
    box.scrollTop = box.scrollHeight;
  }

  function rclear(el){
    var box = el.querySelector(".rout");
    box.innerHTML = "";
    box.hidden = false;
    return box;
  }

  function rbusy(el, on, msg){
    var sp = el.querySelector(".rsp");
    sp.textContent = on ? (msg || "Running\u2026") : "";
    el.querySelector(".rgo").disabled = !!on;
  }

  /* ---- HTML: straight into a sandboxed frame ---- */
  function runHtml(el, code){
    var box = rclear(el);
    var f = document.createElement("iframe");
    f.className = "rframe";
    // No allow-same-origin: the frame cannot reach this page at all
    f.setAttribute("sandbox", "allow-scripts");
    f.srcdoc = code;
    box.appendChild(f);
  }

  /* ---- JavaScript: in a worker, with a hard stop ---- */
  function runJs(el, code){
    var box = rclear(el);
    var src = [
      "self.onmessage = function(e){",
      "  var out = [];",
      "  var say = function(){",
      "    var parts = [];",
      "    for (var i = 0; i < arguments.length; i++){",
      "      var a = arguments[i];",
      "      try {",
      "        parts.push(typeof a === 'object' && a !== null",
      "          ? JSON.stringify(a) : String(a));",
      "      } catch (err) { parts.push(String(a)); }",
      "    }",
      "    self.postMessage({t:'log', v: parts.join(' ')});",
      "  };",
      "  var console = {log: say, info: say, warn: say, error: say};",
      "  try {",
      "    (new Function('console', e.data))(console);",
      "    self.postMessage({t:'done'});",
      "  } catch (err) {",
      "    self.postMessage({t:'err', v: String(err)});",
      "  }",
      "};"
    ].join("\n");

    var w;
    try {
      w = new Worker(URL.createObjectURL(new Blob([src], {type:"text/javascript"})));
    } catch (e){
      rprint(box, "This browser will not run the sandbox.", "rerr");
      return;
    }

    rbusy(el, true);
    var lines = 0;
    // Three seconds is long for a lesson and short for a frozen tab.
    var killer = setTimeout(function(){
      w.terminate();
      rbusy(el, false);
      rprint(box, "Stopped after 3 seconds. Is there a loop with no end?",
             "rerr");
    }, 3000);

    w.onmessage = function(ev){
      var m = ev.data || {};
      if (m.t === "log"){
        if (++lines > 200){
          if (lines === 201) rprint(box, "\u2026too many lines, stopping here.",
                                    "rerr");
          return;
        }
        rprint(box, m.v);
      } else if (m.t === "err"){
        clearTimeout(killer);
        rbusy(el, false);
        rprint(box, m.v, "rerr");
        w.terminate();
      } else {
        clearTimeout(killer);
        rbusy(el, false);
        if (!lines) rprint(box, "Ran, but nothing was printed. Try console.log.",
                           "rdim");
        w.terminate();
      }
    };
    w.onerror = function(e){
      clearTimeout(killer);
      rbusy(el, false);
      rprint(box, e.message || "Something went wrong.", "rerr");
      w.terminate();
    };
    w.postMessage(code);
  }

  /* ---- Python: Pyodide, fetched the first time only ---- */
  function loadPyodide2(onProgress){
    if (pyodide) return Promise.resolve(pyodide);
    if (pyLoading) return pyLoading;

    onProgress("Fetching Python\u2026 (about 6 MB, once only)");
    pyLoading = new Promise(function(resolve, reject){
      var sc = document.createElement("script");
      sc.src = "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/pyodide.js";
      sc.onload = function(){
        onProgress("Starting Python\u2026");
        window.loadPyodide({
          indexURL: "https://cdn.jsdelivr.net/pyodide/v0.26.2/full/"
        }).then(function(p){
          pyodide = p;
          resolve(p);
        }).catch(reject);
      };
      sc.onerror = function(){
        reject(new Error("Could not fetch Python. Check the connection."));
      };
      document.head.appendChild(sc);
    });
    pyLoading.catch(function(){ pyLoading = null; });
    return pyLoading;
  }

  function runPython(el, code){
    var box = rclear(el);
    rbusy(el, true, "Loading\u2026");

    loadPyodide2(function(msg){ rbusy(el, true, msg); })
      .then(function(py){
        rbusy(el, true);
        // print() writes to stdout; catch it and put it in the box
        py.setStdout({batched: function(line){ rprint(box, line); }});
        py.setStderr({batched: function(line){ rprint(box, line, "rerr"); }});
        var before = box.childNodes.length;
        return py.runPythonAsync(code).then(function(){
          rbusy(el, false);
          if (box.childNodes.length === before){
            rprint(box, "Ran, but nothing was printed. Try print().", "rdim");
          }
        });
      })
      .catch(function(e){
        rbusy(el, false);
        var msg = String(e && e.message ? e.message : e);
        // Pyodide errors carry the whole traceback; the last line is
        // the part a learner needs
        var lines = msg.trim().split("\n");
        rprint(box, lines[lines.length - 1] || msg, "rerr");
        if (lines.length > 1){
          rprint(box, lines.slice(0, -1).join("\n"), "rdim");
        }
      });
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest(".runner") : null;
    if (!el) return;
    var id = el.getAttribute("data-run-id");
    var meta = runners[id];
    if (!meta) return;

    if (e.target.closest(".rreset")){
      el.querySelector(".rcode").value = meta.start;
      try { localStorage.removeItem(meta.key); } catch (err) {}
      var box = el.querySelector(".rout");
      box.innerHTML = "";
      box.hidden = true;
      return;
    }

    if (!e.target.closest(".rgo")) return;
    var code = el.querySelector(".rcode").value;
    try { localStorage.setItem(meta.key, code); } catch (err) {}

    if (meta.lang === "html") runHtml(el, code);
    else if (meta.lang === "js") runJs(el, code);
    else runPython(el, code);
  });

  document.addEventListener("keydown", function(e){
    // Ctrl+Enter runs, the way every editor does it
    if (!(e.ctrlKey || e.metaKey) || e.key !== "Enter") return;
    var ta = e.target;
    if (!ta || !ta.classList || !ta.classList.contains("rcode")) return;
    e.preventDefault();
    var el = ta.closest(".runner");
    var go = el && el.querySelector(".rgo");
    if (go) go.click();
  });

  document.addEventListener("input", function(e){
    var ta = e.target;
    if (!ta || !ta.classList || !ta.classList.contains("rcode")) return;
    var el = ta.closest(".runner");
    var meta = runners[el && el.getAttribute("data-run-id")];
    if (!meta) return;
    try { localStorage.setItem(meta.key, ta.value); } catch (err) {}
  });

  function renderCode(src){
    // Highlight comments, strings and keywords. Escape first, always.
    var out = esc(src)
      .replace(/^(\s*)('.*)$/gm, '$1<span class="cm">$2</span>')
      .replace(/&quot;([^&]*?)&quot;/g, '<span class="st">&quot;$1&quot;</span>')
      .replace(/\b(Sub|End|Dim|As|If|Then|ElseIf|Else|For|To|Next|Step|With|Set|Exit|On|Error|GoTo|Not|MsgBox|String|Long|Double|Worksheet|True|False)\b/g,
               '<span class="kw">$1</span>');
    var id = "c" + (codeSeq++);
    return '<div class="code"><div class="bar"><b>' + esc(t("vbacode")) + '</b>'
      + '<button data-copy="' + id + '">' + esc(t("copy")) + '</button></div>'
      + '<pre id="' + id + '">' + out + '</pre></div>';
  }


  /* ================= API ================= */

  var API = "/api";

  function cookie(name){
    var m = document.cookie.match("(^|;)\\s*" + name + "\\s*=\\s*([^;]+)");
    return m ? m.pop() : "";
  }

  function api(path, opts){
    opts = opts || {};
    var h = {"Content-Type": "application/json"};
    if (opts.method && opts.method !== "GET") h["X-CSRFToken"] = cookie("xc_csrf");
    return fetch(API + path, {
      method: opts.method || "GET",
      headers: h,
      credentials: "same-origin",
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function(r){
      return r.json().catch(function(){ return {}; }).then(function(d){
        return { ok: r.ok, status: r.status, data: d };
      });
    }).catch(function(){
      return { ok: false, status: 0, data: { detail: "Network error. Check your connection." } };
    });
  }

  /* ================= saying the words out loud =================

     A learner reading "annyeonghaseyo" still does not know how it
     sounds. The device already has voices; this just uses them.

     The word is found by its script, not by a separator, because the
     lessons are not written to one pattern. Korean day 1 reads
     "a  - like the a in father"; there is no " = " to split on. */

  var VOICE_FOR = {
    korean: "ko-KR", japanese: "ja-JP", alquran: "ar-SA",
    arabic: "ar-SA", german: "de-DE", french: "fr-FR",
    turkish: "tr-TR", spanish: "es-ES", chinese: "zh-CN"
  };

  // Hangul, Kana, Hanzi, Arabic. One run of them is a word to speak.
  var SCRIPT = /[\u0600-\u06FF\u3040-\u30FF\u3400-\u4DBF\u4E00-\u9FFF\uAC00-\uD7AF\u1100-\u11FF]+/g;

  var canSpeak = typeof window !== "undefined"
    && "speechSynthesis" in window
    && typeof window.SpeechSynthesisUtterance === "function";

  /* Wraps every run of foreign script in a tappable span. Takes text
     that is ALREADY escaped and only ever adds tags of its own, so a
     lesson file still cannot put markup on the page. */
  function speakable(safeText, courseId){
    if (!canSpeak) return safeText;
    var lang = VOICE_FOR[courseId];
    if (!lang) return safeText;
    SCRIPT.lastIndex = 0;
    return safeText.replace(SCRIPT, function(run){
      var clean = run.replace(/"/g, "&quot;");
      return '<span class="say" role="button" tabindex="0" '
        + 'data-say="' + clean + '" data-lang="' + lang + '" '
        + 'title="Hear it">' + run
        + '<span class="sayic" aria-hidden="true">\ud83d\udd0a</span></span>';
    });
  }

  var voicesReady = false;
  function warmVoices(){
    if (!canSpeak || voicesReady) return;
    // Voices arrive late on some browsers; asking early gets them loading
    window.speechSynthesis.getVoices();
    voicesReady = true;
  }

  function pickVoice(lang){
    var all = window.speechSynthesis.getVoices() || [];
    if (!all.length) return null;
    var base = lang.split("-")[0];
    var exact = all.filter(function(v){ return v.lang === lang; })[0];
    if (exact) return exact;
    // ko-KR asked for, ko_KR or plain ko offered - still the right voice
    var loose = all.filter(function(v){
      return (v.lang || "").replace("_", "-").split("-")[0] === base;
    })[0];
    return loose || null;
  }

  var saidOnce = false;
  function sayIt(text, lang, el){
    if (!canSpeak){
      if (!saidOnce){
        saidOnce = true;
        alert("This device has no speech built in, so the words cannot be "
            + "read aloud here.");
      }
      return;
    }
    try {
      window.speechSynthesis.cancel();
      var u = new window.SpeechSynthesisUtterance(text);
      var v = pickVoice(lang);
      if (v){
        u.voice = v;
        u.lang = v.lang;
      } else {
        // No voice for this language. Speak anyway with whatever is
        // there - a rough attempt beats a button that does nothing.
        u.lang = lang;
      }
      u.rate = 0.82;          // slow, because this is for learning
      if (el){
        el.classList.add("saying");
        u.onend = u.onerror = function(){ el.classList.remove("saying"); };
      }
      window.speechSynthesis.speak(u);
    } catch (e){}
  }

  document.addEventListener("click", function(e){
    var el = e.target.closest ? e.target.closest("[data-say]") : null;
    if (!el) return;
    e.preventDefault();
    warmVoices();
    sayIt(el.getAttribute("data-say"), el.getAttribute("data-lang"), el);
  });

  document.addEventListener("keydown", function(e){
    if (e.key !== "Enter" && e.key !== " ") return;
    var el = e.target && e.target.closest
      ? e.target.closest("[data-say]") : null;
    if (!el) return;
    e.preventDefault();
    warmVoices();
    sayIt(el.getAttribute("data-say"), el.getAttribute("data-lang"), el);
  });

  if (canSpeak && window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = function(){ voicesReady = true; };
  }

  var EYE_OPEN = '<svg viewBox="0 0 24 24"><path d="M2 12s3.6-7 10-7 10 7 10 7'
    + '-3.6 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg>';
  var EYE_SHUT = '<svg viewBox="0 0 24 24"><path d="M3 3l18 18"/>'
    + '<path d="M10.6 5.2A10.9 10.9 0 0 1 12 5c6.4 0 10 7 10 7a17.9 17.9 0 0 1-3.4 4.3"/>'
    + '<path d="M6.5 6.9C3.8 8.6 2 12 2 12s3.6 7 10 7a10.6 10.6 0 0 0 4.1-.8"/>'

  function fld(id, label, type, value, note, cls){
    var isPw = type === "password";
    var input = '<input id="' + id + '" type="' + type + '" value="' + esc(value || "") + '"'
      + (cls === "code" ? ' inputmode="numeric" maxlength="6"' : '')
      + (type === "email" ? ' autocomplete="email"' : '')
      + (isPw ? ' autocomplete="' + (authState.mode === "register" || authState.mode === "reset"
                                     ? "new-password" : "current-password") + '"' : '')
      + '>';
    if (isPw){
      input = '<span class="pw">' + input
        + '<button type="button" class="eye" data-eye="' + id + '"'
        + ' aria-label="Show password">' + EYE_OPEN + '</button></span>';
    }
    return '<div class="fld ' + (cls || "") + '">'
      + '<label for="' + id + '">' + esc(label) + '</label>'
      + input + (note ? '<p class="note">' + esc(note) + '</p>' : '') + '</div>';
  }

  function drawAuth(){
    var m = authState.mode, h = "";
    var msg = authState.msg
      ? '<div class="msg ' + authState.msgType + ' on">' + esc(authState.msg) + '</div>' : '';

    if (m === "signin"){

        + '<button class="primary" data-auth="signin">' + esc(authState.busy ? t("working") : t("signIn")) + '</button>'
        + '<div class="linkrow">'

        + '<span>' + esc(t("noAcc")) + ' <button data-auth="go-register">' + esc(t("register")) + '</button></span>'
        + '</div>';

    } else if (m === "register"){
      h = '<h3>' + esc(t("register")) + '</h3>'
        + '<p class="sub">' + esc(t("saveHint")) + '</p>' + msg
        + fld("aName", t("lName"), "text", "", t("nameHint"))
        + fld("aEmail", t("lEmail"), "email", authState.email)
        + fld("aPass", t("lPass"), "password", "")
        + '<button class="primary" data-auth="register">' + esc(authState.busy ? t("working") : t("register")) + '</button>'
        + '<div class="linkrow"><span>' + esc(t("haveAcc"))

        + fld("aCode", t("lCode"), "text", "", "", "code")
        + '<button class="primary" data-auth="verify">' + esc(authState.busy ? t("working") : t("signIn")) + '</button>'
        + '<div class="linkrow">'
        + '<button data-auth="resend">' + esc(t("resend")) + '</button>'
        + '<button data-auth="go-signin">' + esc(t("cancel")) + '</button></div>';

    } else if (m === "forgot"){
      h = '<h3>' + esc(t("forgot")) + '</h3>'
        + '<p class="sub">' + esc(t("vHint")) + '</p>' + msg
        + fld("aEmail", t("lEmail"), "email", authState.email)
        + '<button class="primary" data-auth="forgot">' + esc(authState.busy ? t("working") : t("resend")) + '</button>'
        + '<div class="linkrow"><button data-auth="go-signin">' + esc(t("cancel")) + '</button></div>';

    } else if (m === "reset"){
      h = '<h3>' + esc(t("newPass")) + '</h3>'
        + '<p class="sub">' + esc(t("vHint")) + '<br><b>' + esc(authState.email) + '</b></p>' + msg
        + fld("aCode", t("lCode"), "text", "", "", "code")
        + fld("aPass", t("newPass"), "password", "")
        + '<button class="primary" data-auth="reset">' + esc(authState.busy ? t("working") : t("newPass")) + '</button>'
        + '<div class="linkrow"><button data-auth="go-signin">' + esc(t("cancel")) + '</button></div>';
    }
    var keep = {};
    document.querySelectorAll("#sheetBody input").forEach(function(i){ keep[i.id] = i.value; });

    document.getElementById("sheetBody").innerHTML = h;

    // Browser autofill does not fire an input event, so values have to be
    // carried over by hand or they vanish on the next draw.
    Object.keys(keep).forEach(function(id){
      var i = document.getElementById(id);
      if (i && !i.value) i.value = keep[id];
    });

  function val(id){
